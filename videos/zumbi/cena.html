// zumbi: anda devagar com os braços para a frente e a cabeça caída
function zumbi(k, janelas, de, ate, t0, t1, seed = 1, extra) {
  const z = ator(k, janelas, { figurino: { preset: 'zumbi', cor: ROUPAS_Z[seed % 5], corPernas: ['#3A4A5A', '#4A3A2A', '#2A2A30'][seed % 3] }, ...PELE_Z, seed });
  if (de[0] !== ate[0]) { z.base(t0, t1, 'andar', { de, ate, passo: 70 * k }); } else z.base(t0, t1, 'parado', { x: de[0], y: de[1], vista: 'perfil', dir: extra?.dir ?? -1 });
  z.braco('ambos', t0, t1, 'estender'); z.cabeca(t0, t1, { inclinar: (seed % 2 ? 1 : -1) * 14, baixar: 6 }); z.expressao(t0, t1, 'zumbi'); z.sujeira(t0, t1);
  return z;
}

const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut' } });
const FADE = 0.2;
$$('.scene').forEach(s => gsap.set(s, { autoAlpha: 0 }));
$$('#fgs > g').forEach(s => gsap.set(s, { autoAlpha: 0 }));
function show(sel, t0, t1) {
  tl.fromTo(sel, { autoAlpha: 0 }, { autoAlpha: 1, duration: t0 === 0 ? 0.01 : FADE, ease: 'none', immediateRender: false }, t0);
  if (t1 != null) tl.to(sel, { autoAlpha: 0, duration: FADE, ease: 'none' }, t1);
}
function pop(sel, t, d = 0.4, ease = 'back.out(2.4)') {
  gsap.set(sel, { autoAlpha: 0, scale: 0.2, transformOrigin: '50% 50%' });
  tl.fromTo(sel, { autoAlpha: 0, scale: 0.2 }, { autoAlpha: 1, scale: 1, duration: d, ease, immediateRender: false }, t);
}
function hide(sel, t, d = 0.2) { tl.to(sel, { autoAlpha: 0, duration: d, ease: 'power1.in' }, t); }
function treme(sel, t, dur = 0.5, forca = 10) { tl.to(sel, { x: `+=${forca}`, duration: 0.05, repeat: Math.round(dur / 0.05), yoyo: true }, t).set(sel, { x: 0 }, t + dur + 0.06); }

// ===================== API DO RENDER =====================
function opacidade(t, janelas) {
  let o = 0;
  for (const [a, b] of janelas) {
    if (t < a || t > b + FADE) continue;
    const ent = a === 0 ? 1 : Math.min(1, (t - a) / FADE), sai = t <= b ? 1 : 1 - (t - b) / FADE;
    o = Math.max(o, Math.min(ent, sai));
  }
  return o;
}
function desenharAtores(t) {
  for (const A of ATORES) {
    const o = opacidade(t, A.janelas);
    A.g.style.display = o > 0 ? '' : 'none';
    A.g.setAttribute('opacity', o.toFixed(3));
    if (o > 0) A.b.desenhar(t);
  }
  carroFg.style.display = carroM1.style.display = (t >= T[1].se && t < T[1].ok + FADE) ? '' : 'none';
  motoG.style.display = (t >= T[4].se && t < T[4].ok + FADE) ? '' : 'none';
  bikeG.style.display = (t >= T[4].ok && t < T[4].fim + FADE) ? '' : 'none';
  const usados = new Set();
  for (const P of PROPS) {
    const o = opacidade(t, P.janelas);
    if (o <= 0) { if (!usados.has(P.el)) P.el.style.display = 'none'; continue; }
    usados.add(P.el);
    const [x, y] = P.ator.mao(P.mao);
    P.el.style.display = '';
    P.el.setAttribute('opacity', o.toFixed(3));
    P.el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${P.escala})`);
  }
}
window.__timeline = tl;
window.__duration = tl.duration();
window.__seek = t => { tl.seek(t, false); desenharAtores(t); leg.seek(t); };
window.__seek(0);
if (!rendering) {
  tl.eventCallback('onUpdate', () => { const t = tl.time(); desenharAtores(t); leg.seek(t); });
  document.addEventListener('click', () => tl.paused() ? tl.play() : tl.pause());
}

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Um dia na Roma Antiga</title>
<!--
  Vídeo vertical (1080x1920) — skills "edit" (render) e "movimento-humano" (boneco articulado com IK),
  cenários coloridos da Roma Antiga trocando conforme a narração (fala.mp3).
  Cenários na timeline GSAP (tl); bonecos desenhados por boneco.js em __seek. Sem legenda.
-->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; display: block; }
  @font-face { font-family: 'Luckiest Guy'; src: url(fontes/luckiest-guy.woff2); }
  /* identidade-visual: Luckiest Guy em todo texto que não define a própria fonte (cenário mantém a sua) */
  text:not([font-family]) { font-family: 'Luckiest Guy', 'DejaVu Sans', sans-serif; }
</style>
<script src="gsap.min.js"></script>
<script src="lipsync.js" onerror="window.LIPSYNC = null"></script>
<script src="boneco.js"></script>
<script src="cenario.js"></script>
<script src="marca.js"></script>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
      <feFlood flood-color="#1D1D2B"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5DB7EE"/><stop offset="1" stop-color="#C9EBFF"/></linearGradient>
    <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1230"/><stop offset="1" stop-color="#2B2F5E"/></linearGradient>
    <linearGradient id="skyDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6A97A"/><stop offset=".6" stop-color="#FBD9A6"/><stop offset="1" stop-color="#FFF0CF"/></linearGradient>
    <radialGradient id="fireGlow" cx=".5" cy=".7" r=".7"><stop offset="0" stop-color="#FF8A2B" stop-opacity=".85"/><stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD27A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>
    <pattern id="cobble" width="90" height="50" patternUnits="userSpaceOnUse">
      <rect width="90" height="50" fill="#9C958A"/>
      <rect x="3" y="3" width="40" height="20" rx="8" fill="#B5AEA2"/><rect x="47" y="3" width="40" height="20" rx="8" fill="#ADA699"/>
      <rect x="-20" y="27" width="40" height="20" rx="8" fill="#ADA699"/><rect x="25" y="27" width="40" height="20" rx="8" fill="#B5AEA2"/><rect x="70" y="27" width="40" height="20" rx="8" fill="#B5AEA2"/>
    </pattern>
    <pattern id="stoneTiles" width="160" height="80" patternUnits="userSpaceOnUse">
      <rect width="160" height="80" fill="#8E877C"/>
      <rect x="4" y="4" width="72" height="34" rx="4" fill="#A39C90"/><rect x="84" y="4" width="72" height="34" rx="4" fill="#9A9387"/>
      <rect x="-36" y="44" width="72" height="34" rx="4" fill="#9A9387"/><rect x="44" y="44" width="72" height="34" rx="4" fill="#A39C90"/><rect x="124" y="44" width="72" height="34" rx="4" fill="#A39C90"/>
    </pattern>
    <pattern id="stoneWall" width="120" height="60" patternUnits="userSpaceOnUse">
      <rect width="120" height="60" fill="#C9B79A"/>
      <path d="M0 30 H120 M60 0 V30 M0 30 V60 M120 30 V60" stroke="#B19E80" stroke-width="4"/>
    </pattern>
    <pattern id="planks" width="60" height="40" patternUnits="userSpaceOnUse">
      <rect width="60" height="40" fill="#A8743F"/>
      <path d="M0 0 H60 M0 20 H60 M20 0 V20 M45 20 V40" stroke="#8A5A2E" stroke-width="3"/>
    </pattern>
    <pattern id="planksNight" width="60" height="40" patternUnits="userSpaceOnUse">
      <rect width="60" height="40" fill="#3A2A2A"/>
      <path d="M0 0 H60 M0 20 H60 M20 0 V20 M45 20 V40" stroke="#2A1D1F" stroke-width="3"/>
    </pattern>
    <pattern id="tiles" width="40" height="30" patternUnits="userSpaceOnUse">
      <rect width="40" height="30" fill="#C8553D"/><path d="M0 15 Q10 0 20 15 Q30 0 40 15" stroke="#A23E2B" stroke-width="4" fill="none"/>
    </pattern>
  </defs>

  <g id="scenes"></g>
  <g id="atores"></g>
  <g id="fgs"></g>
  <g id="props"></g>
</svg>

<script>
// ===================== CONFIG =====================
const CONFIG = { fps: 30, palavrasPorLinha: 4, seed: 11, cauda: 2.2 };
const COR = { tinta: '#1D1D2B', branco: '#FFFFFF', destaque: '#FFC24B', apagado: '#9C9AB0', terracota: '#C8553D', ouro: '#FF7A00' };
const NS = 'http://www.w3.org/2000/svg';
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(CONFIG.seed);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

// ===================== PEÇAS DE CENÁRIO =====================
// prédio romano de madeira (insula), torto
function insula(p, x, w, top, night) {
  const wall = night ? 'url(#planksNight)' : 'url(#planks)';
  const win = night ? '#FFD27A' : '#2B1B12';
  let s = `<path d="M${x} 1700 L${x + 6} ${top + 40} L${x + w - 10} ${top + 20} L${x + w} 1700 Z" fill="${wall}" stroke="#1D1D2B" stroke-width="8"/>
    <path d="M${x - 30} ${top + 50} L${x + w / 2} ${top - 60} L${x + w + 30} ${top + 25} Z" fill="url(#tiles)" stroke="#1D1D2B" stroke-width="8"/>`;
  const floors = 4, fh = (1700 - top - 40) / floors;
  for (let f = 0; f < floors; f++) {
    const y = top + 40 + f * fh;
    s += `<path d="M${x} ${y + fh} H${x + w}" stroke="#5E3B1C" stroke-width="10"/>`;
    if (f === floors - 1) { // térreo: lojas com arcos
      for (let k = 0; k < 2; k++) { const ax = x + 50 + k * (w / 2); s += `<path d="M${ax} 1700 V${y + 120} Q${ax + 90} ${y + 40} ${ax + 180} ${y + 120} V1700 Z" fill="${night ? '#120C0C' : '#3B2416'}" stroke="#1D1D2B" stroke-width="6"/>`; }
    } else {
      for (let k = 0; k < 2; k++) { const wx = x + 60 + k * (w / 2); if (!(p === 'a' && f === 0 && k === 0)) s += `<rect x="${wx}" y="${y + 70}" width="${w / 2 - 120}" height="${fh - 150}" fill="${win}" stroke="#1D1D2B" stroke-width="6"/>`; }
    }
  }
  return s;
}
function flame(x, y, s, i) {
  return `<g class="flame" data-i="${i}" transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 C-60 -10 -50 -90 -10 -150 C-15 -100 20 -90 15 -150 C60 -90 60 -10 0 0Z" fill="#FF6A2B"/><path d="M0 -6 C-30 -10 -28 -60 -4 -90 C0 -60 20 -55 14 -85 C38 -50 30 -10 0 -6Z" fill="#FFD24B"/></g>`;
}
function stamp(id, x, y, txt, cor, rot = -8, fs = 92) { return `<g id="${id}">${Marca.carimbo(x, y, txt, { fs, rot })}</g>`; }
function card(id, bg, n, titulo, icone) { return Marca.cartao({ id, numero: `${n}º`, titulo, icone }); }

// ===================== CENAS =====================
const scenes = [];
// Cenários montados com a skill "cenario-ilustrado" (cenario.js): luz de um lado, volume, textura, desgaste, vida.
const degraus = (cor, luzCor) => { let d = ''; for (let k = 0; k < 12; k++) { const x = k * 90, y = 1800 - k * 92; d += `<rect x="${x}" y="${y - 92}" width="90" height="${1920 - y + 92}" fill="${cor}"/><rect x="${x}" y="${y - 92}" width="90" height="12" fill="${luzCor}" opacity=".7"/><rect x="${x}" y="${y - 80}" width="10" height="80" fill="#000" opacity=".18"/>`; } return d; };
// S1 — quarto de pedra
{ const C = Cenario({ seed: 3, luz: 1, hora: 'interior', prefixo: 'k1' });
  let v = `<g id="s1" class="scene"><defs>${C.defs()}</defs>`;
  v += C.parede({ x: 0, y: 0, w: 1080, h: 1320, cor: '#B9AA92', tijolo: '#8E6E58', desgaste: 2 });
  for (let k = 0; k < 5; k++) v += `<rect x="${-20 + k * 240}" y="0" width="70" height="110" fill="#6B4A2E" stroke="#1D1D2B" stroke-width="5"/><rect x="${-20 + k * 240}" y="96" width="70" height="14" fill="#000" opacity=".25"/>`;
  v += `<rect x="0" y="90" width="1080" height="34" fill="#7A5434" stroke="#1D1D2B" stroke-width="5"/>`;
  v += `<rect x="700" y="560" width="220" height="260" fill="#A9DDF7"/><circle cx="860" cy="610" r="34" fill="#FFF0A8" opacity=".8"/><path d="M700 720 Q760 690 820 712 T920 700 V820 H700Z" fill="#C9A27C"/>`;
  v += `<path d="M810 560 V820 M700 690 H920" stroke="#5A4632" stroke-width="12"/><rect x="700" y="560" width="220" height="260" fill="none" stroke="#5A4632" stroke-width="18"/><rect x="684" y="820" width="252" height="20" fill="#8A7458" stroke="#1D1D2B" stroke-width="4"/>`;
  v += C.piso({ y: 1300, h: 620, cor: '#8E877C' });
  v += `<path d="M700 820 L520 1300 L1080 1300 L1080 1000 L920 820Z" fill="#FFF3C4" opacity=".22"/><path d="M520 1300 L330 1920 H1080 V1300Z" fill="#FFE7A8" opacity=".16"/>`;
  v += `<rect x="60" y="860" width="320" height="22" fill="#7A5434" stroke="#1D1D2B" stroke-width="4"/><path d="M80 882 l20 40 M340 882 l-20 40" stroke="#5E3B1C" stroke-width="8"/>`;
  v += C.anfora(130, 860, 0.45) + C.anfora(330, 860, 0.38) + C.lamparina(230, 846, false);
  v += C.anfora(980, 1330, 0.9) + C.anfora(900, 1340, 0.7);
  v += `<g id="s1-mat"><rect x="150" y="1490" width="660" height="100" rx="24" fill="#D9B45A" stroke="#1D1D2B" stroke-width="6"/>` + [...Array(10)].map((_, k) => `<path d="M${190 + k * 60} 1500 V1580" stroke="#B8923A" stroke-width="5"/>`).join('') + `<rect x="160" y="1470" width="150" height="56" rx="26" fill="#EFE3C6" stroke="#1D1D2B" stroke-width="5"/><path d="M520 1490 Q600 1460 700 1500 L720 1590 H500Z" fill="#7A6AA8" stroke="#1D1D2B" stroke-width="5"/></g>`;
  v += `  <g id="s1-smoke" fill="#E8E2D8" opacity=".85">${[0, 1, 2].map(k => `<g class="smoke"><circle cx="${120 + k * 120}" cy="1200" r="${50 + k * 10}"/><circle cx="${170 + k * 120}" cy="1150" r="${40 + k * 8}"/></g>`).join('')}</g>` + `  <g id="s1-fish" transform="translate(300 1720)"><path d="M-110 0 Q-60 -50 40 0 Q-60 50 -110 0Z" fill="none" stroke="#FFF" stroke-width="10"/><path d="M-80 -20 V20 M-50 -28 V28 M-20 -28 V28 M10 -20 V20 M40 0 L90 -40 V40 Z" stroke="#FFF" stroke-width="10" fill="#FFF"/><circle cx="-92" cy="-6" r="7" fill="#1D1D2B"/>
    <g id="s1-stink" stroke="#7CC46A" stroke-width="10" fill="none" stroke-linecap="round"><path d="M-60 -70 q20 -30 0 -60 q-20 -30 0 -60"/><path d="M-10 -80 q20 -30 0 -60 q-20 -30 0 -60"/><path d="M40 -70 q20 -30 0 -60 q-20 -30 0 -60"/></g></g>` + `  <g id="s1-q" fill="${COR.ouro}" stroke="#1D1D2B" stroke-width="8" paint-order="stroke"><text id="s1-q1" x="600" y="1000" font-size="130">?</text><text id="s1-q2" x="700" y="930" font-size="100">?</text><text id="s1-q3" x="520" y="900" font-size="90">?</text></g>` + C.atmosfera({ grao: 0.3 }) + `</g>`;
  scenes.push(v); }
// S2 — janela com vista de Roma
{ const C = Cenario({ seed: 5, luz: 1, hora: 'tarde', prefixo: 'k2' });
  let v = `<g id="s2" class="scene"><defs>${C.defs()}<clipPath id="k2-arco"><path d="M200 1450 V700 Q200 420 600 420 Q1000 420 1000 700 V1450Z"/></clipPath></defs>`;
  v += C.parede({ x: 0, y: 0, w: 1080, h: 1500, cor: '#C4B49A', tijolo: '#8E6E58', desgaste: 2 });
  v += `<g id="s2-view"><g clip-path="url(#k2-arco)">` + C.ceu({ w: 1080, h: 1500, astroX: 860, astroY: 600, nuvens: 2 }) + C.distante({ y: 1060, tipo: 'roma', profundidade: 0.05 });
  v += `<g id="s2-coliseu">` + C.coliseu({ x: 400, base: 1130, w: 480, h: 210 }) + `</g>`;
  v += C.distante({ y: 1200, tipo: 'roma', profundidade: 0.4, cor: '#C9A27C' });
  v += `<g id="s2-aqueduto">` + C.aqueduto({ x: 160, base: 1250, w: 380, h: 230, vaos: 3 }) + `</g>`;
  v += C.cipreste(470, 1290, 300) + C.cipreste(940, 1300, 330) + C.pinheiro(760, 1320, 220);
  [[220, 1330, 200, '#E9D6B2'], [470, 1360, 260, '#E3C9A0'], [780, 1340, 220, '#EAD3AE']].forEach(([x, y, w, c]) => { v += `<rect x="${x}" y="${y}" width="${w}" height="200" fill="${c}" stroke="#1D1D2B" stroke-width="5"/>` + C.telhado({ x, y, w, h: 60, beiral: 16 }) + `<rect x="${x + w * 0.2}" y="${y + 40}" width="34" height="46" fill="#2A1C14"/><rect x="${x + w * 0.6}" y="${y + 40}" width="34" height="46" fill="#2A1C14"/>`; });
  v += C.atmosfera({ grao: 0, vinheta: false, raios: true }) + `</g>`;
  v += `<path d="M200 1450 V700 Q200 420 600 420 Q1000 420 1000 700 V1450Z" fill="none" stroke="#5A4632" stroke-width="34"/><path d="M215 1450 V700 Q215 436 600 436" fill="none" stroke="#7A5E44" stroke-width="8"/>`;
  v += `<rect x="150" y="1440" width="900" height="56" fill="#8A7458" stroke="#1D1D2B" stroke-width="6"/><rect x="150" y="1440" width="900" height="12" fill="#B29A7A"/></g>`;
  v += C.piso({ y: 1490, h: 430, cor: '#8E877C' }) + C.vaso(1000, 1440, '#D7263D');
  v += `  <g id="s2-banner" transform="translate(600 1250)">${Marca.faixa(0, 0, 'ROMA ANTIGA', { fs: 100 })}</g>` + C.atmosfera({ grao: 0.3 }) + `</g>`;
  scenes.push(v); }
// S3 — rua com prédios romanos (insulae)
const ruaS3 = (noite) => {
  const C = Cenario({ seed: 8, luz: 1, hora: noite ? 'noite' : 'dia', prefixo: noite ? 'k7' : 'k3' });
  let v = `<defs>${C.defs()}</defs>` + C.ceu({ astroX: 900, astroY: 230, nuvens: noite ? 0 : 3 });
  v += C.distante({ y: 760, tipo: 'roma', profundidade: 0.15 }) + C.distante({ y: 900, tipo: 'roma', profundidade: 0.45, cor: '#C9A27C' });
  v += `<g id="${noite ? 's7-insula' : 's3-insula'}">` + C.insula({ x: 40, base: 1700, w: 600, top: 330, andares: 4, pular: ['0-0', '0-1'], noite, luzes: noite ? ['1-0', '2-1'] : [], grafite: 'CAVE CANEM' });
  v += C.janela({ x: 190, y: 460, w: 260, h: 190, cor: '#E3C9A0', aberta: true, noite, luzAcesa: noite }) + (noite ? '' : C.hera(60, 1080, 420)) + `</g>`;
  v += `<g id="${noite ? 's7-direita' : 's3-direita'}">` + C.insula({ x: 690, base: 1700, w: 420, top: 640, andares: 3, cor: '#D9B48A', pular: ['0-0', '0-1'], sacada: 0, noite, luzes: noite ? ['1-1'] : [], grafite: noite ? null : 'SPQR' });
  v += C.janela({ x: 780, y: 740, w: 190, h: 160, cor: '#D9B48A', aberta: true, noite, luzAcesa: noite }) + `</g>`;
  if (!noite) v += C.varal(640, 1060, 690, 1080) + C.toldo(740, 1440, 300);
  v += C.calcada({ y: 1700, h: 220 }) + C.sombraChao(40, 600, 1700, 100) + C.sombraChao(690, 420, 1700, 100);
  if (!noite) v += C.pombo(470, 668, 0.9) + C.pombo(600, 1752, 1.1, -1) + C.anfora(980, 1780, 0.6);
  return { C, v };
};
{ const { C, v } = ruaS3(false); scenes.push(`<g id="s3" class="scene">${v}  <g id="s3-balde"><g id="s3-bucket"><path d="M830 820 h90 l-10 80 h-70z" fill="#8A6A3A" stroke="#1D1D2B" stroke-width="6"/><path d="M830 820 q45 -40 90 0" stroke="#1D1D2B" stroke-width="5" fill="none"/></g></g>
  <ellipse id="s3-blob" cx="0" cy="0" rx="34" ry="44" fill="#6B4A1F" stroke="#1D1D2B" stroke-width="5"/>
  <g id="s3-splat" transform="translate(800 1755)"><ellipse rx="130" ry="26" fill="#6B4A1F" stroke="#1D1D2B" stroke-width="5"/><circle cx="-110" cy="-60" r="14" fill="#6B4A1F"/><circle cx="90" cy="-80" r="12" fill="#6B4A1F"/><circle cx="20" cy="-110" r="10" fill="#6B4A1F"/></g>
  <g id="s3-grito" transform="translate(330 1420)">${Marca.balao(0, 0, 'CUIDADO!', { ponta: [-80, 150] })}</g>
  <g id="s3-andar" transform="translate(320 860)">${Marca.etiqueta(0, 0, '3º ANDAR')}</g>${C.atmosfera({ grao: 0.3, raios: true })}</g>`); }
// S4 — desafio 1: fome
scenes.push(card('c1', '#F2A541', 1, 'A FOME', `<ellipse cx="0" cy="40" rx="150" ry="40" fill="#8A5A2E" stroke="#1D1D2B" stroke-width="8"/><path d="M-150 40 Q0 200 150 40" fill="#A8743F" stroke="#1D1D2B" stroke-width="8"/>`));
scenes.push(`<g id="s4b" class="scene"><rect width="1080" height="1920" fill="#F7D9A8"/>
  <g id="s4-gel" transform="translate(300 900)"><rect x="-130" y="-230" width="260" height="460" rx="24" fill="#FFF" stroke="#1D1D2B" stroke-width="10"/><path d="M-130 -60 H130" stroke="#1D1D2B" stroke-width="8"/><rect x="80" y="-180" width="16" height="80" rx="8" fill="#1D1D2B"/><rect x="80" y="-20" width="16" height="120" rx="8" fill="#1D1D2B"/>
    <g id="s4-x1" stroke-linecap="round"><path d="M-170 -250 L170 250 M170 -250 L-170 250" stroke="#111111" stroke-width="52"/><path d="M-170 -250 L170 250 M170 -250 L-170 250" stroke="#FF7A00" stroke-width="32"/></g></g>
  <g id="s4-merc" transform="translate(780 900)"><path d="M-170 -60 H170 L140 140 H-140Z" fill="#FFF" stroke="#1D1D2B" stroke-width="10"/><path d="M-200 -140 H-150 L-110 140" stroke="#1D1D2B" stroke-width="10" fill="none"/><circle cx="-100" cy="200" r="30" fill="#1D1D2B"/><circle cx="110" cy="200" r="30" fill="#1D1D2B"/>
    <g id="s4-x2" stroke-linecap="round"><path d="M-190 -200 L190 250 M190 -200 L-190 250" stroke="#111111" stroke-width="52"/><path d="M-190 -200 L190 250 M190 -200 L-190 250" stroke="#FF7A00" stroke-width="32"/></g></g>
  <rect y="1700" width="1080" height="220" fill="#E0B97F"/>
</g>`);
// S4c — banca do mercado
{ const C = Cenario({ seed: 12, luz: 1, hora: 'dia', prefixo: 'k4' });
  let v = `<g id="s4c" class="scene"><defs>${C.defs()}</defs>` + C.ceu({ astroX: 950, astroY: 260, nuvens: 2 });
  v += C.distante({ y: 700, tipo: 'roma', profundidade: 0.2 });
  v += C.insula({ x: -10, base: 1700, w: 1100, top: 560, andares: 3, cor: '#E6CFA6', pular: ['0-1', '0-2', '1-1', '1-2', '1-3'], sacada: 0, grafite: 'VENDO GARVM' });
  v += C.toldo(580, 880, 440, ['#D7263D', '#F2E6C9']);
  v += `<path d="M590 1010 V1270 M1030 1010 V1270" stroke="#5E3B1C" stroke-width="16"/>`;
  v += C.anfora(80, 1700, 0.8) + C.anfora(150, 1712, 0.65) + `<path d="M380 1700 l40 -70 h120 l40 70Z" fill="#B07A48" stroke="#1D1D2B" stroke-width="5"/>` + [0, 1, 2, 3, 4].map(k => `<circle cx="${430 + k * 22}" cy="${1622 - (k % 2) * 12}" r="16" fill="${['#E0A030', '#D7263D', '#8CC74A'][k % 3]}" stroke="#1D1D2B" stroke-width="3"/>`).join('');
  v += C.calcada({ y: 1700, h: 220 }) + C.pombo(330, 1760, 1) + C.sombraChao(-10, 1100, 1700, 80);
  v += `  <g id="s4-pao" transform="translate(690 1235)"><ellipse rx="70" ry="38" fill="#D9A15B" stroke="#1D1D2B" stroke-width="6"/><path d="M-40 -18 l16 22 M-5 -28 l16 22 M30 -18 l14 20" stroke="#A56E2E" stroke-width="7"/>
    ${Marca.etiqueta(0, -90, 'DURO', { fs: 36 })}</g>

// ===================== API DO RENDER =====================
function opacidade(t, janelas) {
  let o = 0;
  for (const [a, b] of janelas) {
    if (t < a || t > b + FADE) continue;
    const ent = a === 0 ? 1 : Math.min(1, (t - a) / FADE), sai = t <= b ? 1 : 1 - (t - b) / FADE;
    o = Math.max(o, Math.min(ent, sai));
  }
  return o;
}
function desenharAtores(t) {
  for (const A of ATORES) {
    const o = opacidade(t, A.janelas);
    A.g.style.display = o > 0 ? '' : 'none';
    A.g.setAttribute('opacity', o.toFixed(3));
    if (o > 0) A.b.desenhar(t);
  }
  const usados = new Set();
  for (const P of PROPS) {
    const o = opacidade(t, P.janelas);
    if (o <= 0) { if (!usados.has(P.el)) P.el.style.display = 'none'; continue; }
    usados.add(P.el);
    const [x, y] = P.ator.mao(P.mao);
    P.el.style.display = '';
    P.el.setAttribute('opacity', o.toFixed(3));
    P.el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${P.escala})`);
  }
}
window.__timeline = tl;
window.__duration = tl.duration();
window.__seek = t => { tl.seek(t, false); desenharAtores(t); };
window.__seek(0);
if (!rendering) {
  tl.eventCallback('onUpdate', () => desenharAtores(tl.time()));

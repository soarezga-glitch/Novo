<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Um dia na Roma Antiga</title>
<!--
  Vídeo vertical (1080x1920) — skills "edit" (render) e "movimento-humano" (boneco articulado com IK),
  cenários coloridos da Roma Antiga trocando conforme a narração (fala.mp3).
  Cenários na timeline GSAP (tl); bonecos desenhados por boneco.js em __seek. Sem legenda.
-->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; display: block; }
  text { font-family: Inter, 'DejaVu Sans', sans-serif; font-weight: 800; }
</style>
<script src="gsap.min.js"></script>
<script src="lipsync.js" onerror="window.LIPSYNC = null"></script>
<script src="boneco.js"></script>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
      <feFlood flood-color="#1D1D2B"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5DB7EE"/><stop offset="1" stop-color="#C9EBFF"/></linearGradient>
    <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1230"/><stop offset="1" stop-color="#2B2F5E"/></linearGradient>
    <linearGradient id="skyDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6A97A"/><stop offset=".6" stop-color="#FBD9A6"/><stop offset="1" stop-color="#FFF0CF"/></linearGradient>
    <radialGradient id="fireGlow" cx=".5" cy=".7" r=".7"><stop offset="0" stop-color="#FF8A2B" stop-opacity=".85"/><stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD27A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>
    <pattern id="cobble" width="90" height="50" patternUnits="userSpaceOnUse">
      <rect width="90" height="50" fill="#9C958A"/>
      <rect x="3" y="3" width="40" height="20" rx="8" fill="#B5AEA2"/><rect x="47" y="3" width="40" height="20" rx="8" fill="#ADA699"/>
      <rect x="-20" y="27" width="40" height="20" rx="8" fill="#ADA699"/><rect x="25" y="27" width="40" height="20" rx="8" fill="#B5AEA2"/><rect x="70" y="27" width="40" height="20" rx="8" fill="#B5AEA2"/>
    </pattern>
    <pattern id="stoneTiles" width="160" height="80" patternUnits="userSpaceOnUse">
      <rect width="160" height="80" fill="#8E877C"/>
      <rect x="4" y="4" width="72" height="34" rx="4" fill="#A39C90"/><rect x="84" y="4" width="72" height="34" rx="4" fill="#9A9387"/>
      <rect x="-36" y="44" width="72" height="34" rx="4" fill="#9A9387"/><rect x="44" y="44" width="72" height="34" rx="4" fill="#A39C90"/><rect x="124" y="44" width="72" height="34" rx="4" fill="#A39C90"/>
    </pattern>
    <pattern id="stoneWall" width="120" height="60" patternUnits="userSpaceOnUse">
      <rect width="120" height="60" fill="#C9B79A"/>
      <path d="M0 30 H120 M60 0 V30 M0 30 V60 M120 30 V60" stroke="#B19E80" stroke-width="4"/>
    </pattern>
    <pattern id="planks" width="60" height="40" patternUnits="userSpaceOnUse">
      <rect width="60" height="40" fill="#A8743F"/>
      <path d="M0 0 H60 M0 20 H60 M20 0 V20 M45 20 V40" stroke="#8A5A2E" stroke-width="3"/>
    </pattern>
    <pattern id="planksNight" width="60" height="40" patternUnits="userSpaceOnUse">
      <rect width="60" height="40" fill="#3A2A2A"/>
      <path d="M0 0 H60 M0 20 H60 M20 0 V20 M45 20 V40" stroke="#2A1D1F" stroke-width="3"/>
    </pattern>
    <pattern id="tiles" width="40" height="30" patternUnits="userSpaceOnUse">
      <rect width="40" height="30" fill="#C8553D"/><path d="M0 15 Q10 0 20 15 Q30 0 40 15" stroke="#A23E2B" stroke-width="4" fill="none"/>
    </pattern>
  </defs>

  <g id="scenes"></g>
  <g id="atores"></g>
  <g id="fgs"></g>
  <g id="props"></g>
</svg>

<script>
// ===================== CONFIG =====================
const CONFIG = { fps: 30, palavrasPorLinha: 4, seed: 11, cauda: 2.2 };
const COR = { tinta: '#1D1D2B', branco: '#FFFFFF', destaque: '#FFC24B', apagado: '#9C9AB0', terracota: '#C8553D', ouro: '#F2C14E' };
const NS = 'http://www.w3.org/2000/svg';
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(CONFIG.seed);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

// ===================== PEÇAS DE CENÁRIO =====================
// prédio romano de madeira (insula), torto
function insula(p, x, w, top, night) {
  const wall = night ? 'url(#planksNight)' : 'url(#planks)';
  const win = night ? '#FFD27A' : '#2B1B12';
  let s = `<path d="M${x} 1700 L${x + 6} ${top + 40} L${x + w - 10} ${top + 20} L${x + w} 1700 Z" fill="${wall}" stroke="#1D1D2B" stroke-width="8"/>
    <path d="M${x - 30} ${top + 50} L${x + w / 2} ${top - 60} L${x + w + 30} ${top + 25} Z" fill="url(#tiles)" stroke="#1D1D2B" stroke-width="8"/>`;
  const floors = 4, fh = (1700 - top - 40) / floors;
  for (let f = 0; f < floors; f++) {
    const y = top + 40 + f * fh;
    s += `<path d="M${x} ${y + fh} H${x + w}" stroke="#5E3B1C" stroke-width="10"/>`;
    if (f === floors - 1) { // térreo: lojas com arcos
      for (let k = 0; k < 2; k++) { const ax = x + 50 + k * (w / 2); s += `<path d="M${ax} 1700 V${y + 120} Q${ax + 90} ${y + 40} ${ax + 180} ${y + 120} V1700 Z" fill="${night ? '#120C0C' : '#3B2416'}" stroke="#1D1D2B" stroke-width="6"/>`; }
    } else {
      for (let k = 0; k < 2; k++) { const wx = x + 60 + k * (w / 2); if (!(p === 'a' && f === 0 && k === 0)) s += `<rect x="${wx}" y="${y + 70}" width="${w / 2 - 120}" height="${fh - 150}" fill="${win}" stroke="#1D1D2B" stroke-width="6"/>`; }
    }
  }
  return s;
}
function flame(x, y, s, i) {
  return `<g class="flame" data-i="${i}" transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 C-60 -10 -50 -90 -10 -150 C-15 -100 20 -90 15 -150 C60 -90 60 -10 0 0Z" fill="#FF6A2B"/><path d="M0 -6 C-30 -10 -28 -60 -4 -90 C0 -60 20 -55 14 -85 C38 -50 30 -10 0 -6Z" fill="#FFD24B"/></g>`;
}
function stamp(id, x, y, txt, cor, rot = -8, fs = 92) {
  return `<g id="${id}" transform="translate(${x} ${y}) rotate(${rot})"><rect x="-${txt.length * fs * 0.36 + 40}" y="-${fs * 0.85}" width="${txt.length * fs * 0.72 + 80}" height="${fs * 1.35}" rx="18" fill="none" stroke="${cor}" stroke-width="12"/><text x="0" y="${fs * 0.3}" font-size="${fs}" fill="${cor}" text-anchor="middle">${txt}</text></g>`;
}
function card(id, bg, n, titulo, icone) {
  return `<g id="${id}" class="scene"><rect width="1080" height="1920" fill="${bg}"/>
    <g opacity=".12" fill="#fff">${[0, 1, 2, 3, 4].map(k => `<rect x="${60 + k * 230}" y="0" width="70" height="1920"/>`).join('')}</g>
    <g id="${id}-n"><circle cx="540" cy="760" r="170" fill="#1D1D2B"/><text x="540" y="820" font-size="180" fill="${COR.ouro}" text-anchor="middle">${n}º</text></g>
    <text id="${id}-d" x="540" y="1040" font-size="80" fill="#1D1D2B" text-anchor="middle" letter-spacing="8">DESAFIO</text>
    <g id="${id}-t"><text x="540" y="1200" font-size="128" fill="#FFF" text-anchor="middle" stroke="#1D1D2B" stroke-width="12" paint-order="stroke">${titulo}</text></g>
    <g id="${id}-i" transform="translate(540 1420)">${icone}</g></g>`;
}

// ===================== CENAS =====================
const scenes = [];
// S1 — quarto de pedra
scenes.push(`<g id="s1" class="scene">
  <rect width="1080" height="1920" fill="url(#stoneWall)"/>
  <rect y="1300" width="1080" height="620" fill="url(#stoneTiles)"/><path d="M0 1300 H1080" stroke="#6E675C" stroke-width="10"/>
  <g><rect x="700" y="560" width="220" height="260" fill="#8ED1F5" stroke="#5A4632" stroke-width="16"/><path d="M810 560 V820 M700 690 H920" stroke="#5A4632" stroke-width="10"/><path d="M700 820 L560 1300 L1060 1300 L920 820Z" fill="#FFF3C4" opacity=".25"/></g>
  <rect id="s1-mat" x="160" y="1500" width="640" height="90" rx="20" fill="#D9B45A" stroke="#1D1D2B" stroke-width="6"/>
  <g id="s1-smoke" fill="#E8E2D8" opacity=".85">${[0, 1, 2].map(k => `<g class="smoke"><circle cx="${120 + k * 120}" cy="1200" r="${50 + k * 10}"/><circle cx="${170 + k * 120}" cy="1150" r="${40 + k * 8}"/></g>`).join('')}</g>
  <g id="s1-fish" transform="translate(300 1720)"><path d="M-110 0 Q-60 -50 40 0 Q-60 50 -110 0Z" fill="none" stroke="#FFF" stroke-width="10"/><path d="M-80 -20 V20 M-50 -28 V28 M-20 -28 V28 M10 -20 V20 M40 0 L90 -40 V40 Z" stroke="#FFF" stroke-width="10" fill="#FFF"/><circle cx="-92" cy="-6" r="7" fill="#1D1D2B"/>
    <g id="s1-stink" stroke="#7CC46A" stroke-width="10" fill="none" stroke-linecap="round"><path d="M-60 -70 q20 -30 0 -60 q-20 -30 0 -60"/><path d="M-10 -80 q20 -30 0 -60 q-20 -30 0 -60"/><path d="M40 -70 q20 -30 0 -60 q-20 -30 0 -60"/></g></g>
  <g id="s1-q" fill="${COR.ouro}" stroke="#1D1D2B" stroke-width="8" paint-order="stroke"><text id="s1-q1" x="600" y="1000" font-size="130">?</text><text id="s1-q2" x="700" y="930" font-size="100">?</text><text id="s1-q3" x="520" y="900" font-size="90">?</text></g>
</g>`);
// S2 — janela com vista de Roma
scenes.push(`<g id="s2" class="scene">
  <rect width="1080" height="1920" fill="url(#stoneWall)"/>
  <g id="s2-view">
    <path d="M200 1450 V700 Q200 420 600 420 Q1000 420 1000 700 V1450Z" fill="url(#skyDay)"/>
    <g clip-path="none">
      <circle cx="860" cy="590" r="55" fill="#FFE07A"/>
      <path d="M200 1180 Q400 1080 600 1150 T1000 1120 V1450 H200Z" fill="#7FBF6A"/>
      <g id="s2-coliseu"><ellipse cx="640" cy="1080" rx="260" ry="60" fill="#E2C9A0" stroke="#1D1D2B" stroke-width="6"/><rect x="380" y="900" width="520" height="180" fill="#E8D2AA" stroke="#1D1D2B" stroke-width="6"/>${[0, 1, 2].map(r => [0, 1, 2, 3, 4, 5, 6, 7].map(c => `<path d="M${400 + c * 62} ${1060 - r * 58} v-28 q14 -20 28 0 v28z" fill="#9C7A52"/>`).join('')).join('')}<path d="M380 900 Q640 860 900 900" stroke="#1D1D2B" stroke-width="6" fill="none"/></g>
      <g id="s2-aqueduto" fill="#CDB591" stroke="#1D1D2B" stroke-width="5"><rect x="200" y="980" width="200" height="30"/>${[0, 1, 2].map(k => `<path d="M${205 + k * 65} 1010 h55 v170 h-12 q-15 -60 -31 0 h-12z"/>`).join('')}</g>
      <g fill="url(#tiles)" stroke="#1D1D2B" stroke-width="5"><path d="M220 1300 L330 1230 L440 1300Z"/><path d="M460 1320 L600 1240 L740 1320Z"/><path d="M760 1300 L880 1220 L1000 1300Z"/></g>
      <g fill="#F1E3C6" stroke="#1D1D2B" stroke-width="5"><rect x="240" y="1300" width="180" height="150"/><rect x="480" y="1320" width="240" height="130"/><rect x="780" y="1300" width="200" height="150"/></g>
      <g fill="#2F6B3A"><path d="M455 1160 q20 -150 0 -230 q-20 80 0 230z"/><path d="M935 1150 q22 -160 0 -240 q-22 80 0 240z"/></g>
    </g>
    <path d="M200 1450 V700 Q200 420 600 420 Q1000 420 1000 700 V1450Z" fill="none" stroke="#5A4632" stroke-width="30"/>
    <rect x="160" y="1440" width="880" height="50" fill="#8A7458" stroke="#1D1D2B" stroke-width="6"/>
  </g>
  <rect y="1490" width="1080" height="430" fill="url(#stoneTiles)"/>
  <g id="s2-banner" transform="translate(610 1330) scale(.8)"><path d="M-380 -110 H380 L340 0 L380 110 H-380 L-340 0Z" fill="#B3261E" stroke="#1D1D2B" stroke-width="10"/><text x="0" y="-5" font-size="100" fill="${COR.ouro}" text-anchor="middle">ROMA ANTIGA</text><text x="0" y="80" font-size="52" fill="#FFF" text-anchor="middle" letter-spacing="20">SPQR</text></g>
</g>`);
// S3 — rua com prédios de madeira
scenes.push(`<g id="s3" class="scene">
  <rect width="1080" height="1920" fill="url(#skyDay)"/>
  <circle cx="900" cy="230" r="70" fill="#FFE07A"/>
  <g id="s3-insula">${insula('a', 40, 600, 330, false)}
    <rect x="190" y="460" width="260" height="190" fill="#2B1B12" stroke="#1D1D2B" stroke-width="6"/></g>
  <g id="s3-direita">${insula('b', 690, 420, 640, false)}</g>
  <rect y="1700" width="1080" height="220" fill="url(#cobble)"/><path d="M0 1700 H1080" stroke="#6E675C" stroke-width="10"/>
  <g id="s3-balde"><g id="s3-bucket"><path d="M830 820 h90 l-10 80 h-70z" fill="#8A6A3A" stroke="#1D1D2B" stroke-width="6"/><path d="M830 820 q45 -40 90 0" stroke="#1D1D2B" stroke-width="5" fill="none"/></g></g>
  <ellipse id="s3-blob" cx="0" cy="0" rx="34" ry="44" fill="#6B4A1F" stroke="#1D1D2B" stroke-width="5"/>
  <g id="s3-splat" transform="translate(800 1755)"><ellipse rx="130" ry="26" fill="#6B4A1F" stroke="#1D1D2B" stroke-width="5"/><circle cx="-110" cy="-60" r="14" fill="#6B4A1F"/><circle cx="90" cy="-80" r="12" fill="#6B4A1F"/><circle cx="20" cy="-110" r="10" fill="#6B4A1F"/></g>
  <g id="s3-grito" transform="translate(300 1420)"><path d="M-230 -90 H230 Q260 -90 260 -60 V40 Q260 70 230 70 H-40 L-90 140 L-100 70 H-230 Q-260 70 -260 40 V-60 Q-260 -90 -230 -90Z" fill="#FFF" stroke="#1D1D2B" stroke-width="8"/><text y="12" font-size="86" fill="#B3261E" text-anchor="middle">CUIDADO!</text></g>
  <g id="s3-andar" transform="translate(320 830)"><rect x="-150" y="-50" width="300" height="80" rx="40" fill="#1D1D2B"/><text y="12" font-size="44" fill="${COR.ouro}" text-anchor="middle">3º ANDAR</text></g>
</g>`);
// S4 — desafio 1: fome
scenes.push(card('c1', '#F2A541', 1, 'A FOME', `<ellipse cx="0" cy="40" rx="150" ry="40" fill="#8A5A2E" stroke="#1D1D2B" stroke-width="8"/><path d="M-150 40 Q0 200 150 40" fill="#A8743F" stroke="#1D1D2B" stroke-width="8"/>`));
scenes.push(`<g id="s4b" class="scene"><rect width="1080" height="1920" fill="#F7D9A8"/>
  <g id="s4-gel" transform="translate(300 900)"><rect x="-130" y="-230" width="260" height="460" rx="24" fill="#FFF" stroke="#1D1D2B" stroke-width="10"/><path d="M-130 -60 H130" stroke="#1D1D2B" stroke-width="8"/><rect x="80" y="-180" width="16" height="80" rx="8" fill="#1D1D2B"/><rect x="80" y="-20" width="16" height="120" rx="8" fill="#1D1D2B"/>
    <g id="s4-x1" stroke="#D7263D" stroke-width="34" stroke-linecap="round"><path d="M-170 -250 L170 250 M170 -250 L-170 250"/></g></g>
  <g id="s4-merc" transform="translate(780 900)"><path d="M-170 -60 H170 L140 140 H-140Z" fill="#FFF" stroke="#1D1D2B" stroke-width="10"/><path d="M-200 -140 H-150 L-110 140" stroke="#1D1D2B" stroke-width="10" fill="none"/><circle cx="-100" cy="200" r="30" fill="#1D1D2B"/><circle cx="110" cy="200" r="30" fill="#1D1D2B"/>
    <g id="s4-x2" stroke="#D7263D" stroke-width="34" stroke-linecap="round"><path d="M-190 -200 L190 250 M190 -200 L-190 250"/></g></g>
  <rect y="1700" width="1080" height="220" fill="#E0B97F"/>
</g>`);
scenes.push(`<g id="s4c" class="scene">
  <rect width="1080" height="1920" fill="url(#skyDay)"/>
  <rect x="0" y="700" width="1080" height="1000" fill="url(#stoneWall)"/>
  <rect y="1700" width="1080" height="220" fill="url(#cobble)"/><path d="M0 1700 H1080" stroke="#6E675C" stroke-width="10"/>
  <g id="s4-banca">
    <path d="M560 900 H1060 L1040 1010 H580Z" fill="#FFF" stroke="#1D1D2B" stroke-width="8"/>${[0, 1, 2, 3, 4].map(k => `<path d="M${560 + k * 100} 900 h50 l-4 110 h-50z" fill="#D7263D"/>`).join('')}
    <rect x="580" y="1300" width="460" height="400" fill="#A8743F" stroke="#1D1D2B" stroke-width="8"/><rect x="560" y="1270" width="500" height="50" fill="#C9B79A" stroke="#1D1D2B" stroke-width="8"/>
    <path d="M590 1010 V1270 M1030 1010 V1270" stroke="#5E3B1C" stroke-width="16"/>
  </g>
  <g id="s4-pao" transform="translate(690 1235)"><ellipse rx="70" ry="38" fill="#D9A15B" stroke="#1D1D2B" stroke-width="6"/><path d="M-40 -18 l16 22 M-5 -28 l16 22 M30 -18 l14 20" stroke="#A56E2E" stroke-width="7"/>
    <g transform="translate(0 -90)"><rect x="-80" y="-34" width="160" height="56" rx="28" fill="#1D1D2B"/><text y="10" font-size="34" fill="#FFF" text-anchor="middle">DURO</text></g></g>
  <g id="s4-garum" transform="translate(920 1270)"><path d="M-45 -150 Q-80 -60 -40 0 H40 Q80 -60 45 -150 Z" fill="#B8613A" stroke="#1D1D2B" stroke-width="6"/><rect x="-26" y="-180" width="52" height="34" rx="8" fill="#9A4E2D" stroke="#1D1D2B" stroke-width="5"/>
    <g transform="translate(0 -250)"><rect x="-100" y="-36" width="200" height="60" rx="30" fill="#1D1D2B"/><text y="10" font-size="38" fill="${COR.ouro}" text-anchor="middle">GARUM</text></g>
    <g id="s4-stink" stroke="#7CC46A" stroke-width="12" fill="none" stroke-linecap="round" transform="translate(-140 -200)"><path d="M-40 0 q25 -35 0 -70 q-25 -35 0 -70"/><path d="M20 -10 q25 -35 0 -70 q-25 -35 0 -70"/></g></g>
  <g id="s4-moeda"><circle r="34" fill="${COR.ouro}" stroke="#1D1D2B" stroke-width="6"/><circle r="20" fill="none" stroke="#B88A1E" stroke-width="5"/></g>
  <g id="s4-eca" transform="translate(300 900)"><text font-size="110" fill="#5DAA4A" text-anchor="middle" stroke="#1D1D2B" stroke-width="10" paint-order="stroke" transform="rotate(-10)">ECA!</text></g>
</g>`);
// S5 — desafio 2: água
scenes.push(card('c2', '#4DA6E8', 2, 'A ÁGUA', `<path d="M0 -120 C60 -40 110 20 110 70 A110 110 0 0 1 -110 70 C-110 20 -60 -40 0 -120Z" fill="#BDE6FF" stroke="#1D1D2B" stroke-width="10"/>`));
scenes.push(`<g id="s5b" class="scene">
  <rect width="1080" height="1920" fill="url(#skyDay)"/>
  <rect x="0" y="1000" width="1080" height="700" fill="#9FD18B"/>
  <rect y="1700" width="1080" height="220" fill="url(#cobble)"/><path d="M0 1700 H1080" stroke="#6E675C" stroke-width="10"/>
  <g id="s5-fonte"><rect x="700" y="900" width="200" height="560" fill="#D8CBB3" stroke="#1D1D2B" stroke-width="8"/><path d="M680 900 H920 L880 850 H720Z" fill="#C2B49A" stroke="#1D1D2B" stroke-width="8"/>
    <circle cx="800" cy="1040" r="54" fill="#C2B49A" stroke="#1D1D2B" stroke-width="6"/><circle cx="782" cy="1030" r="8" fill="#1D1D2B"/><circle cx="818" cy="1030" r="8" fill="#1D1D2B"/>
    <rect x="770" y="1080" width="60" height="22" rx="10" fill="#8C7B5E" stroke="#1D1D2B" stroke-width="5"/>
    <path id="s5-jato" d="M770 1095 Q690 1160 670 1500" stroke="#5DB7EE" stroke-width="22" fill="none" stroke-dasharray="40 24" stroke-linecap="round"/>
    <path d="M540 1460 H960 V1700 H540Z" fill="#C2B49A" stroke="#1D1D2B" stroke-width="8"/><path d="M560 1480 H940 V1530 H560Z" fill="#5DB7EE"/></g>
</g>`);
scenes.push(`<g id="s5c" class="scene">
  <rect width="1080" height="1920" fill="#C9A77E"/><rect width="1080" height="1920" fill="url(#planks)" opacity=".55"/>
  <path d="M0 1800 L1080 700 V1920 H0Z" fill="#7A5230"/>
  <path d="M0 1800 ${[...Array(12)].map((_, k) => `L${(k + 1) * 90} ${1800 - k * 92} L${(k + 1) * 90} ${1800 - (k + 1) * 92}`).join(' ')}" stroke="#1D1D2B" stroke-width="8" fill="none"/>

// ===================== API DO RENDER =====================
function opacidade(t, janelas) {
  let o = 0;
  for (const [a, b] of janelas) {
    if (t < a || t > b + FADE) continue;
    const ent = a === 0 ? 1 : Math.min(1, (t - a) / FADE), sai = t <= b ? 1 : 1 - (t - b) / FADE;
    o = Math.max(o, Math.min(ent, sai));
  }
  return o;
}
function desenharAtores(t) {
  for (const A of ATORES) {
    const o = opacidade(t, A.janelas);
    A.g.style.display = o > 0 ? '' : 'none';
    A.g.setAttribute('opacity', o.toFixed(3));
    if (o > 0) A.b.desenhar(t);
  }
  const usados = new Set();
  for (const P of PROPS) {
    const o = opacidade(t, P.janelas);
    if (o <= 0) { if (!usados.has(P.el)) P.el.style.display = 'none'; continue; }
    usados.add(P.el);
    const [x, y] = P.ator.mao(P.mao);
    P.el.style.display = '';
    P.el.setAttribute('opacity', o.toFixed(3));
    P.el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${P.escala})`);
  }
}
window.__timeline = tl;
window.__duration = tl.duration();
window.__seek = t => { tl.seek(t, false); desenharAtores(t); };
window.__seek(0);
if (!rendering) {
  tl.eventCallback('onUpdate', () => desenharAtores(tl.time()));
  tl.repeat(-1).play();
}

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Stickman — teste</title>
<!--
  Cena feita a partir do template da skill "edit", com o personagem trocado por um stickman.
  Tudo que se move está na timeline GSAP (tl); boca e legenda são atualizadas em __seek.
-->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { width: 1920px; height: 1080px; display: block; }
  text { font-family: Inter, 'DejaVu Sans', sans-serif; }
</style>
<script src="gsap.min.js"></script>
<!-- Gerado por scripts/lipsync.py a partir de fala.wav -->
<script src="lipsync.js" onerror="window.LIPSYNC = null"></script>
<!-- Palavras com tempos, vindas da transcrição (hyperframes transcribe) -->
<script src="palavras.js" onerror="window.PALAVRAS = null"></script>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#E6DFCF" stroke-width="2"/>
    </pattern>
  </defs>

  <g id="camera">
    <rect width="1920" height="1080" fill="#FAF6EC"/>
    <rect id="paper" x="-200" y="-200" width="2320" height="1480" fill="url(#grid)"/>
    <g id="doodles" stroke="#1D1D2B" stroke-width="6" stroke-linecap="round" fill="none" opacity=".5">
      <g id="sun"><circle cx="1600" cy="260" r="60"/>
        <path d="M1600 170v-30M1600 350v30M1510 260h-30M1690 260h30M1536 196l-20-20M1664 324l20 20M1664 196l20-20M1536 324l-20 20"/></g>
      <path id="cloud1" d="M300 250 q20 -50 70 -30 q30 -40 80 -10 q50 -10 50 40 q0 30 -40 30 h-130 q-50 0 -30 -30z"/>
      <path id="cloud2" d="M1050 170 q15 -35 50 -22 q22 -30 58 -8 q36 -6 36 28 q0 22 -28 22 h-94 q-36 0 -22 -20z"/>
    </g>
    <path id="groundLine" d="M-200 922 Q 400 915 960 922 T 2200 920" stroke="#1D1D2B" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- ============ STICKMAN (pés em y=0 no espaço local) ============ -->
    <g id="char" transform="translate(-300 920)" stroke="#1D1D2B" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse id="shadow" cx="0" cy="2" rx="90" ry="12" fill="#1D1D2B" stroke="none" opacity=".12"/>
      <g id="body">
        <g id="leg-l"><path d="M0 -200 L-28 -8 L-58 -4"/></g>
        <g id="leg-r"><path d="M0 -200 L28 -8 L58 -4"/></g>

        <!-- braço de trás (direita da tela) -->
        <g id="arm-r">
          <path d="M0 -375 L36 -288"/>
          <g id="fore-r"><path d="M36 -288 L46 -196"/><circle cx="47" cy="-188" r="10" fill="#1D1D2B" stroke="none"/></g>
        </g>

        <g id="torso"><path d="M0 -200 L0 -400"/></g>

        <g id="head">
          <circle cx="0" cy="-475" r="72" fill="#FFFFFF"/>
          <g id="brows" stroke-width="7">
            <path id="brow-l" d="M-38 -522 Q-26 -530 -12 -524"/><path id="brow-r" d="M12 -524 Q26 -530 38 -522"/>
          </g>
          <g id="eyes" stroke="none" fill="#1D1D2B">
            <g id="eye-l"><ellipse cx="-24" cy="-492" rx="8" ry="12"/></g>
            <g id="eye-r"><ellipse cx="24" cy="-492" rx="8" ry="12"/></g>
          </g>
          <g id="cheeks" stroke="none" fill="#FF6B5B" opacity=".35">
            <circle cx="-44" cy="-462" r="10"/><circle cx="44" cy="-462" r="10"/>
          </g>
          <g id="mouth" stroke-width="7">
            <path class="m" data-shape="smile" d="M-20 -452 Q0 -432 20 -452"/>
            <path class="m" data-shape="0" d="M-16 -446 Q0 -442 16 -446"/>
            <ellipse class="m" data-shape="1" cx="0" cy="-446" rx="13" ry="4" fill="#1D1D2B" stroke="none"/>
            <ellipse class="m" data-shape="2" cx="0" cy="-445" rx="15" ry="9" fill="#1D1D2B" stroke="none"/>
            <g class="m" data-shape="3" stroke="none"><ellipse cx="0" cy="-443" rx="18" ry="15" fill="#1D1D2B"/><ellipse cx="0" cy="-435" rx="9" ry="5" fill="#FF6B5B"/></g>
            <ellipse class="m" data-shape="4" cx="0" cy="-444" rx="10" ry="13" fill="#1D1D2B" stroke="none"/>
          </g>
        </g>

        <!-- braço da frente (esquerda da tela) -->
        <g id="arm-l">
          <path d="M0 -375 L-36 -288"/>
          <g id="fore-l"><path d="M-36 -288 L-46 -196"/><circle cx="-47" cy="-188" r="10" fill="#1D1D2B" stroke="none"/></g>
        </g>
      </g>
    </g>
  </g>

  <!-- legenda sincronizada com a fala (fora da câmera) -->
  <g id="caption" opacity="0">
    <rect id="capBox" x="360" y="110" width="1200" height="130" rx="65" fill="#1D1D2B"/>
    <text id="capText" x="960" y="196" font-size="62" font-weight="800" text-anchor="middle"></text>
  </g>

  <!-- letreiro final -->
  <g id="endcard" opacity="0">
    <rect width="1920" height="1080" fill="#1D1D2B" opacity=".86"/>
    <text id="endTitle" x="960" y="540" font-size="110" font-weight="800" fill="#FAF6EC" text-anchor="middle"></text>
    <text id="endSub" x="960" y="630" font-size="48" font-weight="500" fill="#FF6B5B" text-anchor="middle"></text>
  </g>
</svg>

<script>
// ===================== CONFIG =====================
const CONFIG = {
  fps: 30,
  titulo: 'Sua voz vira animação',
  subtitulo: 'HTML + GSAP',
  falaInicio: 4.2,              // mesmo --offset usado no lipsync.py
  falaDuracaoSemAudio: 2.8,
  palavrasPorLinha: 5,
  seed: 7
};
const COR = { tinta: '#1D1D2B', papel: '#FAF6EC', destaque: '#FF6B5B', apagado: '#77768A' };

// ===================== UTILITÁRIOS =====================
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(CONFIG.seed);
const $ = s => document.querySelector(s);

// Pivôs (svgOrigin) no espaço local do stickman
const PIVOT = {
  armL: '0 -375', armR: '0 -375', foreL: '-36 -288', foreR: '36 -288',
  legL: '0 -200', legR: '0 -200', head: '0 -400', body: '0 0', torso: '0 -200',
  eyeL: '-24 -492', eyeR: '24 -492'
};
gsap.set('#arm-l', { svgOrigin: PIVOT.armL, rotation: 8 });
gsap.set('#arm-r', { svgOrigin: PIVOT.armR, rotation: -8 });
gsap.set('#fore-l', { svgOrigin: PIVOT.foreL, rotation: -6 });
gsap.set('#fore-r', { svgOrigin: PIVOT.foreR, rotation: 6 });
gsap.set('#leg-l', { svgOrigin: PIVOT.legL });
gsap.set('#leg-r', { svgOrigin: PIVOT.legR });
gsap.set('#head', { svgOrigin: PIVOT.head });
gsap.set('#body', { svgOrigin: PIVOT.body });
gsap.set('#torso', { svgOrigin: PIVOT.torso });
gsap.set('#eye-l', { svgOrigin: PIVOT.eyeL });
gsap.set('#eye-r', { svgOrigin: PIVOT.eyeR });
gsap.set('#camera', { svgOrigin: '960 600' });
$('#endTitle').textContent = CONFIG.titulo;
$('#endSub').textContent = CONFIG.subtitulo;

// ===================== BOCA / LIPSYNC =====================
const LS = window.LIPSYNC;
const talkStart = LS ? LS.offset : CONFIG.falaInicio;
const talkDur = LS ? LS.duration : CONFIG.falaDuracaoSemAudio;
const talkEnd = talkStart + talkDur;
const fakeFrames = Array.from({ length: Math.ceil(talkDur * CONFIG.fps) }, (_, i) =>
  (i % 9 === 8) ? 0 : [1, 2, 3, 2, 4, 3, 1][Math.floor(mulberry32(i + 99)() * 7)]);
const mouths = [...document.querySelectorAll('#mouth .m')];
function setMouth(t) {
  let shape = 'smile';
  if (t >= talkStart && t < talkEnd) {
    const fps = LS ? LS.fps : CONFIG.fps;
    const arr = LS ? LS.frames : fakeFrames;
    shape = String(arr[Math.min(arr.length - 1, Math.floor((t - talkStart) * fps))] ?? 0);
  }
  mouths.forEach(m => (m.style.display = m.dataset.shape === shape ? '' : 'none'));
}

// ===================== LEGENDA PALAVRA A PALAVRA =====================
// Linhas: quebra em pontuação ou a cada N palavras.
const WORDS = (window.PALAVRAS || []).map(w => ({ ...w, s: w.s + talkStart, e: w.e + talkStart }));
const LINES = [];
WORDS.forEach((w, i) => {
  const cur = LINES[LINES.length - 1];
  if (!cur || cur.length >= CONFIG.palavrasPorLinha || /[.,!?]$/.test(WORDS[i - 1]?.t || '')) LINES.push([w]);
  else cur.push(w);
});
const capText = $('#capText');
let shownLine = -1;
function setCaption(t) {
  let li = LINES.findIndex(l => t < l[l.length - 1].e + 0.15);
  if (li < 0 || t < talkStart - 0.05) li = t < talkStart ? 0 : LINES.length - 1;
  const line = LINES[li];
  if (!line) return;
  if (li !== shownLine) {
    capText.textContent = '';
    line.forEach((w, k) => {
      const ts = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      ts.textContent = (k ? ' ' : '') + w.t;
      capText.appendChild(ts);
    });
    shownLine = li;
  }
  [...capText.children].forEach((ts, k) => {
    const w = line[k];
    ts.setAttribute('fill', t >= w.s && t < w.e ? COR.destaque : t >= w.e ? COR.papel : COR.apagado);
  });
}

// ===================== TIMELINE =====================
const rendering = navigator.webdriver;
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut' } });
const TOTAL = talkEnd + 2.6;

// --- ambiente: câmera lenta e rabiscos flutuando
tl.fromTo('#camera', { scale: 1.08 }, { scale: 1, duration: TOTAL, ease: 'none' }, 0);
tl.to('#cloud1', { x: 160, duration: TOTAL, ease: 'none' }, 0);
tl.to('#cloud2', { x: -120, duration: TOTAL, ease: 'none' }, 0);
tl.to('#sun', { rotation: 40, svgOrigin: '1600 260', duration: TOTAL, ease: 'none' }, 0);
tl.fromTo('#paper', { x: 30 }, { x: -30, duration: TOTAL, ease: 'none' }, 0);

// --- ROTEIRO 1: entrada caminhando (0 → 2.4s)
const STEP = 0.3, STEPS = 8, walkEnd = STEP * STEPS;
tl.to('#char', { x: 760, duration: walkEnd, ease: 'none' }, 0);
for (let i = 0; i < STEPS; i++) {
  const t = i * STEP, s = i % 2 ? 1 : -1;
  tl.to('#leg-l', { rotation: 24 * s, duration: STEP, ease: 'sine.inOut' }, t)
    .to('#leg-r', { rotation: -24 * s, duration: STEP, ease: 'sine.inOut' }, t)
    .to('#arm-l', { rotation: 8 - 26 * s, duration: STEP, ease: 'sine.inOut' }, t)
    .to('#arm-r', { rotation: -8 + 26 * s, duration: STEP, ease: 'sine.inOut' }, t)
    .to('#body', { y: -14, duration: STEP / 2, ease: 'sine.out' }, t)
    .to('#body', { y: 0, duration: STEP / 2, ease: 'sine.in' }, t + STEP / 2);
}
// --- parada com squash e follow-through
tl.to(['#leg-l', '#leg-r'], { rotation: 0, duration: 0.25, ease: 'power2.out' }, walkEnd)
  .to('#body', { scaleY: 0.94, scaleX: 1.04, duration: 0.12, ease: 'power2.out' }, walkEnd)
  .to('#body', { scaleY: 1, scaleX: 1, duration: 0.5, ease: 'elastic.out(1, 0.45)' }, walkEnd + 0.12)
  .to('#head', { rotation: 6, duration: 0.15, ease: 'power2.out' }, walkEnd + 0.05)
  .to('#head', { rotation: 0, duration: 0.6, ease: 'elastic.out(1, 0.4)' }, walkEnd + 0.2)
  .to('#arm-l', { rotation: 8, duration: 0.6, ease: 'back.out(2)' }, walkEnd)
  .to('#arm-r', { rotation: -8, duration: 0.6, ease: 'back.out(2)' }, walkEnd);

// --- ROTEIRO 2: aceno
const waveAt = walkEnd + 0.4;
tl.to('#arm-r', { rotation: 6, duration: 0.15, ease: 'power1.in' }, waveAt)
  .to('#arm-r', { rotation: -118, duration: 0.35, ease: 'back.out(1.6)' }, waveAt + 0.15)
  .to('#fore-r', { rotation: -10, duration: 0.35 }, waveAt + 0.2)
  .to('#fore-r', { rotation: -40, duration: 0.16, ease: 'sine.inOut', repeat: 5, yoyo: true }, waveAt + 0.5)
  .to('#head', { rotation: -5, duration: 0.4 }, waveAt + 0.15)
  .to('#brows', { y: -6, duration: 0.2 }, waveAt + 0.15);
const waveEnd = waveAt + 0.5 + 0.16 * 6;
tl.to('#arm-r', { rotation: -8, duration: 0.45, ease: 'power3.inOut' }, waveEnd)
  .to('#fore-r', { rotation: 6, duration: 0.5, ease: 'power3.inOut' }, waveEnd + 0.05)
  .to('#head', { rotation: 0, duration: 0.5 }, waveEnd)
  .to('#brows', { y: 0, duration: 0.3 }, waveEnd);

// --- ROTEIRO 3: fala com gestos + legenda
tl.fromTo('#caption', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(2)' }, talkStart - 0.25)
  .to('#arm-l', { rotation: 40, duration: 0.45, ease: 'power3.out' }, talkStart + 0.1)
  .to('#fore-l', { rotation: -60, duration: 0.5, ease: 'power3.out' }, talkStart + 0.15)
  .to('#head', { rotation: 4, y: -5, duration: 0.35, ease: 'sine.inOut', repeat: Math.max(1, Math.floor(talkDur / 0.7) * 2 - 1), yoyo: true }, talkStart);
// segundo gesto, com o outro braço, no início da segunda frase
const secondPhrase = (LINES[2] || LINES[1] || [])[0];
if (secondPhrase) {
  tl.to('#arm-r', { rotation: -55, duration: 0.4, ease: 'power3.out' }, secondPhrase.s - 0.1)
    .to('#fore-r', { rotation: 50, duration: 0.45, ease: 'power3.out' }, secondPhrase.s - 0.05)
    .to('#brows', { y: -7, duration: 0.15, repeat: 1, yoyo: true }, secondPhrase.s)
    .to('#arm-r', { rotation: -8, duration: 0.5 }, talkEnd - 0.3)
    .to('#fore-r', { rotation: 6, duration: 0.55 }, talkEnd - 0.25);
}
tl.to('#arm-l', { rotation: 8, duration: 0.5 }, talkEnd - 0.2)
  .to('#fore-l', { rotation: -6, duration: 0.55 }, talkEnd - 0.15)
  .to('#caption', { opacity: 0, duration: 0.3, ease: 'power2.in' }, talkEnd + 0.3);

// --- respiração e piscadas (repetições finitas)
tl.to('#torso', { scaleY: 1.02, duration: 0.9, ease: 'sine.inOut', repeat: Math.floor(TOTAL / 0.9) - 1, yoyo: true }, 0);
for (let t = 1.2 + rand() * 1.2; t < TOTAL - 0.3; t += 2.2 + rand() * 1.8) {
  tl.to(['#eye-l', '#eye-r'], { scaleY: 0.1, duration: 0.06, ease: 'power1.in', repeat: 1, yoyo: true }, t);
  if (rand() < 0.25) tl.to(['#eye-l', '#eye-r'], { scaleY: 0.1, duration: 0.06, repeat: 1, yoyo: true }, t + 0.2);
}

// --- ROTEIRO 4: letreiro final
tl.to('#endcard', { opacity: 1, duration: 0.6, ease: 'power2.out' }, talkEnd + 0.8)
  .fromTo('#endTitle', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: 'power3.out' }, talkEnd + 1.0)
  .fromTo('#endSub', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, talkEnd + 1.25);
tl.set({}, {}, TOTAL);

// ===================== API DO RENDER =====================
window.__timeline = tl;
window.__duration = tl.duration();
window.__seek = t => { tl.seek(t, false); setMouth(t); setCaption(t); };
window.__seek(0);
if (!rendering) {
  tl.eventCallback('onUpdate', () => { setMouth(tl.time()); setCaption(tl.time()); });
  tl.repeat(-1).play();
}
</script>
</body>
</html>

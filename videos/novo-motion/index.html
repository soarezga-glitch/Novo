<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0b0b12;
        --ink: #f5f3ee;
        --muted: #a5a3b5;
        --accent: #ff5a36;
        --accent-2: #7c6cff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 45%, #1a1830 0%, var(--bg) 62%);
        font-family: "Helvetica Neue", Arial, ui-sans-serif, system-ui, sans-serif;
      }
      #main-clip {
        position: absolute;
        inset: 0;
      }
      .glow {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 900px;
        height: 900px;
        margin: -450px 0 0 -450px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 108, 255, 0.35) 0%, rgba(124, 108, 255, 0) 65%);
      }
      .scene-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        gap: 36px;
      }
      #title {
        display: flex;
        color: var(--ink);
        font-size: 300px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      #title .ch {
        display: inline-block;
      }
      #title .ch.dot {
        color: var(--accent);
      }
      #rule {
        width: 520px;
        height: 10px;
        border-radius: 5px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transform-origin: left center;
      }
      #tagline {
        display: flex;
        gap: 22px;
        color: var(--muted);
        font-size: 64px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      #tagline .w {
        display: inline-block;
      }
      #tagline .w.em {
        color: var(--ink);
        font-weight: 700;
      }
      #chip {
        margin-top: 12px;
        padding: 16px 36px;
        border: 3px solid var(--accent-2);
        border-radius: 999px;
        color: var(--ink);
        font-size: 36px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="main-clip" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div class="glow" id="glow"></div>
        <div class="scene-content" id="content">
          <h1 id="title">
            <span class="ch">N</span><span class="ch">o</span><span class="ch">v</span
            ><span class="ch">o</span><span class="ch dot">.</span>
          </h1>
          <div id="rule"></div>
          <p id="tagline">
            <span class="w">Vídeos</span><span class="w">feitos</span><span class="w">com</span
            ><span class="w em">código</span>
          </p>
          <div id="chip">HTML + GSAP</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Hook: letters slam up one by one
      tl.fromTo("#glow", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 1.6, ease: "power2.out" }, 0);
      tl.fromTo(
        "#title .ch",
        { autoAlpha: 0, yPercent: 60, scale: 0.7 },
        { autoAlpha: 1, yPercent: 0, scale: 1, duration: 0.7, ease: "back.out(2)", stagger: 0.12 },
        0.3,
      );
      // Punch on the accent dot
      tl.fromTo("#title .dot", { scale: 1 }, { scale: 1.5, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 1.25);

      // Build: underline draws, tagline words rise
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 1.7);
      tl.fromTo(
        "#tagline .w",
        { autoAlpha: 0, y: 40 },
        { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.16 },
        2.4,
      );
      tl.fromTo("#tagline .em", { color: "#a5a3b5" }, { color: "#ff5a36", duration: 0.4, ease: "sine.inOut", immediateRender: false }, 3.4);

      // Resolve: chip pops in, hold, then everything exits
      tl.fromTo("#chip", { autoAlpha: 0, scale: 0.8 }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 4.2);
      tl.fromTo("#content", { autoAlpha: 1, scale: 1 }, { autoAlpha: 0, scale: 1.04, duration: 0.6, ease: "power2.in" }, 7.3);
      tl.fromTo("#glow", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.6, ease: "power2.in", immediateRender: false }, 7.3);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

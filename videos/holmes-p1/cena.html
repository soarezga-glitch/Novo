<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Holmes Parte 1</title>
<!--
  Vídeo vertical (1080x1920) — página de crimes reais com bonecos de palito.
  Caso 1: H. H. Holmes, o "Castelo" de Chicago (1893) — PARTE 1 (narração em fala.mp3, 58,6 s).
  Identidade da página: noite azul-escura, luz de lampião âmbar, vermelho-sangue de destaque,
  papel de ficha policial; fontes Anton (títulos/legenda) e Special Elite (máquina de escrever).
  Motores: boneco.js (movimento-humano + figurinos anos 1890), legenda.js (legenda-dinamica).
-->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; display: block; }
  @font-face { font-family: 'Anton'; src: url(fontes/Anton-Regular.ttf); }
  @font-face { font-family: 'Special Elite'; src: url(fontes/SpecialElite-Regular.ttf); }
  text { font-family: 'Anton', 'DejaVu Sans', sans-serif; }
  .maq { font-family: 'Special Elite', 'Courier 10 Pitch', monospace; }
</style>
<script src="gsap.min.js"></script>
<script src="boneco.js"></script>
<script src="legenda.js"></script>
<script src="legenda-dados.js"></script>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
      <feFlood flood-color="#1D1D2B"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
    </filter>
    <filter id="borra"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="borra2"><feGaussianBlur stdDeviation="4"/></filter>
    <radialGradient id="vinheta" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".78"/></radialGradient>
    <radialGradient id="brilho" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD58A" stop-opacity=".75"/><stop offset=".4" stop-color="#F2A54A" stop-opacity=".25"/><stop offset="1" stop-color="#F2A54A" stop-opacity="0"/></radialGradient>
    <radialGradient id="brilhoVerm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF2A2A" stop-opacity=".6"/><stop offset="1" stop-color="#B3121F" stop-opacity="0"/></radialGradient>
    <radialGradient id="lua" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E8EEF8" stop-opacity=".55"/><stop offset="1" stop-color="#8FA3C8" stop-opacity="0"/></radialGradient>
    <linearGradient id="ceuNoite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070A14"/><stop offset=".6" stop-color="#162036"/><stop offset="1" stop-color="#2A3550"/></linearGradient>
    <linearGradient id="nevoa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8EA0C0" stop-opacity="0"/><stop offset="1" stop-color="#8EA0C0" stop-opacity=".35"/></linearGradient>
    <linearGradient id="escuroBaixo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></linearGradient>
    <pattern id="tijolo" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#6E3A2E"/>
      <rect x="1" y="1" width="62" height="14" fill="#7C4536"/><rect x="-31" y="17" width="62" height="14" fill="#74402F"/><rect x="33" y="17" width="62" height="14" fill="#80493A"/>
      <path d="M0 16H64M0 0H64M32 16V32M0 0V16M64 0V16" stroke="#3E2018" stroke-width="2"/>
    </pattern>
    <pattern id="pedra" width="120" height="70" patternUnits="userSpaceOnUse">
      <rect width="120" height="70" fill="#4A4C56"/>
      <rect x="2" y="2" width="70" height="31" rx="4" fill="#565A66"/><rect x="74" y="2" width="44" height="31" rx="4" fill="#50535E"/>
      <rect x="2" y="37" width="40" height="31" rx="4" fill="#5C606C"/><rect x="44" y="37" width="74" height="31" rx="4" fill="#52555F"/>
    </pattern>
    <pattern id="papelParede" width="80" height="110" patternUnits="userSpaceOnUse">
      <rect width="80" height="110" fill="#4E2E34"/>
      <rect x="0" width="6" height="110" fill="#5C3840"/>
      <path d="M40 18 L52 40 L40 62 L28 40Z M40 70 l6 12 l-6 12 l-6 -12Z" fill="#62404A"/>
    </pattern>
    <pattern id="papelVerde" width="80" height="110" patternUnits="userSpaceOnUse">
      <rect width="80" height="110" fill="#2E3E36"/>
      <rect x="0" width="6" height="110" fill="#384A40"/>
      <path d="M40 18 L52 40 L40 62 L28 40Z" fill="#3A4C44"/>
    </pattern>
    <pattern id="tabua" width="220" height="40" patternUnits="userSpaceOnUse">
      <rect width="220" height="40" fill="#4A2E1E"/><rect y="1" width="220" height="18" fill="#56362A"/><rect y="21" width="220" height="18" fill="#4E3022"/>
      <path d="M0 20H220M0 0H220M140 0V20M60 20V40" stroke="#2A1A12" stroke-width="2"/>
    </pattern>
    <pattern id="parale" width="70" height="36" patternUnits="userSpaceOnUse">
      <rect width="70" height="36" fill="#2C2E36"/><rect x="2" y="2" width="31" height="14" rx="6" fill="#383A44"/><rect x="36" y="2" width="32" height="14" rx="6" fill="#34363F"/>
      <rect x="-16" y="20" width="32" height="14" rx="6" fill="#363842"/><rect x="19" y="20" width="32" height="14" rx="6" fill="#3A3C46"/><rect x="54" y="20" width="32" height="14" rx="6" fill="#363842"/>
    </pattern>
    <clipPath id="obraClip"><rect id="obraRect" x="0" y="1360" width="1080" height="1000"/></clipPath>
  </defs>
  <g id="cam"><g id="mundo" transform="translate(0 -320)">
    <g id="scenes"></g>
    <g id="atoresFundo"></g>
    <g id="meio"></g>
    <g id="atores"></g>
    <g id="props"></g>
    <g id="fgs"></g>
  </g></g>
  <g id="textos"></g>
  <rect id="apagao" width="1080" height="1920" fill="#000" opacity="0"/>
  <rect width="1080" height="1920" fill="url(#vinheta)" pointer-events="none"/>
  <rect width="1080" height="1920" filter="url(#grao)" pointer-events="none"/>
  <g id="legenda"></g>
  <rect id="flash" width="1080" height="1920" fill="#E8F0FF" opacity="0"/>
</svg>

<script>
// ===================== CONFIG =====================
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const T = '#14141C';                              // tinta (contorno)
const VERM = '#C8102E', PAPEL = '#E8DCC0', AMBAR = '#F2B65A', NOITE = '#0E1420';
const END = 60.9;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ===================== TEXTOS DA PÁGINA (identidade "crimes reais") =====================
const larg = (txt, fs, maq) => txt.length * fs * (maq ? 0.6 : 0.47);
// etiqueta de papel (ficha policial) com fita adesiva — máquina de escrever
function etiqueta(id, x, y, txt, { fs = 46, rot = -2, cor = T, fundo = PAPEL } = {}) {
  const w = larg(txt, fs, true) + fs * 1.1, h = fs * 1.7;
  return `<g id="${id}" transform="translate(${x} ${y})"><g transform="rotate(${rot})">
    <rect x="${-w / 2 + 6}" y="${-h / 2 + 8}" width="${w}" height="${h}" fill="#000" opacity=".35"/>
    <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="${fundo}" stroke="#B9A882" stroke-width="2"/>
    <rect x="${-w / 2 - 14}" y="${-h / 2 - 12}" width="70" height="26" fill="#F4EAC8" opacity=".75" transform="rotate(-24 ${-w / 2} ${-h / 2})"/>
    <text class="maq" x="0" y="${fs * 0.34}" font-size="${fs}" fill="${cor}" text-anchor="middle">${txt}</text></g></g>`;
}
// carimbo vermelho torto
function carimbo(id, x, y, txt, { fs = 80, rot = -8 } = {}) {
  const w = larg(txt, fs) + fs * 0.8, h = fs * 1.45;
  return `<g id="${id}" transform="translate(${x} ${y})"><g transform="rotate(${rot})" opacity=".92">
    <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="10" fill="none" stroke="${VERM}" stroke-width="${fs * 0.09}"/>
    <rect x="${-w / 2 + fs * 0.14}" y="${-h / 2 + fs * 0.14}" width="${w - fs * 0.28}" height="${h - fs * 0.28}" rx="6" fill="none" stroke="${VERM}" stroke-width="${fs * 0.035}"/>
    <text x="0" y="${fs * 0.36}" font-size="${fs}" fill="${VERM}" text-anchor="middle" letter-spacing="2">${txt}</text></g></g>`;
}
// título grande (Anton) — branco ou vermelho com contorno escuro e sombra
function titulo(id, x, y, txt, { fs = 150, cor = '#FFFFFF', rot = 0, sub } = {}) {
  return `<g id="${id}" transform="translate(${x} ${y})"><g transform="rotate(${rot})">
    <text x="6" y="${fs * 0.36 + 10}" font-size="${fs}" fill="#000" opacity=".55" text-anchor="middle">${txt}</text>
    <text x="0" y="${fs * 0.36}" font-size="${fs}" fill="${cor}" stroke="${T}" stroke-width="${fs * 0.1}" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">${txt}</text>
    ${sub ? `<text class="maq" x="0" y="${fs * 0.36 + fs * 0.5}" font-size="${fs * 0.3}" fill="${PAPEL}" text-anchor="middle">${sub}</text>` : ''}</g></g>`;
}
// balão de fala branco
function balao(id, x, y, linhas, { fs = 56, ponta = [-60, 140] } = {}) {
  const w = Math.max(...linhas.map(l => larg(l, fs))) + fs * 1.4, h = linhas.length * fs * 1.15 + fs * 0.9;
  const px = ponta[0], py = ponta[1];
  return `<g id="${id}" transform="translate(${x} ${y})">
    <path d="M${-w / 2 + 30} ${-h / 2} H${w / 2 - 30} Q${w / 2} ${-h / 2} ${w / 2} ${-h / 2 + 30} V${h / 2 - 30} Q${w / 2} ${h / 2} ${w / 2 - 30} ${h / 2} H${Math.min(w / 2 - 40, px + 40)} L${px} ${py} L${Math.min(w / 2 - 80, px + 8)} ${h / 2} H${-w / 2 + 30} Q${-w / 2} ${h / 2} ${-w / 2} ${h / 2 - 30} V${-h / 2 + 30} Q${-w / 2} ${-h / 2} ${-w / 2 + 30} ${-h / 2}Z" fill="#FFFDF4" stroke="${T}" stroke-width="8" stroke-linejoin="round"/>
    ${linhas.map((l, i) => `<text x="0" y="${-h / 2 + fs * 0.45 + fs * 1.15 * (i + 0.5) + fs * 0.32}" font-size="${fs}" fill="${T}" text-anchor="middle">${l}</text>`).join('')}</g>`;
}

// ===================== PEÇAS DE CENÁRIO (Chicago, 1893) =====================
function ceuNoite({ lua = [820, 330], estrelas = 40, seed = 1 } = {}) {
  const r = mulberry32(seed);
  let s = `<rect width="2200" height="1920" fill="url(#ceuNoite)"/>`;
  s += [...Array(estrelas)].map(() => `<circle cx="${(r() * 2200).toFixed(0)}" cy="${(r() * 900).toFixed(0)}" r="${(1 + r() * 2.2).toFixed(1)}" fill="#DDE6FF" opacity="${(0.3 + r() * 0.6).toFixed(2)}"/>`).join('');
  if (lua) s += `<circle cx="${lua[0]}" cy="${lua[1]}" r="220" fill="url(#lua)"/><circle cx="${lua[0]}" cy="${lua[1]}" r="62" fill="#E9EEF6"/><circle cx="${lua[0] - 18}" cy="${lua[1] - 12}" r="12" fill="#CBD3E2"/><circle cx="${lua[0] + 20}" cy="${lua[1] + 18}" r="8" fill="#CBD3E2"/>`;
  s += [[120, 520, 1.2], [700, 620, 1], [1400, 480, 1.3]].map(([x, y, k]) => `<g opacity=".55" transform="translate(${x} ${y}) scale(${k})"><ellipse cx="0" cy="0" rx="200" ry="34" fill="#232D44"/><ellipse cx="80" cy="-20" rx="120" ry="34" fill="#232D44"/><ellipse cx="-90" cy="-10" rx="90" ry="26" fill="#283350"/></g>`).join('');
  return s;
}
function silhuetaCidade(y, cor = '#121A2A', seed = 2, w = 2200) {
  const r = mulberry32(seed); let x = 0, d = `M0 ${y + 400}`;
  while (x < w) { const bw = 60 + r() * 120, bh = 80 + r() * 260; d += ` V${y - bh} H${x + bw}`; if (r() < 0.25) d += ` V${y - bh - 60} H${x + bw + 10} V${y - bh}`; x += bw; }
  d += ` V${y + 400}Z`;
  let jan = ''; const r2 = mulberry32(seed + 9);
  for (let k = 0; k < w / 25; k++) if (r2() < 0.35) jan += `<rect x="${(r2() * w).toFixed(0)}" y="${(y - r2() * 220).toFixed(0)}" width="6" height="9" fill="#F2C060" opacity="${(0.3 + r2() * 0.5).toFixed(2)}"/>`;
  return `<path d="${d}" fill="${cor}"/>${jan}`;
}
function janela(x, y, w, h, { acesa = true, id = '', cortina = true } = {}) {
  return `<g ${id ? `id="${id}"` : ''}>
    <rect x="${x - 6}" y="${y - 10}" width="${w + 12}" height="12" fill="#B9A890" stroke="${T}" stroke-width="3"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#141A28" stroke="${T}" stroke-width="4"/>
    <rect class="luz" x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${h - 8}" fill="#F2C266" opacity="${acesa ? 1 : 0}"/>
    ${cortina ? `<path class="luz" d="M${x + 4} ${y + 4} H${x + w * 0.32} Q${x + w * 0.2} ${y + h * 0.5} ${x + w * 0.1} ${y + h - 4} H${x + 4}Z M${x + w - 4} ${y + 4} H${x + w * 0.68} Q${x + w * 0.8} ${y + h * 0.5} ${x + w * 0.9} ${y + h - 4} H${x + w - 4}Z" fill="#A8442E" opacity="${acesa ? 0.85 : 0}"/>` : ''}
    <path d="M${x + w / 2} ${y} V${y + h} M${x} ${y + h * 0.45} H${x + w}" stroke="${T}" stroke-width="4"/>
    <rect x="${x - 8}" y="${y + h}" width="${w + 16}" height="12" fill="#B9A890" stroke="${T}" stroke-width="3"/></g>`;
}
// o "Castelo": prédio de 3 andares com torreões de canto (bay windows), lojas embaixo e placa HOTEL
function castelo({ x = 90, base = 1600, w = 900, h = 1100, id = 'cas', placa = true, luzes = true } = {}) {
  const top = base - h, andar = (h - 240) / 3;
  let s = `<g id="${id}">`;
  s += `<rect x="${x + 16}" y="${top + 16}" width="${w}" height="${h}" fill="#000" opacity=".35"/>`;
  s += `<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="url(#tijolo)" stroke="${T}" stroke-width="6"/>`;
  s += `<rect x="${x}" y="${top}" width="${w * 0.5}" height="${h}" fill="#000" opacity=".18"/>`;   // lado da sombra
  // torreões (sacadas salientes)
  [x - 20, x + w - 150].forEach((tx, i) => {
    s += `<rect x="${tx}" y="${top + 120}" width="170" height="${h - 360}" fill="url(#tijolo)" stroke="${T}" stroke-width="6"/><rect x="${tx}" y="${top + 120}" width="170" height="${h - 360}" fill="${i ? '#FFD9A0' : '#000'}" opacity="${i ? 0.06 : 0.22}"/>`;
    s += `<path d="M${tx - 10} ${top + 124} L${tx + 85} ${top - 70} L${tx + 180} ${top + 124}Z" fill="#2A2E3A" stroke="${T}" stroke-width="6"/><path d="M${tx + 85} ${top - 70} V${top - 120}" stroke="${T}" stroke-width="6"/><circle cx="${tx + 85}" cy="${top - 124}" r="9" fill="#8A8A90" stroke="${T}" stroke-width="3"/>`;
  });
  // cornija
  s += `<rect x="${x - 26}" y="${top - 10}" width="${w + 52}" height="40" fill="#5A5048" stroke="${T}" stroke-width="5"/>` + [...Array(Math.floor(w / 40))].map((_, k) => `<rect x="${x - 14 + k * 40}" y="${top + 30}" width="18" height="18" fill="#4A4038" stroke="${T}" stroke-width="2"/>`).join('');
  // janelas por andar
  let k = 0;
  for (let a = 0; a < 3; a++) {
    const y = top + 90 + a * andar, jw = 78, jh = andar * 0.58;
    const xs = [x + 45, x + 175, x + 310, x + 445, x + 580, x + 715, x + w - 105].filter(v => v < x + w - 60);
    xs.forEach((jx, j) => { const acesa = luzes && ((a * 7 + j * 3) % 5 !== 0); s += janela(jx, y, jw, jh, { acesa, id: `${id}-j${k++}` }); });
    s += `<rect x="${x}" y="${y + andar - 26}" width="${w}" height="12" fill="#5A5048" opacity=".9"/>`;
  }
  // térreo: lojas com toldos e a porta do hotel
  const yt = base - 240;
  s += `<rect x="${x}" y="${yt}" width="${w}" height="240" fill="#3A2A24" stroke="${T}" stroke-width="5"/>`;
  [x + 40, x + w - 300].forEach(lx => { s += `<rect x="${lx}" y="${yt + 50}" width="260" height="150" fill="#E8B865" opacity="${luzes ? 0.75 : 0.15}" stroke="${T}" stroke-width="5"/><path d="M${lx - 10} ${yt + 50} l20 -46 h240 l20 46z" fill="#5E1E22" stroke="${T}" stroke-width="5"/>${[0, 1, 2, 3, 4, 5].map(q => `<path d="M${lx + 10 + q * 46} ${yt + 4} l-8 46" stroke="#7A2A2E" stroke-width="14"/>`).join('')}`; });
  const px = x + w / 2 - 70;
  s += `<rect x="${px - 14}" y="${yt + 20}" width="168" height="220" fill="#2A1A14" stroke="${T}" stroke-width="5"/><rect id="${id}-porta" x="${px}" y="${yt + 36}" width="140" height="204" fill="#120C0A"/><path d="M${px + 70} ${yt + 36} V${base}" stroke="#2A1A14" stroke-width="4"/>`;
  s += `<rect x="${px + 10}" y="${yt + 40}" width="56" height="196" fill="#4A2A1E" stroke="${T}" stroke-width="3" id="${id}-folha"/>`;
  if (placa) s += `<g><rect x="${x + w / 2 - 130}" y="${top + 4}" width="260" height="70" fill="#1A1410" stroke="${T}" stroke-width="5"/><text x="${x + w / 2}" y="${top + 60}" font-size="58" fill="#F2C266" text-anchor="middle" letter-spacing="10">HOTEL</text></g>`;
  return s + `</g>`;
}
function poste(x, base, k = 1, id = '') {
  return `<g ${id ? `id="${id}"` : ''} transform="translate(${x} ${base}) scale(${k})">
    <circle cx="0" cy="-470" r="210" fill="url(#brilho)"/>
    <rect x="-8" y="-430" width="16" height="430" fill="#1E2028" stroke="${T}" stroke-width="4"/><rect x="-22" y="-30" width="44" height="30" fill="#1E2028" stroke="${T}" stroke-width="4"/>
    <path d="M-34 -500 H34 L24 -430 H-24Z" fill="#FFE2A0" stroke="${T}" stroke-width="5"/><path d="M-42 -500 L0 -540 L42 -500Z" fill="#1E2028" stroke="${T}" stroke-width="5"/>
    <path d="M0 -500 V-430" stroke="${T}" stroke-width="3"/></g>`;
}
function rua(y, h = 400, w = 2200) {
  return `<rect x="0" y="${y}" width="${w}" height="${h}" fill="url(#parale)"/><rect x="0" y="${y}" width="${w}" height="${h}" fill="url(#escuroBaixo)"/><rect x="0" y="${y}" width="${w}" height="14" fill="#5A5C64" stroke="${T}" stroke-width="3"/>`;
}
function nevoa(y, w = 2200) { return `<rect x="0" y="${y - 260}" width="${w}" height="320" fill="url(#nevoa)"/>`; }
function interior({ papel = 'papelParede', piso = 1640, rodape = 1380 } = {}) {
  return `<rect width="1080" height="${piso}" fill="url(#${papel})"/>
    <rect y="${rodape}" width="1080" height="${piso - rodape}" fill="#3A2216"/>${[...Array(8)].map((_, k) => `<rect x="${20 + k * 135}" y="${rodape + 30}" width="105" height="${piso - rodape - 60}" fill="none" stroke="#24140C" stroke-width="5"/>`).join('')}
    <rect y="${rodape - 14}" width="1080" height="18" fill="#5A3A26" stroke="${T}" stroke-width="3"/>
    <rect y="${piso}" width="1080" height="${1920 - piso}" fill="url(#tabua)"/><rect y="${piso}" width="1080" height="${1920 - piso}" fill="url(#escuroBaixo)"/>
    <rect y="0" width="1080" height="70" fill="#24140E"/><rect y="66" width="1080" height="14" fill="#4A2E1E"/>`;
}
function arandela(x, y, id = '') {   // luminária a gás de parede
  return `<g ${id ? `id="${id}"` : ''}><circle cx="${x}" cy="${y}" r="190" fill="url(#brilho)"/><path d="M${x - 6} ${y + 50} V${y + 10} M${x - 30} ${y + 30} H${x + 18}" stroke="#8A6A3A" stroke-width="8"/><path d="M${x - 22} ${y + 12} Q${x - 6} ${y - 40} ${x + 10} ${y + 12}Z" fill="#FFE6B0" stroke="${T}" stroke-width="4"/></g>`;
}
function relogio(x, y, r, id) {
  return `<g><circle cx="${x}" cy="${y}" r="${r + 14}" fill="#5A3A22" stroke="${T}" stroke-width="5"/><circle cx="${x}" cy="${y}" r="${r}" fill="#F2E8D0" stroke="${T}" stroke-width="4"/>
    ${[...Array(12)].map((_, k) => { const a = k * Math.PI / 6; return `<path d="M${x + Math.sin(a) * r * 0.8} ${y - Math.cos(a) * r * 0.8} L${x + Math.sin(a) * r * 0.92} ${y - Math.cos(a) * r * 0.92}" stroke="${T}" stroke-width="4"/>`; }).join('')}
    <path id="${id}-h" d="M${x} ${y} V${y - r * 0.5}" stroke="${T}" stroke-width="8" stroke-linecap="round"/><path id="${id}-m" d="M${x} ${y} V${y - r * 0.78}" stroke="${T}" stroke-width="5" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="6" fill="${T}"/></g>`;
}
function frasco(x, y, k, cor) {

// ===================== LEGENDA (Anton branca, palavra falada em vermelho) — EMBAIXO, sobre o chão =====================
// pedido do usuário: legenda sempre embaixo; o mundo sobe 320 px (#mundo) para o chão ocupar a faixa de baixo
const leg = Legenda($('#legenda'), window.PALAVRAS || [], { y: 1530, fs: 70, destaque: '#FF2A3A', fonte: "'Anton', 'DejaVu Sans', sans-serif", enfase: ['NUNCA', 'CASTELO', 'SUMIU', 'DESAPARECIAM', 'SEGREDO', 'ERRADA'] })
  .esconder([[57.6, 999]]);

// ===================== API DO RENDER =====================
function opacidade(t, janelas) {
  let o = 0;
  for (const [a, b] of janelas) {
    if (t < a || t > b + FADE) continue;
    const ent = a === 0 ? 1 : Math.min(1, (t - a) / FADE), sai = t <= b ? 1 : 1 - (t - b) / FADE;
    o = Math.max(o, Math.min(ent, sai));
  }
  return o;
}
function desenharAtores(t) {
  for (const A of ATORES) {
    const o = opacidade(t, A.janelas);
    A.g.style.display = o > 0 ? '' : 'none';
    A.g.setAttribute('opacity', o.toFixed(3));
    if (o > 0) A.b.desenhar(t);
  }
  for (const P of PROPS) {
    const o = opacidade(t, P.janelas);
    if (o <= 0) { P.el.style.display = 'none'; continue; }
    const [x, y] = P.ator.mao(P.mao);
    P.el.style.display = '';
    P.el.setAttribute('opacity', o.toFixed(3));
    P.el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${P.escala})`);
  }
}
window.__timeline = tl;
window.__duration = END;
window.__seek = t => { tl.seek(t, false); desenharAtores(t); leg.seek(t); };
window.__seek(0);
if (!navigator.webdriver) {
  tl.eventCallback('onUpdate', () => { const t = tl.time(); desenharAtores(t); leg.seek(t); });
  document.addEventListener('click', () => tl.paused() ? tl.play() : tl.pause());
}

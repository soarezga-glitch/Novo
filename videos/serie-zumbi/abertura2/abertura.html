<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Abertura Os Sobreviventes</title>
<!-- ABERTURA OFICIAL — OS SOBREVIVENTES (skill os-sobreviventes §11): voo de drone por 3 cenários (rodovia → prédio → cervo),
     lembranças rápidas (infectados, o último morador, a travessia, a cidade alagada) e o LOGO oficial. Vertical 1080×1920, 15 s.
     O número e o nome do episódio vêm de episodio.js. -->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; display: block; }
  @font-face { font-family: 'Anton'; src: url(fontes/anton.woff2); }
  text { font-family: 'Anton', sans-serif; }
</style>
<script src="episodio.js"></script>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <filter id="grao" x="0" y="0" width="100%" height="100%"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1"/><feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1.3 -0.5"/></filter>
    <filter id="desfoque"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="dof" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="glowLogo"><stop offset="0" stop-color="#8A2A14" stop-opacity=".55"/><stop offset=".6" stop-color="#5A1A10" stop-opacity=".2"/><stop offset="1" stop-color="#2A0A08" stop-opacity="0"/></radialGradient>
    <radialGradient id="vin" cx=".5" cy=".5" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient>
    <radialGradient id="sol"><stop offset="0" stop-color="#FFE2A0" stop-opacity=".75"/><stop offset=".25" stop-color="#FFB060" stop-opacity=".35"/><stop offset="1" stop-color="#FF8040" stop-opacity="0"/></radialGradient>
    <radialGradient id="brasa"><stop offset="0" stop-color="#FFC060"/><stop offset="1" stop-color="#FF5A1A" stop-opacity="0"/></radialGradient>
    <symbol id="folha" viewBox="-30 -14 60 28"><path d="M-28 0 Q-10 -14 18 -6 Q28 0 18 6 Q-10 14 -28 0Z" fill="#070904"/></symbol>
  </defs>
  <g id="planos"></g>
  <g id="sol-g" style="mix-blend-mode:screen"></g>
  <g id="aves"></g>
  <g id="poeira" style="mix-blend-mode:screen"></g>
  <g id="folhas" filter="url(#dof)"></g>
  <g id="logo-g"></g>
  <rect width="1080" height="1920" fill="url(#vin)"/>
  <rect id="flash" width="1080" height="1920" fill="#FFF2DA" opacity="0"/>
  <rect width="1080" height="1920" filter="url(#grao)" opacity=".16" style="mix-blend-mode:overlay"/>
  <rect id="preto" width="1080" height="1920" fill="#000" opacity="0"/>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg', $ = s => document.querySelector(s);
const sm = u => u * u * (3 - 2 * u), cl = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, u) => a + (b - a) * u;
const rnd = (i, k = 0) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
const EP = window.EPISODIO || { num: '', nome: '' };
const DUR = 15.0, LOGO = 11.6;
// ===== planos de drone (imagem em pé cobrindo a tela; câmera: zoom e centro no início → fim) =====
const DRONE = [
  { a: 0.0, b: 2.95, img: 'img/rodovia.png', cam: [1.02, 520, 1180, 1.38, 640, 900], sol: [745, 690] },     // avança pela rodovia rumo à cidade
  { a: 2.95, b: 5.75, img: 'img/predio.png', cam: [1.32, 520, 1420, 1.08, 470, 700], sol: [810, 660] },     // sobe pela fachada
  { a: 5.75, b: 8.55, img: 'img/cervo.png', cam: [1.3, 400, 1000, 1.18, 640, 880], sol: [750, 650] },       // desliza de lado até o cervo e o sol
];
// ===== lembranças rápidas (painéis deitados da referência) =====
const FLASH = ['zumbis', 'janela', 'travessia', 'alagada'].map((n, i) => ({ a: 8.55 + i * (LOGO - 8.55) / 4, b: 8.55 + (i + 1) * (LOGO - 8.55) / 4, img: `img/${n}.png`, dx: i % 2 ? -1 : 1 }));
$('#planos').innerHTML = DRONE.map((p, i) => `<g id="d${i}" opacity="0"><g class="cam"><image href="${p.img}" x="0" y="0" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"/></g></g>`).join('') +
  FLASH.map((p, i) => `<g id="f${i}" opacity="0"><image href="${p.img}" x="-300" y="-300" width="1680" height="2520" preserveAspectRatio="xMidYMid slice" filter="url(#desfoque)" opacity=".75"/><rect width="1080" height="1920" fill="#000" opacity=".35"/>
    <g class="cam"><image href="${p.img}" x="-260" y="${960 - 600}" width="1600" height="1200" preserveAspectRatio="xMidYMid slice"/></g></g>`).join('');
// ===== logo oficial =====
$('#logo-g').innerHTML = `<g id="logo" opacity="0"><rect width="1080" height="1920" fill="#0C0A0C"/><ellipse cx="540" cy="900" rx="760" ry="640" fill="url(#glowLogo)"/>
  <g id="brasas"></g>
  <g id="logo-img"><image href="img/logo.png" x="20" y="${900 - 210}" width="1040" height="416"/></g>
  <g id="ep1" opacity="0"><text x="540" y="1250" font-size="72" text-anchor="middle" fill="#E8E2D2" letter-spacing="16" style="filter:drop-shadow(0 4px 8px #000)">EPISÓDIO ${EP.num}</text></g>
  <g id="ep2" opacity="0"><text x="540" y="1350" font-size="80" text-anchor="middle" fill="#E8B23A" letter-spacing="4" style="filter:drop-shadow(0 4px 8px #000)">${EP.nome}</text></g></g>`;

window.__duration = DUR;
window.__seek = t => {
  const fr = Math.round(t * 30);
  // drone: o plano atual entra com um clarão rápido (corte "de passagem")
  DRONE.forEach((p, i) => { const g = $('#d' + i), on = t >= p.a - 0.18 && t < p.b + (i === 2 ? 0 : 0.18);
    g.setAttribute('opacity', on ? cl(Math.min((t - (p.a - 0.18)) / 0.25, 1), 0, 1).toFixed(2) : 0);
    if (on) { const u = sm(cl((t - p.a) / (p.b - p.a), 0, 1)), c = p.cam, z = lerp(c[0], c[3], u);
      let cx = lerp(c[1], c[4], u), cy = lerp(c[2], c[5], u); cx = cl(cx, 540 / z, 1080 - 540 / z); cy = cl(cy, 960 / z, 1920 - 960 / z);
      const bx = Math.sin(t * 1.7) * 2.5, by = Math.cos(t * 1.3) * 2, rot = Math.sin(t * 0.8 + i) * 0.6;   // balanço do drone
      g.querySelector('.cam').setAttribute('transform', `translate(${540 + bx} ${960 + by}) rotate(${rot.toFixed(2)}) scale(${z.toFixed(4)}) translate(${-cx} ${-cy})`);
      if (t >= p.a && t < p.b) { const sx = 540 + (p.sol[0] - cx) * z, sy = 960 + (p.sol[1] - cy) * z, pul = 1 + Math.sin(t * 3) * 0.05;
        $('#sol-g').innerHTML = `<circle cx="${sx.toFixed(0)}" cy="${sy.toFixed(0)}" r="${(420 * pul).toFixed(0)}" fill="url(#sol)"/><circle cx="${(540 + (540 - sx) * 0.6).toFixed(0)}" cy="${(960 + (960 - sy) * 0.6).toFixed(0)}" r="60" fill="#FFB070" opacity=".12"/><circle cx="${(540 + (540 - sx) * 1.1).toFixed(0)}" cy="${(960 + (960 - sy) * 1.1).toFixed(0)}" r="26" fill="#FFD0A0" opacity=".15"/>`; } } });
  if (t >= 8.55) $('#sol-g').innerHTML = '';
  // lembranças: empurra a câmera e corta seco
  FLASH.forEach((p, i) => { const on = t >= p.a && t < p.b; $('#f' + i).setAttribute('opacity', on ? 1 : 0);
    if (on) { const u = (t - p.a) / (p.b - p.a), z = 1.0 + u * 0.12; $('#f' + i).querySelector('.cam').setAttribute('transform', `translate(${540 + p.dx * u * 40} 960) scale(${z.toFixed(4)}) translate(-540 -960)`); } });
  // clarões nos cortes
  const cortes = [2.95, 5.75, 8.55, ...FLASH.map(p => p.a).slice(1), LOGO];
  let fl = 0; cortes.forEach(c => { if (t >= c - 0.05 && t < c + 0.25) fl = Math.max(fl, (1 - Math.abs(t - c) / 0.25) * (c === LOGO ? 0.9 : 0.55)); });
  $('#flash').setAttribute('opacity', fl.toFixed(2));
  // aves cruzando o céu (rodovia e cervo)
  let av = '';
  if (t < 2.95 || (t >= 5.75 && t < 8.55)) for (let k = 0; k < 6; k++) { const t0 = t < 2.95 ? 0 : 5.75, x = 120 + k * 50 + (t - t0) * (90 + k * 8), y = 520 + (k % 3) * 30 - (t - t0) * 20 + Math.sin(t * 6 + k) * 6, w = 12 + Math.sin(t * 14 + k * 2) * 6;
    av += `<path d="M${x.toFixed(0)} ${y.toFixed(0)} q8 ${(-w * 0.6).toFixed(1)} 16 0 q8 ${(-w * 0.6).toFixed(1)} 16 0" stroke="#1A1218" stroke-width="3.5" fill="none"/>`; }
  $('#aves').innerHTML = av;
  // poeira dourada flutuando
  let po = ''; if (t < LOGO) for (let k = 0; k < 26; k++) { const x = (rnd(k, 1) * 1080 + t * (20 + rnd(k, 2) * 40)) % 1080, y = (rnd(k, 3) * 1920 - t * (14 + rnd(k, 4) * 26) + 1920) % 1920;
    po += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(1.5 + rnd(k, 5) * 3).toFixed(1)}" fill="#FFD9A0" opacity="${(0.25 + 0.4 * Math.abs(Math.sin(t * 2 + k))).toFixed(2)}"/>`; }
  $('#poeira').innerHTML = po;
  // folhas em primeiro plano passando rápido (sensação de voo/parallax)
  let fo = ''; if (t < 8.55) for (let k = 0; k < 4; k++) { const per = 1.2 + rnd(k, 7) * 0.6, ph = ((t + rnd(k, 8) * per) % per) / per, lado = k % 2 ? 1 : -1;
    const x = lado > 0 ? 1080 + 40 - ph * 380 : -40 + ph * 380, y = 1650 + rnd(k, 9) * 300 - ph * 420, s = 6 + rnd(k, 10) * 4;
    fo += `<use href="#folha" x="-30" y="-14" width="60" height="28" transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${(ph * 220 + k * 40).toFixed(0)}) scale(${s.toFixed(2)})"/>`; }
  $('#folhas').innerHTML = fo;
  // logo: entra com a batida, encolhe devagar, brasas subindo; episódio embaixo
  const lo = t >= LOGO; $('#logo').setAttribute('opacity', lo ? 1 : 0);
  if (lo) { const u = t - LOGO, esc = 1.18 - 0.18 * sm(cl(u / 0.4, 0, 1)) + u * 0.01, tr = u < 0.5 ? (rnd(fr, 21) - 0.5) * 14 * (1 - u / 0.5) : 0;
    $('#logo-img').setAttribute('transform', `translate(${(540 + tr).toFixed(1)} 900) scale(${esc.toFixed(4)}) translate(-540 -900)`);
    $('#ep1').setAttribute('opacity', cl((u - 0.9) / 0.4, 0, 1).toFixed(2)); $('#ep2').setAttribute('opacity', cl((u - 1.3) / 0.4, 0, 1).toFixed(2));
    let br = ''; for (let k = 0; k < 30; k++) { const per = 2 + rnd(k, 11) * 2, ph = ((u + rnd(k, 12) * per) % per) / per;
      br += `<circle cx="${(rnd(k, 13) * 1080 + Math.sin(u * 2 + k) * 30).toFixed(0)}" cy="${(1900 - ph * 1500).toFixed(0)}" r="${(3 + rnd(k, 14) * 6).toFixed(1)}" fill="url(#brasa)" opacity="${(1 - ph).toFixed(2)}"/>`; }
    $('#brasas').innerHTML = br; }
  $('#preto').setAttribute('opacity', (t > DUR - 0.6 ? (t - (DUR - 0.6)) / 0.6 : 0).toFixed(2));
  $('#turb').setAttribute('seed', fr % 97);
};
window.__seek(0);
</script>
</body>
</html>

     Dimas chega voando pelo mata-burro, derruba a porteira e crava um virote de vergalhão na cabeça dele. Narrador gravado pelo usuário;
     personagens com Qwen3-TTS. Tempos de cada plano vêm das falas (segmentos). -->

<script>

const AVP = AV.proj({ hz: 860, fx: 540, h: 1920 });
const CURRAL = Si(72), MB = Si(75), PORT = Si(71);

cena('c-flashV', Si(60, 'noite').estrada({}) + `<rect width="1080" height="1920" fill="#2A3A6A" opacity=".3" style="mix-blend-mode:multiply"/>`);
cena('c-colo', Si(74).vale({ festa: false, amanhecer: true }) + `<rect width="1080" height="1920" fill="#B08A50" opacity=".45" style="mix-blend-mode:color"/><rect width="1080" height="1920" fill="#F2D8A0" opacity=".18"/>`);
cena('c-mb', MB.mataBurro({ chao: 1420, mbX: 430, ptX: 900 }));
// close do tanque: o marcador de gasolina caindo pro E
cena('c-tanque', `<rect width="1080" height="1920" fill="#2A2228"/><g opacity=".5">${[...Array(14)].map((_, i) => `<rect x="${i * 80 - 20}" y="${300 + (i % 3) * 60}" width="60" height="${600 + (i % 4) * 80}" fill="#4A3A44"/>`).join('')}</g>
  <path d="M60 760 Q60 520 540 500 Q1020 520 1020 760 Q1020 1180 540 1220 Q60 1180 60 760Z" fill="#141418" stroke="${L}" stroke-width="10"/>
  <path d="M120 700 Q540 560 960 700" stroke="${AMBAR}" stroke-width="26" fill="none" opacity=".85"/><path d="M110 760 Q540 620 970 760" stroke="${VERMELHO}" stroke-width="10" fill="none" opacity=".8"/>
  <path d="M200 600 Q540 540 880 600" stroke="#5A5A64" stroke-width="10" fill="none" opacity=".6"/>
  <circle cx="540" cy="900" r="230" fill="#2A2A30" stroke="#C8CED6" stroke-width="18"/><circle cx="540" cy="900" r="200" fill="#E8E2D0" stroke="${L}" stroke-width="5"/>
  ${[...Array(9)].map((_, i) => { const a = (-60 + i * 15) * Math.PI / 180; return `<path d="M${f1(540 + Math.sin(a) * 170)} ${f1(900 - Math.cos(a) * 170)} L${f1(540 + Math.sin(a) * (i % 2 ? 150 : 130))} ${f1(900 - Math.cos(a) * (i % 2 ? 150 : 130))}" stroke="${i < 2 ? VERMELHO : L}" stroke-width="${i % 2 ? 6 : 10}"/>`; }).join('')}
  <text x="${f1(540 + Math.sin(-1.05) * 105)}" y="${f1(900 - Math.cos(-1.05) * 105 + 18)}" font-size="58" text-anchor="middle" fill="${VERMELHO}">E</text><text x="${f1(540 + Math.sin(1.05) * 105)}" y="${f1(900 - Math.cos(1.05) * 105 + 18)}" font-size="58" text-anchor="middle" fill="${L}">F</text>
  <text x="540" y="1030" font-size="34" text-anchor="middle" fill="#5A5A60" letter-spacing="4">GASOLINA</text>
  <g id="ponteiro"><path d="M534 900 L540 730 L546 900Z" fill="${VERMELHO}" stroke="${L}" stroke-width="3"/><circle cx="540" cy="900" r="22" fill="#2A2A30" stroke="#C8CED6" stroke-width="5"/></g>
  <circle id="luzRes" cx="800" cy="1120" r="34" fill="#FF6A2A" stroke="${L}" stroke-width="5"/><circle cx="800" cy="1120" r="80" fill="#FF6A2A" opacity=".25" class="luzResB"/>
  <path d="M-40 380 Q300 320 400 260 M1120 380 Q780 320 680 260" stroke="#C8CED6" stroke-width="34" fill="none"/>`);
// close da perna do Tião: calça rasgada, a mordida e o sangue escorrendo
cena('c-perna', `<rect width="1080" height="1920" fill="#3A2C1C"/>${[...Array(50)].map((_, i) => `<path d="M${(i * 137) % 1080} ${(i * 251) % 1920} l${(i % 7) * 8 - 24} ${(i % 3) * 4 - 4}" stroke="#B8984A" stroke-width="5" opacity=".6"/>`).join('')}
  <path d="M300 -40 L780 -40 L760 1500 L330 1500Z" fill="#3A4250" stroke="${L}" stroke-width="10"/>
  <path d="M360 -40 Q380 700 350 1500 M720 -40 Q700 700 740 1500" stroke="#2A3240" stroke-width="8" fill="none"/>
  <path d="M520 -40 V1500" stroke="#4A5466" stroke-width="5" stroke-dasharray="16 10"/>
  <path d="M380 560 L450 470 L520 540 L600 450 L700 560 L690 900 L610 980 L540 900 L460 990 L370 900Z" fill="#C49478" stroke="${L}" stroke-width="7"/>
  <path d="M380 560 l-40 30 l30 20 M700 560 l40 40 l-36 10 M370 900 l-30 40 l40 -6 M690 900 l40 30 l-44 4" stroke="#3A4250" stroke-width="12" fill="none"/>
  <path d="M470 690 Q540 620 610 690 Q600 760 540 770 Q480 760 470 690Z" fill="#6A1410"/>
  ${[0, 1, 2, 3, 4, 5].map(i => `<path d="M${484 + i * 22} ${i % 5 === 0 ? 690 : 668 + Math.abs(2.5 - i) * 6} l10 22 l10 -22Z" fill="#E8E2D0" opacity="0" />`).join('')}
  ${[[480, 700], [505, 680], [530, 674], [555, 676], [580, 684], [600, 700], [485, 742], [510, 756], [540, 762], [570, 756], [596, 740]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="9" ry="12" fill="#2A0604"/>`).join('')}
  <path d="M500 760 Q490 900 505 1060 Q512 1120 500 1180" stroke="#8A1410" stroke-width="20" fill="none" stroke-linecap="round"/><path d="M560 770 Q575 920 560 1000" stroke="#8A1410" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M600 740 Q620 820 612 880" stroke="#8A1410" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M500 760 Q490 900 505 1060" stroke="#C83A2A" stroke-width="6" fill="none" opacity=".7"/>
  <path d="M300 1500 L330 1360 L780 1360 L800 1500 L840 1700 Q820 1760 700 1760 L280 1760 Q250 1700 300 1500Z" fill="#3A2618" stroke="${L}" stroke-width="10"/><path d="M290 1720 H820" stroke="#1A120C" stroke-width="20"/>
  <g id="gotas">${[0, 1, 2].map(i => `<path class="gota" data-i="${i}" d="M0 -18 Q10 0 0 10 Q-10 0 0 -18Z" fill="#8A1410" stroke="#2A0604" stroke-width="2"/>`).join('')}</g>
  <ellipse cx="520" cy="1790" rx="90" ry="20" fill="#5A0A08" opacity=".8"/>`);
scenes.push(`<g id="fim" class="scene"><rect width="1080" height="1920" fill="#08090E"/>${Si(20, 'noite').estrada({})}<rect width="1080" height="1920" fill="#000" opacity=".6"/>
  <g id="fim-t">${txt('fim-a', 780, [['DIA 3 · ', BRANCO], ['PARTE 4', AMBAR]], 120)}${txt('fim-b', 920, [['CONTINUA...', BRANCO]], 96)}</g>
  <g id="fim-c" transform="translate(540 1100)"><rect x="-340" y="-56" width="680" height="112" rx="56" fill="${AMBAR}" stroke="#000" stroke-width="5"/><text y="22" font-size="54" text-anchor="middle" fill="#16120A">SEGUE PRA PARTE 5 ↓</text></g></g>`);
$('#scenes').innerHTML = scenes.join('');

const GANCHO = `<g id="c-gancho"><rect width="1080" height="1920" fill="#C8342A" opacity=".2" style="mix-blend-mode:multiply"/><rect width="1080" height="1920" fill="#000" opacity=".3"/>` +
  txt('g-dia', 880, [['DIA ', BRANCO], ['3', AMBAR]], 330) + txt('g-apoc', 1060, [['PARTE 4', VERMELHO]], 110) + `<rect id="g-flash" width="1080" height="1920" fill="#FFF6E0"/></g>`;
const TOPO = [
  GANCHO, selo('selo1', 'APOCALIPSE ZUMBI · DIA 3', 'DIA 3 · 17:52'), selo('selo2', 'ENQUANTO ISSO · 20 KM DALI', 'NA CIDADE'),
  etiqueta('t-20km', 540, 1180, '20 KM DALI', AMBAR), txt('t-cidade', 330, [['A ', BRANCO], ['CIDADE', AMBAR]], 120),
  etiqueta('t-facao', 330, 560, 'FACÃO DE CANA', AMBAR, '#16120A', -4), etiqueta('t-machad', 640, 600, 'MACHADINHA', AMBAR, '#16120A', 4), etiqueta('t-vergal', 520, 640, 'VERGALHÃO', VERMELHO, BRANCO, -3),
  txt('t-dimas', 380, [['DIMAS', AMBAR]], 220), txt('t-naopara', 500, [['NÃO PARA PRA ', BRANCO], ['NINGUÉM', VERMELHO]], 72),
  onoma('o-tchac', 700, 640, 'TCHAC!', 10, BRANCO, 140), etiqueta('t-vazio', 540, 1340, 'QUASE VAZIO', VERMELHO, BRANCO), txt('t-tomada', 360, [['TOMADA', VERMELHO]], 160),
  etiqueta('t-mesma', 540, 330, 'A MESMA ESTRADA', AMBAR), etiqueta('t-festa', 540, 330, 'NOITE DA FESTA', '#2A241A', AMBAR),
  etiqueta('t-volta', 540, 330, 'DE VOLTA AO CURRAL', '#2A241A', AMBAR), etiqueta('t-colo', 540, 330, 'MUITOS ANOS ATRÁS', '#5A4020', '#F2E2C0'),
  txt('t-tarde', 360, [['TARDE ', BRANCO], ['DEMAIS', VERMELHO]], 120), onoma('o-grito', 760, 520, 'AAAAH!', 8, BRANCO, 110), onoma('o-vrum', 330, 560, 'VRUUUM!', -8, AMBAR, 120),
  onoma('o-crac', 760, 760, 'CRAC!', 10, BRANCO, 150), etiqueta('t-2passos', 540, 330, 'A DOIS PASSOS', VERMELHO, BRANCO), txt('t-silencio', 360, [['SILÊNCIO', BRANCO]], 110),
  `<g id="quem" transform="translate(540 1452)"><rect id="quem-r" x="-120" y="-30" width="240" height="60" rx="30" fill="#0B0D14" fill-opacity=".85" stroke="${AMBAR}" stroke-width="3"/><text id="quem-t" y="14" font-size="40" text-anchor="middle" fill="${AMBAR}" letter-spacing="2"></text></g>`,
  `<rect id="clarao" width="1080" height="1920" fill="#FFF6E0"/>`, `<rect id="preto" width="1080" height="1920" fill="#000"/>`];
$('#topo').innerHTML = TOPO.join('');

// ===================== ELENCO =====================
const BOCA = q => t => { const c = (window.BOCAS || {})[q] ? window.BOCAS[q][Math.floor(t * 30)] : '-'; return c && c !== '-' ? c : 'smile'; };
const TIAO = { figurino: 'tiao', seed: 60, boca: BOCA('tiao') };
const ANINHA = { figurino: { preset: 'neta', cor: '#C97A9A' }, seed: 62, boca: BOCA('aninha') };
const SEUZE_ZUMBI = { figurino: { preset: 'seuze', zumbi: true, cabelo: 'curto' }, seed: 61, cor: '#B8C4A4', corLonge: '#9EAA8C' };
const SEUZE_JOVEM = { figurino: { preset: 'seuze', corCabelo: '#3A2A20' }, seed: 61 };
const DIMAS = { figurino: 'dimas', seed: 90, boca: BOCA('dimas') };
const INFECTADO = { figurino: 'zumbi', seed: 77, cor: '#A8B494', corLonge: '#8E9A7C' };
const VULTO = i => ({ figurino: 'vulto', cor: '#17181E', corLonge: '#101116', bochecha: '#17181E', seed: 70 + i });
const ATORES = [], ITENS = [], MOTOS = [];
function ator(escala, janelas, opts = {}, pai = '#atores') { const w = document.createElementNS(NS, 'g'), g = document.createElementNS(NS, 'g'); w.appendChild(g); $(pai).appendChild(w); const b = new Boneco(g, { escala, seed: 4, ...opts }); b.grupo = w; ATORES.push({ b, g: w, janelas }); return b; }
function item(svg, janelas, pai = '#atores') { const g = document.createElementNS(NS, 'g'); $(pai).appendChild(g); g.innerHTML = svg; ITENS.push({ g, janelas }); return g; }
const J = n => [[S[n][0], S[n][1]]];
const JJ = (...ns) => ns.map(n => [S[n][0], S[n][1]]);
const ATE = (a, b) => [[S[a][0], S[b][1]]];
const dentro = (t, janelas) => janelas.some(([a, b]) => t >= a && t < b);
const sm = u => u * u * (3 - 2 * u), cl = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, u) => a + (b - a) * u;
const ang = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
// interpola uma lista de chaves [[t, v], ...] (suave entre elas)
const chave = (K, t) => { if (t <= K[0][0]) return K[0][1]; for (let i = 1; i < K.length; i++) if (t <= K[i][0]) { const u = sm((t - K[i - 1][0]) / (K[i][0] - K[i - 1][0])); return Array.isArray(K[i][1]) ? K[i][1].map((v, j) => lerp(K[i - 1][1][j], v, u)) : lerp(K[i - 1][1], K[i][1], u); } return K[K.length - 1][1]; };

// ---------- o DIMAS NA MOTO (camadas: moto de trás → besta nas costas → piloto → peças da frente da moto) ----------
function piloto(vista, k, janelas, { pos, dir = 1, extra = null, semBesta = null, freio = null } = {}) {
  const wrap = document.createElementNS(NS, 'g'); $('#atores').appendChild(wrap);
  const [fundo, costas, corpo, frente] = [0, 1, 2, 3].map(() => { const g = document.createElementNS(NS, 'g'); wrap.appendChild(g); return g; });
  const b = new Boneco(corpo, { escala: k, ...DIMAS });
  const M = { vista, k, b, wrap, fundo, costas, frente, janelas, pos, dir, extra, semBesta, freio };
  M.montar = (t0, t1) => {
    if (vista === 'lado') { const P = Moto.lado.pontos(k); b.base(t0, t1, 'montar', { assento: P.assento, pe: P.pe, guidao: P.guidao, chao: 0 }); }
    else { const P = Moto[vista].pontos(k); b.base(t0, t1, 'agachar', { x: 0, y: P.pe[0][1] + 10 * k, vista: 'frente', quanto: 110, abertura: 90, costas: vista === 'tras' });
      b.braco('e', t0, t1, 'alcancar', { alvo: P.guidao[0] }); b.braco('d', t0, t1, 'alcancar', { alvo: P.guidao[1] }); }
    return M; };
  MOTOS.push(M); return M;
}
function desenharMoto(M, t) {
  const on = dentro(t, M.janelas); M.wrap.style.display = on ? '' : 'none'; if (!on) return;
  const p = M.pos(t), k = M.k;

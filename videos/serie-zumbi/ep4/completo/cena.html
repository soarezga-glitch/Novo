<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Apocalipse Zumbi: Dia 3, Parte 2</title>
<!-- Série APOCALIPSE ZUMBI — DIA 3, PARTE 2 (história inteira, ~5 min): o pasto, a fita rosa, a casa vazia do seu Zé, a Aninha na caixa d'água, a fuga, o córrego, a volta ao sítio e o curral. Narrador gravado pelo usuário; Tião, Aninha e Seu Zé com Qwen3-TTS (vozes descritas, naturais). Os tempos de cada plano vêm das falas (segmentos), não de números fixos. -->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; display: block; }
  @font-face { font-family: 'Anton'; src: url(../fontes/anton.woff2); }
  @font-face { font-family: 'Luckiest Guy'; src: url(../fontes/luckiest-guy.woff2); }
  text:not([font-family]) { font-family: 'Anton', sans-serif; }
</style>
<script src="../gsap.min.js"></script>
<script src="../boneco.js"></script>
<script src="../paletas.js"></script>
<script src="../cenario.js"></script>
<script src="../sitio.js"></script>
<script src="../palco.js"></script>
<script src="../legenda.js"></script>
<script src="legenda-dados.js"></script>
<script src="bocas.js"></script>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
      <feFlood flood-color="#0A0A0E"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sombraTxt" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".8"/></filter>
    <radialGradient id="vin" cx=".5" cy=".5" r=".72"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
  </defs>
  <g id="cam"><g id="scenes"></g><g id="atores"></g><g id="props"></g><g id="luzes"></g></g>
  <rect width="1080" height="1920" fill="url(#vin)"/>
  <g id="escuro"><rect width="1080" height="1920" fill="#05070E"/></g>
  <g id="topo"></g>
  <g id="legenda"></g>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const AMBAR = '#E8B23A', BRANCO = '#F2EEE2', VERMELHO = '#C8342A', L = '#0E0E14';
const Si = (n, hora = 'amanhecer') => Sitio(Cenario({ seed: n, luz: -1, hora, prefixo: 's' + n }));
// ---- tempos vindos das falas: SG(id) = segmento, W(id, n) = início da n-ésima palavra da fala ----
const SEG = Object.fromEntries((window.SEGMENTOS || []).map(s => [s.id, s]));
const SG = id => SEG[id];
const W = (id, n) => { const ws = (window.PALAVRAS || []).filter(p => p.seg === id); return (ws[Math.min(n, ws.length - 1)] || { start: SG(id).de }).start; };
const FIM_FALA = SG('P25').ate + 0.35, CARTAO = FIM_FALA + 0.8, END = CARTAO + 3.4;
const PISO_LEG = 1560;

// ===================== PLANOS (início de cada um; termina quando o próximo começa) =====================
const ORDEM = [
  ['abre', 0], ['trancado', 3.0], ['mac', SG('N02').de], ['pasto', W('N02', 6)], ['regua', SG('N03').de - 0.1], ['marcas', W('N03', 6)],
  ['dezenas', SG('N04').de - 0.1], ['cerca', SG('N05').de - 0.1], ['fita', SG('P02').de - 0.2], ['portao', SG('N06').de - 0.1], ['bolo', W('N06', 12)],
  ['cadeiras', SG('N07').de - 0.1], ['chama', SG('P03').de - 0.2], ['caixa', SG('N08').de - 0.1],
  ['an1', SG('P04').de - 0.2], ['ti1', SG('P05').de - 0.2], ['an2', SG('P06').de - 0.2], ['congela', SG('N09').de - 0.1], ['ti2', SG('P07').de - 0.2],
  ['flash', SG('P08').de - 0.2], ['mapa', SG('N10').de - 0.1], ['ti3', SG('P09').de - 0.2], ['an3', SG('P10').de - 0.2], ['garrafa', SG('N11').de - 0.1],
  ['panela', SG('N12').de - 0.1], ['ti4', SG('P11').de - 0.2], ['escada', SG('N13').de - 0.1], ['rostos', SG('N14').de - 0.1], ['chapeu', SG('N15').de - 0.1],
  ['corre', SG('P12').de - 0.2], ['porta', SG('N16').de - 0.1], ['fuga', SG('N17').de - 0.1], ['presa', SG('N18').de - 0.1], ['rasga', SG('N19').de - 0.1],
  ['corrego', SG('N20').de - 0.1], ['escuta', SG('P15').de - 0.2], ['espera', SG('N21').de - 0.1], ['chegam', SG('N22').de - 0.1], ['tranquei', SG('P17').de - 0.2],
  ['casa', SG('N23').de - 0.1], ['radio', W('N23', 6)], ['arromb', SG('N24').de - 0.1], ['pano', SG('N25').de - 0.1], ['vovo', SG('P18').de - 0.2],
  ['fica', SG('P19').de - 0.2], ['enxada', SG('N26').de - 0.1], ['vacas', SG('N27').de - 0.1], ['feno', SG('N28').de - 0.1], ['dialogo', SG('P20').de - 0.2],
  ['morre', SG('N29').de - 0.1], ['mexe', SG('N30').de - 0.1], ['range', SG('N31').de - 0.1], ['chamou', SG('P24').de - 0.2], ['vovoZ', SG('P25').de - 0.2], ['_fim', FIM_FALA],
];
const S = {}; ORDEM.forEach(([k, t], i) => { if (i < ORDEM.length - 1) S[k] = [t, ORDEM[i + 1][1]]; });

// ===================== CENAS =====================
const scenes = [];
const cena = (id, corpo) => scenes.push(`<g id="${id}" class="scene">${corpo}</g>`);
const zoom = (corpo, k, cx = 540, cy = 1300) => `<g transform="translate(${cx} ${cy}) scale(${k}) translate(${-cx} ${-cy})">${corpo}</g>`;
const txt = (id, y, partes, fs = 110) => `<g id="${id}" filter="url(#sombraTxt)"><text x="540" y="${y}" font-size="${fs}" text-anchor="middle" stroke="#000" stroke-width="${fs * 0.08}" paint-order="stroke">${partes.map(([t, c]) => `<tspan fill="${c || BRANCO}">${t}</tspan>`).join('')}</text></g>`;
const selo = (id, linha1, linha2) => `<g id="${id}" transform="translate(540 150)"><rect x="-300" y="-62" width="600" height="136" rx="22" fill="#0B0D14" fill-opacity=".86" stroke="#2A2E3A" stroke-width="3"/><circle cx="-232" cy="-26" r="9" fill="${VERMELHO}"/><text x="14" y="-14" font-size="30" text-anchor="middle" fill="${VERMELHO}" letter-spacing="2">${linha1}</text><text y="52" font-size="68" text-anchor="middle" fill="${BRANCO}" letter-spacing="3">${linha2}</text></g>`;
const etiqueta = (id, x, y, t, cor = AMBAR, corTxt = '#16120A', rot = 0) => `<g id="${id}" transform="translate(${x} ${y}) rotate(${rot})"><rect x="${-t.length * 13 - 30}" y="-34" width="${t.length * 26 + 60}" height="68" rx="34" fill="${cor}" stroke="#000" stroke-width="4"/><text y="14" font-size="40" text-anchor="middle" fill="${corTxt}">${t}</text></g>`;
const onoma = (id, x, y, t, rot = -8, cor = BRANCO) => `<g id="${id}" transform="translate(${x} ${y}) rotate(${rot})" filter="url(#sombraTxt)"><text font-size="120" text-anchor="middle" fill="${cor}" stroke="#000" stroke-width="12" paint-order="stroke" font-family="'Luckiest Guy', sans-serif">${t}</text></g>`;

const GANCHO = (`<g id="c-gancho"><rect width="1080" height="1920" fill="#C8342A" opacity=".18" style="mix-blend-mode:multiply"/><rect width="1080" height="1920" fill="#000" opacity=".35"/>` +
  txt('g-dia', 880, [['DIA ', BRANCO], ['3', AMBAR]], 330) + txt('g-apoc', 1060, [['PARTE 2', VERMELHO]], 110) + `<rect id="g-flash" width="1080" height="1920" fill="#FFF6E0"/></g>`);
cena('c-estr', Si(60, 'noite').estrada({}));
cena('c-quarto', Si(61).quartoRoca({ chao: 1420, escuro: true }));
cena('c-mac', Si(62).macanetaClose({}));
const VALE = Si(63);
cena('c-vale', VALE.vale({ festa: false, amanhecer: true }));
cena('c-trilhas', `<g id="tr-linhas">${[[-60, 1920], [180, 1920], [420, 1920], [760, 1920], [1000, 1920], [1140, 1700]].map(([x0, y0], i) => `<path d="M${x0} ${y0} Q${(x0 + 670) / 2 + (i % 2 ? 60 : -60)} ${(y0 + 1080) / 2 + 80} 670 1090" stroke="#9A9A5A" stroke-width="${26 - i}" fill="none" opacity=".75" stroke-linecap="round" stroke-dasharray="40 18"/>`).join('')}</g><g id="tr-alvo"><circle cx="670" cy="1040" r="90" fill="none" stroke="${VERMELHO}" stroke-width="8"/></g>`);
// o caminho do seu Zé: da casa dele até a casa do Tião (e a neta ficou)
cena('c-mapa', `<path id="mp-linha" d="M670 1060 Q520 900 330 960 Q160 1020 120 860" stroke="${VERMELHO}" stroke-width="10" fill="none" stroke-dasharray="26 16" stroke-linecap="round"/><g transform="translate(110 840)"><circle r="44" fill="none" stroke="${AMBAR}" stroke-width="7"/></g>` + etiqueta('mp-tiao', 170, 770, 'CASA DO TIÃO') + etiqueta('mp-ze', 700, 1170, 'A NETA FICOU', VERMELHO, BRANCO));
cena('c-rastros', Si(64).rastros({ hz: 700 }));
cena('c-cerca', Si(65).cercaArrebentada({ chao: 1380 }));
const FESTA = Si(66);
cena('c-festa', FESTA.festa({ chao: 1300, abandonada: true }));
cena('c-flash', Si(67, 'noite').festa({ chao: 1300 }) + `<rect width="1080" height="1920" fill="#7A5A2A" opacity=".35" style="mix-blend-mode:multiply"/>`);
const CORR = Si(68);
cena('c-corrego', CORR.corrego({ agua: 1380 }));
cena('c-porteira', Si(69).porteira({ chao: 1440, aberta: true, portaAberta: true }) + `<rect width="1080" height="1920" fill="#E8783A" opacity=".12" style="mix-blend-mode:multiply"/>`);
cena('c-coz', zoom(Si(70).cozinha({ chao: 1300, janelaY: 0.55, lampiao: false, amanhecer: true, cobertorChao: true }), 1.35, 560, 1300));
cena('c-corr', CORR.corredor({ chao: 1460, mochila: false, arrombada: true }));
cena('c-curral', Si(71).curral({ chao: 1400 }) + `<g id="vacas">${[[220, 1450, 0.9, 6], [120, 1520, 1.0, -4], [330, 1560, 1.05, 10]].map(([x, b, k, c]) => CORR.vaca(x, b, k, { dir: 1, cabeca: c })).join('')}</g>`);
scenes.push(`<g id="fim" class="scene"><rect width="1080" height="1920" fill="#08090E"/>${Si(20, 'noite').estrada({})}<rect width="1080" height="1920" fill="#000" opacity=".6"/>
  <g id="fim-t">${txt('fim-a', 780, [['DIA 3 · ', BRANCO], ['PARTE 2', AMBAR]], 120)}${txt('fim-b', 920, [['CONTINUA...', BRANCO]], 96)}</g>
  <g id="fim-c" transform="translate(540 1100)"><rect x="-340" y="-56" width="680" height="112" rx="56" fill="${AMBAR}" stroke="#000" stroke-width="5"/><text y="22" font-size="54" text-anchor="middle" fill="#16120A">SEGUE PRA PRÓXIMA PARTE ↓</text></g></g>`);
$('#scenes').innerHTML = scenes.join('');
const TOPO = [
  GANCHO, selo('selo1', 'APOCALIPSE ZUMBI · DIA 3', 'DIA 3 · 07:30'), selo('selo2', 'APOCALIPSE ZUMBI · DIA 3', 'DIA 3 · 17:40'),
  txt('t-trancado', 330, [['UM HOMEM ', BRANCO], ['FERIDO', VERMELHO]], 100), txt('t-trancado2', 440, [['TRANCADO NA CASA', BRANCO]], 80),
  txt('t-pasto', 330, [['MEIO DO ', BRANCO], ['PASTO', AMBAR]], 104),
  `<g id="t-regua"><path d="M150 1300 L900 1020" stroke="${AMBAR}" stroke-width="12" stroke-linecap="round"/><path d="M136 1270 l30 56 M886 990 l30 56" stroke="${AMBAR}" stroke-width="12" stroke-linecap="round"/>${etiqueta('t-800', 540, 1080, '800 METROS')}</g>`,
  txt('t-dezenas', 330, [['DEZENAS', VERMELHO]], 140), txt('t-casaze', 460, [['A CASA DO ', BRANCO], ['SEU ZÉ', AMBAR]], 92),
  etiqueta('t-rosa', 540, 330, 'COR-DE-ROSA', '#F07AA8', '#2A0A16'), txt('t-nenhuma', 330, [['NENHUMA ', BRANCO], ['PESSOA', VERMELHO]], 100),
  txt('t-mordido', 360, [['"FOI NO ', BRANCO], ['ARAME"', AMBAR]], 104), etiqueta('t-mentiu', 540, 470, 'MORDIDO', VERMELHO, BRANCO),
  etiqueta('t-flash', 540, 330, 'NOITE DA FESTA', '#2A241A', AMBAR),
  onoma('o-clang', 300, 700, 'CLANG!', -10), onoma('o-crac', 760, 1000, 'CRAC!', 8, AMBAR), onoma('o-bum', 540, 620, 'BUM!', -6, VERMELHO),
  txt('t-muitos', 330, [['SÃO ', BRANCO], ['MUITOS', VERMELHO]], 130),
  `<g id="t-20m"><path d="M300 1200 H860" stroke="${VERMELHO}" stroke-width="10" stroke-linecap="round"/><path d="M300 1176 v48 M860 1176 v48" stroke="${VERMELHO}" stroke-width="10"/>${etiqueta('t-20', 580, 1130, '20 METROS', VERMELHO, BRANCO)}</g>`,
  txt('t-sangue', 330, [['SANGUE ', VERMELHO], ['CHAMA ELES', BRANCO]], 92), txt('t-agua', 330, [['A ÁGUA ', BRANCO], ['APAGA O CHEIRO', AMBAR]], 84),
  etiqueta('t-1min', 540, 330, '1 MINUTO', '#2A241A', AMBAR), etiqueta('t-2min', 540, 420, '2 MINUTOS', '#2A241A', AMBAR),
  etiqueta('t-aberta', 300, 1080, 'ABERTA DE NOVO', VERMELHO, BRANCO, -6), txt('t-dentro', 330, [['ARROMBADA ', BRANCO], ['POR DENTRO', VERMELHO]], 88),
  `<g id="quem" transform="translate(540 1452)"><rect id="quem-r" x="-120" y="-30" width="240" height="60" rx="30" fill="#0B0D14" fill-opacity=".85" stroke="${AMBAR}" stroke-width="3"/><text id="quem-t" y="14" font-size="40" text-anchor="middle" fill="${AMBAR}" letter-spacing="2"></text></g>`,
  `<rect id="preto" width="1080" height="1920" fill="#000"/>`];
$('#topo').innerHTML = TOPO.join('');

// ===================== ELENCO =====================
const BOCA = q => t => { const c = (window.BOCAS || {})[q] ? window.BOCAS[q][Math.floor(t * 30)] : '-'; return c && c !== '-' ? c : 'smile'; };
const TIAO = { figurino: 'tiao', seed: 60, boca: BOCA('tiao') };
const ANINHA = { figurino: { preset: 'neta', cor: '#C97A9A' }, seed: 62, boca: BOCA('aninha') };
const SEUZE = { figurino: 'seuze', seed: 61, boca: BOCA('ze') }, SEUZE_PALIDO = { ...SEUZE, cor: '#DCE2CE', corLonge: '#C2CAB4' };
const SEUZE_ZUMBI = { figurino: { preset: 'seuze', zumbi: true, cabelo: 'curto' }, seed: 61, cor: '#B8C4A4', corLonge: '#9EAA8C', boca: BOCA('ze') };
const VULTO = (i) => ({ figurino: 'vulto', cor: '#17181E', corLonge: '#101116', bochecha: '#17181E', seed: 70 + i });
const ATORES = [], ITENS = [];
function ator(escala, janelas, opts = {}, pai = '#atores') { const g = document.createElementNS(NS, 'g'); if (pai) $(pai).appendChild(g); const b = new Boneco(g, { escala, seed: 4, ...opts }); b.grupo = g; ATORES.push({ b, g, janelas }); return b; }
function item(svg, janelas, pai = '#atores') { const g = document.createElementNS(NS, 'g'); $(pai).appendChild(g); g.innerHTML = svg; ITENS.push({ g, janelas }); return g; }
const J = n => [[S[n][0], S[n][1]]];
const JJ = (...ns) => ns.map(n => [S[n][0], S[n][1]]);
const ATE = (a, b) => [[S[a][0], S[b][1]]];
$('#stage defs').insertAdjacentHTML('beforeend', `<clipPath id="clipCaixa"><rect x="0" y="0" width="1080" height="${(1480 - 806 * 0.9).toFixed(0)}"/></clipPath><clipPath id="clipJanZe"><rect x="142" y="897" width="164" height="202"/></clipPath>`);

// gancho
[[300, 1300, 0.9], [760, 1320, 1.0], [540, 1400, 1.2], [140, 1520, 1.45], [920, 1560, 1.55], [520, 1900, 2.2]].forEach(([x, y, k], i) => { const v = ator(k, J('abre'), VULTO(50 + i));
  v.base(0, S.abre[1], 'parado', { x, y, vista: 'frente' }); v.braco('ambos', 0, S.abre[1], 'estender'); v.expressao(0, S.abre[1], 'zumbi'); v.cabeca(0, S.abre[1], { inclinar: (i % 2 ? 1 : -1) * 14, baixar: -6 }); });
// seu Zé trancado
{ const z = ator(1.3, J('trancado'), SEUZE_PALIDO); z.base(S.trancado[0], S.trancado[1], 'sentar', { x: 560, y: 1200, chao: 1440, dir: -1 }); z.expressao(S.trancado[0], S.trancado[1], 'cansado'); z.cabeca(S.trancado[0], S.trancado[1], { baixar: 12, gesto: 'balancar' }); z.braco('ambos', S.trancado[0], S.trancado[1], 'pose', { o: 30, c: 60 }); }
// pasto e régua
{ const t = ator(0.7, ATE('pasto', 'regua'), TIAO); t.base(S.pasto[0], S.regua[1], 'andar', { de: [900, 1560], ate: [300, 1500], passo: 84, chao: x => 1500 + (x - 300) * 0.1 }); t.expressao(S.pasto[0], S.regua[1], 'determinado'); }
// as marcas
const tM = ator(1.35, J('marcas'), TIAO);
tM.base(S.marcas[0], S.marcas[0] + 1.0, 'andar', { de: [1180, 1560], ate: [880, 1560], passo: 110 }); tM.base(S.marcas[0] + 1.0, S.marcas[1], 'agachar', { x: 880, y: 1560, vista: 'perfil', dir: -1, quanto: 120, inclina: 24 });
tM.braco('d', S.marcas[0] + 1.3, S.marcas[1], 'alcancar', { alvo: [700, 1500] }); tM.expressao(S.marcas[0], S.marcas[1], 'preocupado'); tM.cabeca(S.marcas[0] + 1.0, S.marcas[1], { baixar: 18 });
// a fita
const tF = ator(1.6, J('fita'), TIAO); tF.base(S.fita[0], S.fita[1], 'parado', { x: 420, y: 1720, vista: 'perfil', dir: 1 }); tF.braco('d', S.fita[0], S.fita[1], 'pose', { o: 60, c: 70, mao: 'punho' }); tF.expressao(S.fita[0], S.fita[1], 'determinado'); tF.cabeca(S.fita[0], S.fita[1], { baixar: 8 });
const fitaMao = item(`<g><path d="M0 0 q-30 10 -40 -14 q30 -10 40 14 q20 -26 46 -12 q-24 18 -46 12Z" fill="#F07AA8" stroke="${L}" stroke-width="4"/><path d="M0 0 q-10 60 -36 110 M0 0 q14 50 40 96" stroke="#F07AA8" stroke-width="12" fill="none" stroke-linecap="round"/></g>`, J('fita'), '#props');
// a caixa d'água do quintal (fica no cenário da casa do seu Zé em vários planos)
const CX = 760, ARO = 1480 - 806 * 0.9;   // caixa d'água: centro e borda de cima
const QUINTAL = ['portao', 'bolo', 'cadeiras', 'chama', 'caixa', 'an1', 'ti1', 'an2', 'congela', 'ti2', 'ti3', 'an3', 'garrafa', 'panela', 'ti4', 'escada', 'corre', 'porta'];
item(FESTA.caixaDagua(CX, 1480, 0.9), JJ(...QUINTAL));
// a Aninha: escondida na caixa (só cabeça e mãos), depois sai, desce a escada e foge nas costas do Tião
const aC = ator(0.75, JJ('caixa', 'an1', 'ti1', 'an2', 'congela', 'ti2', 'ti3', 'an3', 'garrafa'), ANINHA); aC.grupo.setAttribute('clip-path', 'url(#clipCaixa)');
aC.base(S.caixa[0], S.garrafa[1], 'parado', { x: CX, y: 1010, vista: 'frente' });
aC.braco('e', S.caixa[0], S.garrafa[1], 'alcancar', { alvo: [CX - 48, ARO] }); aC.braco('d', S.caixa[0], S.garrafa[1], 'alcancar', { alvo: [CX + 48, ARO] });
{ const wrap = document.createElementNS(NS, 'g'); wrap.setAttribute('clip-path', 'url(#clipCaixa)'); aC.grupo.removeAttribute('clip-path'); aC.grupo.parentNode.insertBefore(wrap, aC.grupo); wrap.appendChild(aC.grupo); }
aC.expressao(S.caixa[0], S.an2[1], 'medo'); aC.expressao(S.an2[0], S.an2[1], 'chorando'); aC.expressao(S.congela[0], S.garrafa[1], 'triste');
const caixaY = t => { const ap = W('N08', 12); const sobe = t < ap ? 0 : Math.min(1, (t - ap) / 0.8); const sai = t < W('N11', 12) ? 0 : Math.min(1, (t - W('N11', 12)) / 1.2); return 1010 + 180 * (1 - sobe) - 90 * sai; };
const aE = ator(0.75, JJ('panela', 'ti4', 'escada', 'corre'), ANINHA);
// desce a escada da caixa d'água (ao lado da torre) degrau por degrau; no terceiro a madeira estala
const escadaX = CX + 0.9 * 230, degrau = i => 1480 - 0.9 * (530 - i * 58);
aE.base(S.panela[0], S.escada[0] + 0.6, 'parado', { x: escadaX, y: degrau(0), vista: 'frente' });
[[W('N13', 5), 1], [W('N13', 7), 3], [W('N13', 10), 5]].forEach(([t0, i], k, arr) => aE.base(t0, (arr[k + 1] || [S.escada[1]])[0], 'parado', { x: escadaX, y: degrau(i), vista: 'frente' }));
aE.base(S.corre[0], S.corre[1], 'parado', { x: 600, y: 1560, vista: 'perfil', dir: -1 });
aE.braco('ambos', S.panela[0], S.escada[1], 'cima', { mao: 'punho' }); aE.expressao(S.panela[0], S.corre[1], 'medo');

// ===================== LEGENDA =====================
const leg = Legenda($('#legenda'), window.PALAVRAS || [], { y: PISO_LEG, fs: 76, fonte: "'Anton', sans-serif", destaque: AMBAR, cor: BRANCO, contorno: '#000', enfase: ['TIÃO', 'ANINHA', 'ANINHA?', 'MORDIDO', 'MORDIDO.', 'ARAME.', 'PANELA', 'ESTALA.', 'CORRE!', 'SAPATO!', 'SANGUE', 'CÓRREGO.', 'ESCUTANDO.', 'PORTEIRA', 'ARROMBADA.', 'CURRAL.', 'ENXADA.', 'MENTIU', 'PROMETO.', 'MEXER.', 'RANGE.', 'VOVÔ.'] }).esconder([[0, S.abre[1]], [FIM_FALA, 999]]);
const NOMES = { tiao: 'TIÃO', ze: 'SEU ZÉ', aninha: 'ANINHA' };

// ===================== RENDER =====================
const dentro = (t, janelas) => janelas.some(([a, b]) => t >= a && t < b);
const nasCostas = (crianca, adulto, t, janelas) => { if (!dentro(t, janelas)) return; const o = adulto.ombros(), q = adulto.quadril(), dir = Math.sign(o[0] - q[0]) || -1;
  crianca.grupo.setAttribute('transform', `translate(${(q[0] - dir * 34 * adulto.s).toFixed(1)} ${(q[1] - 190 * adulto.s).toFixed(1)})`); };
function desenhar(t) {
  $('#cam').setAttribute('transform', camEm(t));
  for (const A of ATORES) { const o = dentro(t, A.janelas); A.g.style.display = o ? '' : 'none'; if (o) A.b.desenhar(t); }
  for (const I of ITENS) I.g.style.display = dentro(t, I.janelas) ? '' : 'none';
  const sg = (window.SEGMENTOS || []).find(s => t >= s.de && t <= s.ate + 0.15 && NOMES[s.quem]);
  const qn = sg && t >= S.abre[1] && t < FIM_FALA ? NOMES[sg.quem] : '';
  $('#quem-t').textContent = qn; $('#quem').style.display = qn ? '' : 'none'; $('#quem-r').setAttribute('x', -(qn.length * 13 + 40)); $('#quem-r').setAttribute('width', qn.length * 26 + 80);
  const tranco = tt => (t > tt && t < tt + 0.7) ? Math.sin((t - tt) / 0.7 * Math.PI) * 32 : 0;
  $$('#c-mac .macaneta').forEach(m => m.setAttribute('transform', `rotate(${(-(tranco(W('N02', 2)) + tranco(W('N02', 5)))).toFixed(2)} 0 0)`));
  $$('.fita').forEach(fi => fi.setAttribute('transform', `rotate(${(Math.sin(t * 2.3) * 8).toFixed(2)} ${fi.dataset.cx} ${fi.dataset.cy})`));
  if (dentro(t, J('fita'))) { const m = tF.mao('d'); fitaMao.setAttribute('transform', `translate(${m[0].toFixed(1)} ${(m[1] - 6).toFixed(1)}) rotate(${(Math.sin(t * 2) * 6).toFixed(1)})`); }
  $$('.mosca').forEach(mo => { const i = +mo.dataset.i, a = t * (3 + i * 0.4) + i * 2.1, r = 26 + (i % 3) * 16; mo.setAttribute('transform', `translate(${(+mo.dataset.cx + Math.cos(a) * r * 1.4).toFixed(1)} ${(+mo.dataset.cy + Math.sin(a * 1.3) * r * 0.6).toFixed(1)})`); });
  const bate = Math.max(0, Math.sin(t * 2.2)) ** 3; folha.setAttribute('transform', `translate(142 893) scale(-0.66 0.84) rotate(${(8 + bate * 55).toFixed(1)} 0 0)`);
  // a tampa da caixa: treme quando algo se mexe; abre de vez quando a menina abre
  const mexe = W('N08', 12), abre = W('N11', 12), cyT = 1480 - 812 * 0.9;
  const ang = t < mexe ? 0 : t < abre ? Math.sin(t * 22) * 5 * Math.min(1, (t - mexe) / 0.4) : -Math.min(1, (t - abre) / 0.6) * 70;
  tampa.setAttribute('transform', `rotate(${ang.toFixed(2)} ${CX - 54} ${cyT.toFixed(1)})`);
  if (dentro(t, ATORES.find(A => A.b === aC).janelas)) aC.grupo.setAttribute('transform', `translate(0 ${(caixaY(t) - 1010).toFixed(1)})`);
  if (dentro(t, [[W('N11', 0), S.garrafa[1]]])) { const m = tZ.mao('d'); garrafa.setAttribute('transform', `translate(${m[0].toFixed(1)} ${(m[1] + 20).toFixed(1)})`); }
  if (dentro(t, J('flash'))) { const m = zF.mao('e'); panoF.setAttribute('transform', `translate(${m[0].toFixed(1)} ${(m[1] - 30).toFixed(1)})`); }
  if (dentro(t, JJ('rostos', 'chapeu'))) { const c = rostos[1].cabecaPos(); chapeu.setAttribute('transform', `translate(${c[0].toFixed(1)} ${(c[1] - 34).toFixed(1)})`); }
  if (dentro(t, J('porta'))) { const u = Math.max(0, t - S.porta[0] - 0.1); $$('.tabua').forEach(tb => { const i = +tb.dataset.i; tb.setAttribute('transform', `translate(${(470 + (i - 2) * 30 + u * (200 + i * 140)).toFixed(1)} ${(1110 - u * (300 - i * 40) + u * u * 900).toFixed(1)}) rotate(${(u * (200 + i * 90)).toFixed(1)})`); }); }
  nasCostas(aCostas, tR, t, ATE('fuga', 'rasga')); nasCostas(aAgua, tA, t, ATE('corrego', 'espera'));
  if (dentro(t, ATE('chegam', 'tranquei'))) { const o = tP.ombros(), q = tP.quadril(), k = tP.grupo.__k || 1; aCh.grupo.setAttribute('transform', `translate(${(505 + (o[0] - 505) * k).toFixed(1)} ${((tP.__fy || 1640) + (o[1] + 60 - (tP.__fy || 1640)) * k).toFixed(1)}) scale(${(k * 0.98).toFixed(3)}) translate(0 0)`); }
  if (dentro(t, [[W('P13', 0) - 0.3, S.fuga[1]]])) { const u = t - (W('P13', 0) - 0.3), q = tR.quadril(); sapatoCai.setAttribute('transform', `translate(${(q[0] + 40 + u * 120).toFixed(1)} ${Math.min(1600, q[1] + 60 + u * u * 1400).toFixed(1)}) rotate(${(u * 300).toFixed(1)})`); }
  if (dentro(t, [[W('N19', 3), S.rasga[1]]])) { const q = tR.quadril(); sangue.setAttribute('transform', `translate(${(q[0] + 10).toFixed(1)} ${(q[1] + 160).toFixed(1)})`); }
  // perspectiva da chegada pela porteira (vem de frente e cresce)
  if (dentro(t, ATE('chegam', 'tranquei'))) { const u = Math.min(1, (t - S.chegam[0]) / (S.chegam[1] - S.chegam[0])), fy = 1300 + 340 * u, k = 0.5 + 0.7 * u; tP.__fy = fy; tP.grupo.__k = k;
    tP.grupo.setAttribute('transform', `translate(505 ${fy.toFixed(1)}) scale(${k.toFixed(3)}) translate(-505 ${(-fy).toFixed(1)})`); }
  if (dentro(t, J('enxada'))) { const m = tE.mao('d'); enxadaE.setAttribute('transform', `translate(${m[0].toFixed(1)} ${(m[1] + 60).toFixed(1)}) rotate(28) scale(0.9)`); }
  if (dentro(t, JJ('vacas', 'feno', 'dialogo', 'morre', 'mexe'))) { const m = tK.mao('d'), abx = t > W('N29', 14) ? 1 : 0; enxadaK.setAttribute('transform', `translate(${m[0].toFixed(1)} ${(m[1] + 80).toFixed(1)}) rotate(${abx ? 70 : 8})`); }
  // o corpo do seu Zé tremendo quando volta
  if (dentro(t, J('mexe'))) zC.grupo.setAttribute('transform', `translate(${(Math.sin(t * 37) * 3 * Math.min(1, (t - S.mexe[0]) / 1.5)).toFixed(1)} 0)`);
  $$('#vacas').forEach(v => v.setAttribute('transform', `translate(${(Math.sin(t * 7) * (t >= S.vacas[0] && t < S.morre[1] ? 2.5 : 0)).toFixed(1)} 0)`));
  $$('.onda').forEach(o => o.setAttribute('transform', `translate(${((t * 30 + +o.dataset.i * 40) % 120 - 60).toFixed(1)} 0)`));
  $$('.neblina').forEach((n, i) => n.setAttribute('transform', `translate(${((t * 12 + i * 70) % 200 - 100).toFixed(1)} 0)`));
  $$('.estatica').forEach(e => e.setAttribute('opacity', (Math.abs(Math.sin(t * 91.7) * Math.cos(t * 37.3)) * 0.9).toFixed(2)));
}
window.__timeline = tl;
window.__duration = tl.duration();
window.__seek = t => { tl.seek(t, false); desenhar(t); leg.seek(t); };
document.fonts.ready.then(() => Palco.caberTextos(document));
window.__seek(0);
if (!rendering) { tl.eventCallback('onUpdate', () => { const t = tl.time(); desenhar(t); leg.seek(t); }); document.addEventListener('click', () => tl.paused() ? tl.play() : tl.pause()); }
</script>

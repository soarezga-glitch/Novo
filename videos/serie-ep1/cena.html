<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tênis Laranja: Episódio 1</title>
<!--
  Série "O garoto do tênis laranja" — EPISÓDIO 1 de 5 (narração em fala.mp3, 40,8 s).
  Protagonista: Léo = o SOBREVIVENTE (skill personagem-sobrevivente). Elenco fixo: Caio, Duda, Pedrão, a menina (skill elenco-serie).
  ENQUADRAMENTO GRANDE (como gravado no celular): personagens grandes, pés por volta de y = 1400, legenda embaixo (y = 1500),
  câmera com leve balanço de "câmera na mão", aproximações nas reações.
  Skills: edit, personagem-sobrevivente, elenco-serie, movimento-humano, figurino, fisica-de-cena, cenario-ilustrado (escola.js),
  objetos-detalhados, identidade-visual, legenda-dinamica, sons-de-ambiente.
-->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; display: block; }
  @font-face { font-family: 'Luckiest Guy'; src: url(fontes/luckiest-guy.woff2); }
  @font-face { font-family: 'Anton'; src: url(fontes/anton.woff2); }
  text:not([font-family]) { font-family: 'Luckiest Guy', 'DejaVu Sans', sans-serif; }
</style>
<script src="gsap.min.js"></script>
<script src="boneco.js"></script>
<script src="paletas.js"></script>
<script src="cenario.js"></script>
<script src="escola.js"></script>
<script src="detalhes.js"></script>
<script src="marca.js"></script>
<script src="palco.js"></script>
<script src="legenda.js"></script>
<script src="legenda-dados.js"></script>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
      <feFlood flood-color="#1D1D2B"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vin" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></radialGradient>
    <radialGradient id="sepia" cx=".5" cy=".45" r=".7"><stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#3A2410" stop-opacity=".7"/></radialGradient>
  </defs>
  <g id="cam"><g id="scenes"></g><g id="atores"></g><g id="props"></g><g id="primeiroPlano"></g></g>
  <g id="grades"></g>
  <g id="faixaLeg"></g>
  <g id="topo"></g>
  <g id="legenda"></g>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const LARANJA = '#FF7A00', PRETO = '#111111', L = '#1D1D2B';
const DT = Detalhes({ seed: 4 }), DTm = Detalhes({ seed: 8, sombra: false });
const Es = s => Escola(Cenario({ seed: s, luz: -1, hora: 'dia', prefixo: 'e' + s }));
const EsN = s => Escola(Cenario({ seed: s, luz: -1, hora: 'noite', prefixo: 'n' + s }));

// ===================== TEMPOS (planos) =====================
const S = {
  fachada:  [0, 3.65],      // "Meu nome é Léo. Primeiro dia na escola nova."
  corredor: [3.65, 7.55],   // "Eu só queria passar despercebido, mas estava com o tênis laranja."
  presente: [7.55, 9.84],   // "O último presente do meu pai."
  fila:     [9.84, 16.0],   // "Na fila do refeitório, um garoto alto olhou para os meus pés e riu. Olha o cenourinha!"
  trio:     [16.0, 19.4],   // "Era o Caio. O Duda e o Pedrão riram junto."
  canto:    [19.4, 22.08],  // "Eu abaixei a cabeça e fui para o canto."
  queda:    [22.08, 26.5],  // "Quando passei, o Caio esticou o pé. A bandeja voou."
  chao:     [26.5, 30.6],   // "Suco na camisa, arroz no chão, todo mundo rindo."
  menina:   [30.6, 32.96],  // "Só uma menina no fundo não ria."
  quarto:   [32.96, 35.62], // "À noite, meu celular vibrou."
  celular:  [35.62, 40.75], // "O Duda tinha filmado tudo. E o vídeo já tinha 2 mil visualizações."
};
const FIM_FALA = 40.75, END = 43.6;
const PE = 1400, PISO_LEG = 1500;          // pés de quem está na frente · altura da legenda (acima dos botões do app)
const KL = 1.45;                           // escala do Léo em plano inteiro grande (~810 px de altura)

// ===================== CENAS =====================
const scenes = [];
const cena = (id, corpo) => scenes.push(`<g id="${id}" class="scene">${corpo}</g>`);
const vin = `<rect width="1080" height="1920" fill="url(#vin)"/>`;
const etq = (id, x, y, t, fs = 48) => `<g id="${id}" transform="translate(${x} ${y})">${Marca.etiqueta(0, 0, t, { fs })}</g>`;
const apoio = (id, x, y, t, fs = 90, rot = -5) => `<g id="${id}" transform="translate(${x} ${y})">${Marca.apoio(0, 0, t, { fs, rot })}</g>`;
const imp = (id, x, y, t, fs = 150, rot = -4) => `<g id="${id}" transform="translate(${x} ${y})">${Marca.impacto(0, 0, t, { fs, rot })}</g>`;
// tênis laranja grande (de lado) — o presente do pai
const tenisGrande = (x, y, k = 1, esp = 1) => `<g transform="translate(${x} ${y}) scale(${k * esp} ${k})">
  <path d="M-150 -10 L-150 -70 Q-150 -110 -110 -112 L-40 -116 Q-10 -150 40 -140 L80 -96 Q150 -84 170 -40 L176 -10Z" fill="${LARANJA}" stroke="${L}" stroke-width="8" stroke-linejoin="round"/>
  <path d="M-160 -12 H184 Q190 10 170 14 H-150 Q-166 10 -160 -12Z" fill="#FFFFFF" stroke="${L}" stroke-width="7"/>
  <path d="M-120 -40 Q-40 -20 60 -60 Q100 -76 150 -50" stroke="${PRETO}" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M-30 -112 L10 -82 M-8 -126 L32 -96 M14 -136 L50 -104" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <path d="M-130 -100 Q-140 -60 -132 -30" stroke="${PRETO}" stroke-width="6" fill="none"/></g>`;

// 1. fachada da escola
cena('c-fachada', Es(1).fachada({ chao: 1240 }) + vin + `<g id="t-ep">${Marca.faixa(540, 150, 'PARTE 1', { fs: 92 })}</g>`);
// 2. corredor
cena('c-corredor', Es(2).corredor({ chao: 1160 }) + vin);
// 3. lembrança: a caixa com o tênis, presente do pai (tom sépia)
cena('c-presente', `<rect width="1080" height="1920" fill="#E8D2A8"/><rect y="1180" width="1080" height="740" fill="#A8743E"/>` + [0, 1, 2, 3, 4, 5].map(k => `<path d="M0 ${1210 + k * 120} H1080" stroke="#8A5A2E" stroke-width="5"/>`).join('') +
  `<g id="pr-caixa"><path d="M150 1330 L190 1060 H890 L930 1330Z" fill="#F2EEE6" stroke="${L}" stroke-width="10"/><path d="M190 1060 L230 980 H850 L890 1060Z" fill="#D9D2C4" stroke="${L}" stroke-width="8"/><rect x="430" y="1170" width="220" height="40" fill="${LARANJA}" stroke="${L}" stroke-width="5"/></g>` +
  `<g id="pr-tenis">${tenisGrande(380, 1080, 1.2)}${tenisGrande(720, 1110, 1.2)}</g>` +
  `<g transform="translate(540 760) rotate(-4)"><g id="pr-bilhete"><rect x="-320" y="-110" width="640" height="220" rx="10" fill="#FFFDF5" stroke="${L}" stroke-width="6"/><text y="-20" font-size="56" text-anchor="middle" fill="#5A3A1A" font-family="'DejaVu Serif', serif" font-style="italic">Pro meu campeão.</text><text y="62" font-size="48" text-anchor="middle" fill="#5A3A1A" font-family="'DejaVu Serif', serif" font-style="italic">— Pai</text><path d="M120 70 l14 -18 q10 14 -14 34 q-24 -20 -14 -34Z" fill="#D7263D"/></g></g>` +
  `<rect width="1080" height="1920" fill="#7A4A1A" opacity=".18"/><rect width="1080" height="1920" fill="url(#sepia)"/>`);
// 4. fila do refeitório (balcão atrás)
cena('c-fila', Es(4).refeitorio({ chao: 1150, balcao: true, mesasFundo: false }) + vin + `<g id="f-balao" transform="translate(720 330)">${Marca.balao(0, 0, 'OLHA O CENOURINHA!', { fs: 62, ponta: [40, 130] })}</g>`);
// 5. o trio
cena('c-trio', Es(5).refeitorio({ chao: 1100, balcao: false, mesasFundo: true }) + vin + etq('n-caio', 540, 420, 'CAIO', 56) + etq('n-duda', 240, 560, 'DUDA', 50) + etq('n-pedrao', 850, 500, 'PEDRÃO', 50));
// 6. indo para o canto (mesas ao fundo com alunos)
cena('c-canto', Es(6).refeitorio({ chao: 1100, balcao: false, mesasFundo: false }) + vin);
// 7. a queda (plano mais aberto)
cena('c-queda', Es(7).refeitorio({ chao: 1100, balcao: false, mesasFundo: false }) + vin + imp('q-crash', 600, 420, 'CRASH!', 160, 5));
// 8. no chão: suco na camisa, arroz no chão, todo mundo rindo
cena('c-chao', Es(8).refeitorio({ chao: 1100, balcao: false, mesasFundo: false }) + vin + `<g id="ch-arroz">${Es(8).arrozNoChao(760, 1440, 1.3)}</g>` +
  `<g id="ch-bandeja" transform="translate(930 1452) rotate(180)">${Es(8).bandeja(0, 0, 1.1, { suco: false, prato: false })}</g>` +
  ['KKKK', 'KKKKKK', 'HAHAHA'].map((t, i) => `<g id="ch-kk${i}" transform="translate(${[170, 540, 930][i]} ${[520, 470, 540][i]}) rotate(${[-8, 4, 9][i]})"><text font-size="64" text-anchor="middle" fill="#FFFFFF" stroke="${PRETO}" stroke-width="12" paint-order="stroke">${t}</text></g>`).join(''));
// 9. a menina no fundo que não ria
cena('c-menina', Es(9).refeitorio({ chao: 1100, balcao: false, mesasFundo: false }) + vin);
// 10. quarto à noite
cena('c-quarto', EsN(10).quarto({ chao: 1180, noite: true }) + `<g id="q-cama">${Es(10).cama(430, PE, 1.25)}</g>` + vin +
  `<g id="q-bzz"><path d="M-40 -10 l-20 -6 M-40 10 l-22 4 M40 -10 l20 -6 M40 10 l22 4" stroke="#FFE27A" stroke-width="8" stroke-linecap="round"/></g>` + apoio('q-bzzt', 760, 520, 'BZZZ!', 96, 6));
// 11. a tela do celular com o vídeo do Duda
{ const E = Es(11), x = 170, y = 220, w = 740, h = 1120;
  const conteudo = `<clipPath id="telaClip"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="20"/></clipPath><g clip-path="url(#telaClip)">${E.refeitorio({ x, y, w, h, chao: y + h * 0.55, balcao: false, mesasFundo: false })}<g id="cel-arroz">${E.arrozNoChao(x + w * 0.66, y + h * 0.8, 0.8)}</g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#000" opacity=".08"/></g>`;
  cena('c-celular', `<rect width="1080" height="1920" fill="#14183A"/><rect width="1080" height="1920" fill="url(#vin)"/>` + E.telaCelular(x, y, w, h, { views: '0', usuario: '@duda.zuera', legenda: 'KKKKK O CENOURINHA', conteudo }) +
    `<g id="cel-rec"><circle cx="${x + w - 50}" cy="${y + 160}" r="14" fill="#FF3B3B"/></g>`); }
// final
scenes.push(Marca.final({ linhas: ['PARTE 1', 'CONTINUA...'], destaque: 'PARTE 2', chamada: 'SEGUE PRA PARTE 2 ↓' }));
$('#scenes').innerHTML = scenes.join('');

// ===================== ELENCO (aparência fixa em todos os episódios) =====================
const LEO = { figurino: 'sobrevivente' };
const CAIO = { figurino: 'caio' }, DUDA = { figurino: 'duda' }, PEDRAO = { figurino: 'pedrao' }, MENINA = { figurino: 'menina' };
const ALUNOS = ['#5A7A9A', '#C98A3A', '#8A5A8A', '#4A8A6A', '#9A4A4A', '#6A6A7A'];
const aluno = (i, extra = {}) => ({ figurino: { preset: 'aluno', cor: ALUNOS[i % 6], corPernas: ['#2E3A4A', '#4A3A2A', '#3A3A3A'][i % 3], cabelo: ['curto', 'cacheado', 'longo', 'coque'][i % 4], corCabelo: ['#2A1E16', '#5A3A1A', '#1A1A1A', '#8A5A2A'][i % 4], ...extra }, seed: 20 + i });
const ATORES = [], ITENS = [];
function ator(escala, janelas, opts = {}, pai = '#atores') {
  const g = document.createElementNS(NS, 'g'); if (pai) $(pai).appendChild(g);
  const b = new Boneco(g, { escala, seed: 4, ...opts }); b.grupo = g;
  ATORES.push({ b, g, janelas }); return b;
}
function item(svg, janelas, pai = '#atores') { const g = document.createElementNS(NS, 'g'); $(pai).appendChild(g); g.innerHTML = svg; ITENS.push({ g, janelas }); return g; }
const J = n => [[S[n][0], S[n][1]]];
const E0 = Es(30);

// ===================== VIDA NO FUNDO (criada antes: fica atrás dos personagens principais) =====================
// alunos sentados comendo: banco, dois alunos de perfil (um de cada lado) e a mesa NA FRENTE deles (pernas debaixo da mesa)
function mesaComAlunos(x, yPiso, k, janelas, i0, { comem = true, riem = false } = {}) {
  item(E0.banco(x - 150 * k, yPiso, k, { largura: 200 }) + E0.banco(x + 150 * k, yPiso, k, { largura: 200 }), janelas);
  [[-1, i0], [1, i0 + 1]].forEach(([lado, i]) => { const a = ator(k, janelas, aluno(i)); const t0 = janelas[0][0], t1 = janelas[0][1];
    a.base(t0, t1, 'sentar', { x: x + lado * 150 * k, y: yPiso - 102 * k, chao: yPiso + 20 * k, dir: -lado });
    if (comem) a.braco('d', t0 + 0.2 + i * 0.3, t1, 'comer'); a.expressao(t0, t1, riem ? 'alegre' : 'feliz'); });
  item(E0.mesa(x, yPiso + 30 * k, k) + E0.bandeja(x - 60 * k, yPiso - 150 * k - 22 * k, 0.6 * k) + E0.bandeja(x + 70 * k, yPiso - 150 * k - 22 * k, 0.6 * k, { suco: false }), janelas);
}
// 1. fachada: alunos chegando na escola pela calçada
[[1180, 470, 4, 0.92], [1350, 600, 2, 0.88]].forEach(([de, ate, i, k]) => { const a = ator(k, J('fachada'), aluno(i)); a.base(S.fachada[0], S.fachada[1], 'andar', { de: [de, 1300], ate: [ate, 1300], passo: 100 * k }); a.expressao(S.fachada[0], S.fachada[1], 'feliz'); });
// 2. corredor: dupla conversando encostada nos armários, um aluno passando no fundo
{ const a = ator(1.0, J('corredor'), aluno(5)); a.base(S.corredor[0], S.corredor[1], 'parado', { x: 850, y: 1250, vista: 'perfil', dir: 1 }); a.braco('d', 4.0, S.corredor[1], 'explicar'); a.expressao(S.corredor[0], S.corredor[1], 'alegre');
  const b = ator(0.97, J('corredor'), aluno(2)); b.base(S.corredor[0], S.corredor[1], 'parado', { x: 975, y: 1245, vista: 'perfil', dir: -1 }); b.braco('ambos', S.corredor[0], S.corredor[1], 'cruzar'); b.expressao(S.corredor[0], S.corredor[1], 'feliz');
  const c = ator(0.55, J('corredor'), aluno(1)); c.base(S.corredor[0], S.corredor[1], 'andar', { de: [480, 1020], ate: [680, 1020], passo: 60 }); }
// 4. fila: merendeira servindo atrás do balcão (o balcão da frente cobre as pernas dela)
{ const m = ator(1.2, J('fila'), { figurino: 'merendeira', seed: 40 }); m.base(S.fila[0], S.fila[1], 'parado', { x: 930, y: 1150, vista: 'perfil', dir: -1 });
  m.braco('d', S.fila[0], S.fila[1], 'alcancar', { alvo: [800, 935] }); m.braco('e', 12.0, 13.2, 'estender'); m.expressao(S.fila[0], S.fila[1], 'feliz'); m.cabeca(13.5, 15.5, { virar: -0.4 });
  item(`<rect x="0" y="950" width="1080" height="200" fill="#B9BEC6" stroke="${L}" stroke-width="6"/><rect x="0" y="950" width="1080" height="30" fill="#E4E8EC" stroke="${L}" stroke-width="4"/><rect x="0" y="980" width="1080" height="16" fill="#000" opacity=".12"/>` + [...Array(7)].map((_, k) => `<path d="M${40 + k * 150} 1020 V1140" stroke="#8A9098" stroke-width="4"/><path d="M${46 + k * 150} 1020 V1140" stroke="#E4E8EC" stroke-width="2"/>`).join('') + `<rect x="760" y="922" width="160" height="32" rx="6" fill="#8A9098" stroke="${L}" stroke-width="4"/><ellipse cx="840" cy="922" rx="72" ry="13" fill="#F4F1E8"/>`, J('fila')); }
// 5. trio / 6. canto / 7. queda: mesas com alunos comendo ao fundo
mesaComAlunos(180, 1215, 0.72, J('trio'), 0); mesaComAlunos(930, 1215, 0.72, J('trio'), 2);
mesaComAlunos(260, 1190, 0.66, J('queda'), 4); 
mesaComAlunos(900, 1170, 0.62, J('menina'), 1, { riem: true });

// ---- 1. fachada: Léo chega andando e se vira para a câmera ----
const l1 = ator(KL, J('fachada'), LEO);
l1.base(0, 2.3, 'andar', { de: [-180, PE], ate: [520, PE] }); l1.base(2.3, S.fachada[1], 'parado', { x: 520, y: PE, vista: 'frente', transicao: 0.35 });
l1.expressao(0, 2.3, 'preocupado'); l1.expressao(2.3, S.fachada[1], 'normal'); l1.braco('d', 2.5, 3.6, 'acenar');
// ---- 2. corredor: cabeça baixa, alunos passando atrás ----
ator(1.05, [[S.corredor[0], 6.3]], aluno(0)).base(S.corredor[0], 6.3, 'andar', { de: [1150, 1250], ate: [-200, 1250], passo: 140 });
ator(1.0, [[S.corredor[0], 6.3]], aluno(3)).base(S.corredor[0], 6.3, 'andar', { de: [1400, 1240], ate: [-100, 1240], passo: 140 });
const l2 = ator(KL, J('corredor'), LEO);
l2.base(S.corredor[0], 6.4, 'andar', { de: [120, PE], ate: [600, PE], passo: 105 }); l2.base(6.4, S.corredor[1], 'parado', { x: 600, y: PE, vista: 'perfil', dir: 1 });
l2.cabeca(S.corredor[0], 6.4, { baixar: 16 }); l2.cabeca(6.4, S.corredor[1], { baixar: 26 }); l2.expressao(S.corredor[0], S.corredor[1], 'preocupado');
// ---- 4. fila: Léo com a bandeja; Caio (mais alto) na frente vira, olha os pés e ri ----
const l4 = ator(KL, J('fila'), LEO);
l4.base(S.fila[0], S.fila[1], 'parado', { x: 300, y: PE, vista: 'perfil', dir: 1 }); l4.braco('ambos', S.fila[0], S.fila[1], 'segurar');
l4.expressao(S.fila[0], 12.4, 'normal'); l4.expressao(12.4, 14.4, 'preocupado'); l4.expressao(14.4, S.fila[1], 'envergonhado'); l4.cabeca(14.4, S.fila[1], { baixar: 18 });
const c4 = ator(KL * 1.12, J('fila'), CAIO);
c4.base(S.fila[0], 11.6, 'parado', { x: 760, y: PE + 10, vista: 'perfil', dir: 1 }); c4.base(11.6, S.fila[1], 'parado', { x: 760, y: PE + 10, vista: 'perfil', dir: -1 });
c4.cabeca(12.4, 14.0, { baixar: 22 }); c4.expressao(S.fila[0], 13.9, 'serio'); c4.expressao(13.9, S.fila[1], 'alegre');
c4.braco('d', 14.3, S.fila[1], 'pose', { o: 40, c: 8, mao: 'apontar' });
// ---- 5. o trio rindo (de frente), com os nomes ----
const d5 = ator(KL * 0.97, J('trio'), DUDA); d5.base(S.trio[0], S.trio[1], 'parado', { x: 240, y: PE, vista: 'frente' }); d5.braco('d', S.trio[0], S.trio[1], 'contar', { mao: 'punho' }); d5.expressao(S.trio[0], S.trio[1], 'alegre');
const p5 = ator(KL * 1.04, J('trio'), PEDRAO); p5.base(S.trio[0], S.trio[1], 'parado', { x: 850, y: PE, vista: 'frente' }); p5.braco('ambos', 17.9, S.trio[1], 'cintura'); p5.expressao(S.trio[0], S.trio[1], 'alegre');
const c5 = ator(KL * 1.12, J('trio'), CAIO); c5.base(S.trio[0], S.trio[1], 'parado', { x: 540, y: PE + 30, vista: 'frente' }); c5.braco('ambos', S.trio[0], S.trio[1], 'cruzar'); c5.expressao(S.trio[0], S.trio[1], 'alegre');
// ---- 6. indo para o canto, cabeça baixa; mesa com alunos ao fundo ----
item(E0.banco(820, 1215, 0.8), J('canto'));
[[730, 0], [900, 1]].forEach(([x, i]) => { const a = ator(0.95, J('canto'), aluno(i + 1)); a.base(S.canto[0], S.canto[1], 'sentar', { x, y: 1215 - 102 * 0.8, chao: 1250, dir: -1 }); a.expressao(S.canto[0], S.canto[1], 'alegre'); a.cabeca(S.canto[0], S.canto[1], { virar: -0.3 }); });
item(E0.mesa(760, 1240, 0.85), J('canto'));   // mesa na frente deles (depois na ordem de pintura)
const l6 = ator(KL, J('canto'), LEO);
l6.base(S.canto[0], S.canto[1], 'andar', { de: [80, PE], ate: [560, PE], passo: 95 }); l6.braco('ambos', S.canto[0], S.canto[1], 'segurar');
l6.cabeca(S.canto[0], S.canto[1], { baixar: 24 }); l6.expressao(S.canto[0], S.canto[1], 'triste');
// ---- 7. a queda: Caio sentado no banco estica o pé; Léo tropeça; a bandeja voa ----

const folhas = (x, y, flip = 1) => `<g transform="translate(${x} ${y}) scale(${flip} 1)" filter="url(#desfoque)" opacity=".92">${[[-20, -260, -30], [40, -320, 5], [90, -240, 30], [10, -200, -55], [70, -380, 15]].map(([dx, dy, r]) => `<path d="M0 0 Q${dx * 0.4} ${dy / 2} ${dx} ${dy} Q${dx + 60} ${dy + 80} 10 0Z" fill="${r > 0 ? '#2E5A2E' : '#244A26'}" transform="rotate(${r} 0 0)"/>`).join('')}</g>`;

// roteiro de cores (paleta-de-epoca): cada plano com a emoção dele

  { el: $('#p-band4'), ator: l4, mao: 'ambos', janelas: J('fila'), dy: 8 },
  { el: $('#p-band6'), ator: l6, mao: 'ambos', janelas: J('canto'), dy: 8 },

];

// ===================== CÂMERA (na mão: leve balanço; aproximações nas reações) =====================
// chaves [t, escala, centroX, centroY]; entre chaves interpola suave; troca de plano = corte seco
const CAM = [
  [0, 1, 540, 960], [3.6, 1.04, 540, 960],
  [3.65, 1, 540, 960], [6.55, 1, 560, 960], [6.95, 2.3, 640, 1330], [7.5, 2.4, 640, 1340],
  [7.55, 1.0, 540, 960], [9.8, 1.08, 540, 1000],
  [9.84, 1, 540, 960], [13.4, 1.0, 540, 960], [13.8, 1.25, 520, 1100], [14.3, 1.25, 520, 1100], [14.6, 1.0, 540, 960], [16.0, 1.02, 540, 960],
  [16.0, 1, 540, 960], [19.4, 1.05, 540, 940],
  [19.4, 1, 480, 960], [22.08, 1, 600, 960],
  [22.08, 1, 540, 960], [26.5, 1, 540, 960],
  [26.5, 1.55, 380, 1080], [27.6, 1.55, 380, 1080], [28.7, 1.0, 540, 960], [30.6, 1.0, 540, 960],
  [30.6, 1.0, 540, 960], [32.9, 1.4, 540, 1000],
  [32.96, 1, 540, 960], [35.62, 1.06, 560, 1000],
  [35.62, 1, 540, 960], [40.75, 1.03, 540, 930],
  [40.75, 1, 540, 960], [99, 1, 540, 960],
];
const sm = u => u * u * (3 - 2 * u);
function camEm(t) {
  let a = CAM[0], b = CAM[0];
  for (let i = 0; i < CAM.length - 1; i++) if (t >= CAM[i][0] && t < CAM[i + 1][0]) { a = CAM[i]; b = CAM[i + 1]; break; }
  const u = b[0] > a[0] ? sm((t - a[0]) / (b[0] - a[0])) : 0;
  const k = a[1] + (b[1] - a[1]) * u, cx = a[2] + (b[2] - a[2]) * u, cy = a[3] + (b[3] - a[3]) * u;
  const bx = Math.sin(t * 1.3) * 4 + Math.sin(t * 3.1) * 1.5, by = Math.cos(t * 1.1) * 3 + Math.sin(t * 2.7) * 1.2, rot = Math.sin(t * 0.9) * 0.35;   // câmera na mão
  return `translate(${540 + bx} ${960 + by}) rotate(${rot.toFixed(3)}) scale(${k.toFixed(4)}) translate(${-cx} ${-cy})`;
}

// ===================== TIMELINE =====================
const rendering = navigator.webdriver;
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut' } });
$$('.scene').forEach(s => gsap.set(s, { autoAlpha: 0 }));
function show(sel, t0, t1) {
  tl.fromTo(sel, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, ease: 'none', immediateRender: false }, t0);
  if (t1 != null) tl.to(sel, { autoAlpha: 0, duration: 0.01, ease: 'none' }, t1);
}
function pop(sel, t, d = 0.4, ease = 'back.out(2.4)') {
  gsap.set(sel, { autoAlpha: 0, scale: 0.2, transformOrigin: '50% 50%' });
  tl.fromTo(sel, { autoAlpha: 0, scale: 0.2 }, { autoAlpha: 1, scale: 1, duration: d, ease, immediateRender: false }, t);
}
function hide(sel, t, d = 0.2) { tl.to(sel, { autoAlpha: 0, duration: d, ease: 'power1.in' }, t); }
function treme(sel, t, dur = 0.5, forca = 10) { tl.to(sel, { x: `+=${forca}`, duration: 0.05, repeat: Math.round(dur / 0.05), yoyo: true }, t).set(sel, { x: 0 }, t + dur + 0.06); }
const IDS = { fachada: 'c-fachada', corredor: 'c-corredor', presente: 'c-presente', fila: 'c-fila', trio: 'c-trio', canto: 'c-canto', queda: 'c-queda', chao: 'c-chao', menina: 'c-menina', quarto: 'c-quarto', celular: 'c-celular' };

// ===================== LEGENDA embaixo (sobre o chão, acima dos botões do app) =====================
const leg = Legenda($('#legenda'), window.PALAVRAS || [], { y: PISO_LEG, enfase: ['LÉO', 'LARANJA', 'CENOURINHA!', 'CAIO', 'DUDA', 'PEDRÃO', 'MIL'] }).esconder([[FIM_FALA, 999]]);

// ===================== RENDER =====================
function opacidade(t, janelas) { for (const [a, b] of janelas) if (t >= a && t < b) return 1; return 0; }
function desenhar(t) {
  $('#cam').setAttribute('transform', camEm(t));
  gradeEls.forEach(G => G.g.style.display = t >= G.de && t < G.ate ? '' : 'none');
  { const g = $('#gradeTensaoFila'), u = t >= 14.2 && t < S.fila[1] ? Math.min(1, (t - 14.2) / 0.5) : 0; g.style.display = u ? '' : 'none'; g.setAttribute('opacity', (u * 0.7).toFixed(2)); }
  // sinais de vida: vapor da comida, ponteiro do relógio, bandeira, faixa, luzinhas, lâmpada falhando
  $$('.vapor').forEach(v => { const ph = (t * 0.6 + +v.dataset.fase) % 1; v.setAttribute('transform', `translate(0 ${(-ph * 50).toFixed(1)})`); v.setAttribute('opacity', (Math.sin(ph * Math.PI) * 0.9).toFixed(2)); });
  $$('.ponteiro').forEach(p => p.setAttribute('transform', `rotate(${(t * 6).toFixed(1)} ${p.dataset.cx} ${p.dataset.cy})`));
  $$('.bandeira').forEach(b => b.setAttribute('transform', `rotate(${(Math.sin(t * 3.2) * 3).toFixed(2)} ${b.dataset.cx} ${b.dataset.cy}) skewY(${(Math.sin(t * 4.1) * 2).toFixed(2)})`));
  $$('.faixa-balanca').forEach(b => b.setAttribute('transform', `rotate(${(Math.sin(t * 1.7) * 1.2).toFixed(2)} ${b.dataset.cx} ${b.dataset.cy})`));
  $$('.luzinha').forEach(l => l.setAttribute('opacity', (0.55 + 0.45 * Math.sin(t * 2.4 + +l.dataset.fase)).toFixed(2)));
  $$('.lampada').forEach((l, i) => l.setAttribute('opacity', i === 2 && Math.sin(t * 13) > 0.85 ? '0.4' : '1'));
  for (const A of ATORES) { const o = opacidade(t, A.janelas); A.g.style.display = o ? '' : 'none'; if (o) A.b.desenhar(t); }
  for (const I of ITENS) I.g.style.display = opacidade(t, I.janelas) ? '' : 'none';
  for (const P of PROPS) {
    if (!opacidade(t, P.janelas)) { P.el.style.display = 'none'; continue; }
    const m = P.mao === 'ambos' ? [(P.ator.mao('e')[0] + P.ator.mao('d')[0]) / 2, (P.ator.mao('e')[1] + P.ator.mao('d')[1]) / 2] : P.ator.mao(P.mao);
    const v = P.vibra && t >= P.vibra[0] && t < P.vibra[1] ? Math.sin(t * 90) * 5 : 0;
    P.el.style.display = ''; P.el.setAttribute('transform', `translate(${(m[0] + v).toFixed(1)} ${(m[1] + (P.dy || 0)).toFixed(1)})`);
  }
  // bandeja voando: sai das mãos e cai girando à frente (arco de parábola), contato no chão em 25,6 s
  if (t >= 24.35 && t < 25.8) { const u = Math.min(1, (t - 24.35) / 1.25), x = 520 + 430 * u, y = 1180 - 260 * Math.sin(Math.PI * u * 0.85) + 300 * u * u;
    bandejaVoa.setAttribute('transform', `translate(${x.toFixed(1)} ${Math.min(PQ, y).toFixed(1)}) rotate(${(u * 400).toFixed(1)})`); }
  // contador de visualizações subindo
  const vn = $('.views-num'); if (vn) { const u = Math.max(0, Math.min(1, (t - 37.9) / 1.4)), n = Math.round(2000 * u * u); vn.textContent = n >= 2000 ? '2 MIL VISUALIZAÇÕES' : `${n.toLocaleString('pt-BR')} VISUALIZAÇÕES`; }
}
window.__timeline = tl;
window.__duration = tl.duration();
window.__seek = t => { tl.seek(t, false); desenhar(t); leg.seek(t); };
document.fonts.ready.then(() => Palco.caberTextos(document));
window.__seek(0);
if (!rendering) { tl.eventCallback('onUpdate', () => { const t = tl.time(); desenhar(t); leg.seek(t); }); document.addEventListener('click', () => tl.paused() ? tl.play() : tl.pause()); }
</script>

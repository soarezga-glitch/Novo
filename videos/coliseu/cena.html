<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Acordei no Coliseu</title>
<!--
  Vídeo vertical (1080x1920) — "Acordei embaixo do Coliseu" (narração em fala.mp3).
  Skills: edit (render), movimento-humano (bonecos), figurino (gladiadores), cenario-ilustrado (+ arena.js),
  paleta-de-epoca, objetos-detalhados, identidade-visual, sons-de-ambiente. Sem legenda: só palavras de impacto.
  Cenários na timeline GSAP (tl); bonecos desenhados por boneco.js em __seek.
-->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; display: block; }
  @font-face { font-family: 'Luckiest Guy'; src: url(fontes/luckiest-guy.woff2); }
  text:not([font-family]) { font-family: 'Luckiest Guy', 'DejaVu Sans', sans-serif; }
</style>
<script src="gsap.min.js"></script>
<script src="lipsync.js" onerror="window.LIPSYNC = null"></script>
<script src="boneco.js"></script>
<script src="paletas.js"></script>
<script src="cenario.js"></script>
<script src="arena.js"></script>
<script src="objetos.js"></script>
<script src="detalhes.js"></script>
<script src="animal.js"></script>
<script src="marca.js"></script>
<script src="legenda.js"></script>
<script src="legenda-dados.js"></script>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
      <feFlood flood-color="#1D1D2B"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="desfoque"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="tochaLuz" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFB347" stop-opacity=".55"/><stop offset="1" stop-color="#FF6A2B" stop-opacity="0"/></radialGradient>
    <mask id="povMask"><rect width="1080" height="1920" fill="#fff"/><ellipse id="pov-o1" cx="390" cy="900" rx="92" ry="96" fill="#000"/><ellipse id="pov-o2" cx="690" cy="900" rx="92" ry="96" fill="#000"/></mask>
  </defs>
  <g id="scenes"></g>
  <g id="atores"></g>
  <g id="fgs"></g>
  <g id="props"></g>
  <g id="voos"></g>
  <g id="legenda"></g>
  <g id="topo"></g>
</svg>

<script>
// ===================== CONFIG =====================
const CONFIG = { fps: 30, seed: 17, cauda: 2.2 };
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const LARANJA = '#FF7A00', PRETO = '#111111';
function card(id, n, titulo, icone) { return Marca.cartao({ id, numero: `${n}º`, titulo, icone }); }
// objetos em destaque (skill "objetos-detalhados")
const DT = Detalhes({ seed: 4 }), DTr = Detalhes({ seed: 6, luz: 1 }), DTm = Detalhes({ seed: 8, sombra: false }), DTmr = Detalhes({ seed: 9, luz: 1, sombra: false });
// poeira caindo das frestas do teto
const poeira = (id, xs, y0, y1, n = 14) => `<g id="${id}">${xs.map((x, j) => [...Array(n)].map((_, i) => `<circle class="${id}-p" data-j="${j}" cx="${x + ((i * 37) % 50) - 25}" cy="${y0}" r="${2 + (i % 3)}" fill="#E8D6A8" opacity=".9"/>`).join('')).join('')}</g>`;
// tremido (linhas de som) em volta de um ponto
const somLinhas = (id, x, y, r = 60, rot = 0) => `<g id="${id}" transform="translate(${x} ${y}) rotate(${rot})" stroke="${PRETO}" stroke-width="10" fill="none" stroke-linecap="round">${[0, 1, 2].map(k => `<path d="M${r + k * 30} ${-30 - k * 12} Q${r + 16 + k * 30} 0 ${r + k * 30} ${30 + k * 12}" stroke="${LARANJA}"/>`).join('')}</g>`;

// ===================== CENAS =====================
const scenes = [];
// S1 — cela embaixo do Coliseu (0–15): pedra fria, palha, grade, teto de tábuas com frestas
{ const C = Cenario({ epoca: 'roma', seed: 3, luz: -1, hora: 'interior', prefixo: 'c1' }), A = Arena(C), O = Objetos(C);
  let v = `<g id="s1" class="scene"><defs>${C.defs()}</defs>` + A.blocos({ x: 0, y: 0, w: 1080, h: 1720, cor: '#8E8170' });
  v += `<rect x="720" y="380" width="360" height="1330" fill="#1A1416"/>` + A.grade({ x: 730, y: 380, w: 340, h: 1330, barras: 6, travessas: 3 });
  v += `<rect x="0" y="1700" width="1080" height="220" fill="#6E6456"/>` + C.piso({ y: 1712, h: 208, cor: '#7E7464' });
  // corrente na parede, prateleira com espadas de treino, balde
  v += `<circle cx="170" cy="880" r="18" fill="none" stroke="#3A3A40" stroke-width="8"/>` + [...Array(9)].map((_, k) => `<ellipse cx="${170 + (k % 2) * 3}" cy="${910 + k * 30}" rx="${k % 2 ? 7 : 12}" ry="17" fill="none" stroke="#3A3A40" stroke-width="7"/>`).join('');
  v += [0, 1, 2].map(k => DT.rudis(420 + k * 70, 1180 - k * 6, 0.5, { rot: -82 })).join('') + `<rect x="360" y="1180" width="260" height="20" fill="#6E4524" stroke="#1D1D2B" stroke-width="5"/>`;
  v += O.tocha(70, 1712, 0.8);
  // palha onde ele acorda
  v += `<path d="M160 1712 Q420 1650 700 1712Z" fill="#C9A24A" stroke="#1D1D2B" stroke-width="5"/>` + [...Array(46)].map((_, k) => `<path d="M${180 + (k * 53) % 500} ${1700 - (k * 17) % 38} l${(k % 2 ? 1 : -1) * (14 + k % 9)} ${-4 - k % 6}" stroke="${['#E8C86A', '#B08A3A', '#D9B45A'][k % 3]}" stroke-width="4" stroke-linecap="round"/>`).join('');
  v += `<path d="M640 1712 h70 l-8 -70 h-54z" fill="#6E4524" stroke="#1D1D2B" stroke-width="5"/><ellipse cx="675" cy="1642" rx="28" ry="7" fill="#3A2A1E"/>`;
  v += `<g id="s1-teto">` + A.tetoFrestas({ y: 0, h: 300, frestas: [240, 520, 860], id: 's1-raios', chao: 1712 }) + `</g>`;
  v += poeira('s1-po', [240, 520, 860], 270, 1700);
  // o cheiro: suor, ferro e bicho (ícones)
  v += `<g id="s1-gota" transform="translate(250 1080)"><path d="M0 -70 C40 -10 50 20 50 40 A50 50 0 0 1 -50 40 C-50 20 -40 -10 0 -70Z" fill="#8FD3FF" stroke="#1D1D2B" stroke-width="8"/><ellipse cx="-16" cy="22" rx="10" ry="16" fill="#fff" opacity=".8"/></g>`;
  v += `<g id="s1-ferro" transform="translate(540 1000)">${[0, 1, 2].map(k => `<ellipse cx="${-60 + k * 60}" cy="0" rx="40" ry="24" fill="none" stroke="#1D1D2B" stroke-width="22"/><ellipse cx="${-60 + k * 60}" cy="0" rx="40" ry="24" fill="none" stroke="#9AA0A8" stroke-width="12"/>`).join('')}</g>`;
  v += `<g id="s1-bicho" transform="translate(830 1080)"><ellipse cx="0" cy="20" rx="44" ry="38" fill="#6E4A2E" stroke="#1D1D2B" stroke-width="7"/>${[[-48, -36], [-16, -62], [18, -62], [50, -36]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="17" ry="21" fill="#6E4A2E" stroke="#1D1D2B" stroke-width="6"/>`).join('')}</g>`;
  v += `<g id="s1-cheiro" stroke="#9BBF4A" stroke-width="10" fill="none" stroke-linecap="round">${[250, 540, 830].map(x => `<path d="M${x - 20} 940 q20 -30 0 -60 q-20 -30 0 -60"/>`).join('')}</g>`;
  v += `<g id="s1-uuh" transform="translate(540 470)">${Marca.apoio(0, 0, 'UUUUH!', { fs: 110, rot: -4 })}</g>`;
  v += `<g id="s1-confusao">${Paleta.grade('confusao')}</g><g id="s1-descoberta">${Paleta.grade('descoberta')}</g>` + C.atmosfera({ grao: 0.3 }) + `</g>`;
  scenes.push(v); }

// S2 — o Coliseu por fora, em corte: "você está aqui" embaixo da arena (15–17)
{ const C = Cenario({ epoca: 'roma', seed: 5, luz: -1, hora: 'dia', prefixo: 'c2' }), A = Arena(C);
  let v = `<g id="s2" class="scene"><defs>${C.defs()}</defs><g id="s2-zoom">` + C.ceu({ astroX: 180, astroY: 260, nuvens: 3 });
  v += C.distante({ y: 1000, tipo: 'roma', profundidade: 0.15 });
  v += C.coliseu({ x: 40, base: 1240, w: 1000, h: 560 });
  v += C.cipreste(60, 1250, 260) + C.cipreste(1030, 1250, 300);
  // corte do chão: terra e o subsolo (hipogeu) com túneis e celas
  v += `<rect x="0" y="1240" width="1080" height="680" fill="#7A5A3A"/><rect x="0" y="1240" width="1080" height="24" fill="#5E8A3A"/>`;
  v += `<rect x="90" y="1320" width="900" height="420" fill="#3A2C24" stroke="#1D1D2B" stroke-width="8"/>`;
  for (let k = 0; k < 6; k++) v += A.arco({ x: 130 + k * 145, base: 1700, w: 100, h: 230, espessura: 18 });
  v += `<rect x="90" y="1320" width="900" height="40" fill="#6E4524" stroke="#1D1D2B" stroke-width="6"/>${[...Array(12)].map((_, k) => `<rect x="${150 + k * 72}" y="1322" width="5" height="36" fill="#FFF4C9"/>`).join('')}`;
  v += [...Array(60)].map((_, k) => `<circle cx="${(k * 97) % 1080}" cy="${1780 + (k * 31) % 130}" r="${4 + k % 5}" fill="#5E4430"/>`).join('');
  v += `<g id="s2-voce"><circle cx="560" cy="1640" r="40" fill="${LARANJA}" opacity=".35"/><circle cx="560" cy="1640" r="16" fill="${LARANJA}" stroke="#1D1D2B" stroke-width="5"/><path d="M560 1590 V1480" stroke="#1D1D2B" stroke-width="14" stroke-linecap="round"/><path d="M560 1590 V1480" stroke="${LARANJA}" stroke-width="7" stroke-linecap="round"/><path d="M536 1560 L560 1600 L584 1560" stroke="#1D1D2B" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M536 1560 L560 1600 L584 1560" stroke="${LARANJA}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(560 1430)">${Marca.etiqueta(0, 0, 'VOCÊ ESTÁ AQUI', { fs: 46 })}</g></g>`;
  v += `</g><g id="s2-banner" transform="translate(540 470)">${Marca.faixa(0, 0, 'COLISEU', { fs: 120 })}</g>` + Paleta.grade('descoberta') + C.atmosfera({ grao: 0.25, raios: true }) + `</g>`;
  scenes.push(v); }

// S3 — corredor de treino: o treinador joga a espada de madeira (17–24)
{ const C = Cenario({ epoca: 'roma', seed: 8, luz: -1, hora: 'interior', prefixo: 'c3' }), A = Arena(C), O = Objetos(C);
  let v = `<g id="s3" class="scene"><defs>${C.defs()}</defs>` + A.blocos({ x: 0, y: 0, w: 1080, h: 1720, cor: '#98897A' });
  v += A.arco({ x: 120, base: 1712, w: 320, h: 760, espessura: 50 }) + A.arco({ x: 640, base: 1712, w: 320, h: 760, espessura: 50 });
  v += A.tetoFrestas({ y: 0, h: 220, frestas: [300, 760], id: 's3-raios', chao: 1712 });
  v += C.piso({ y: 1712, h: 208, cor: '#7E7464' });
  // poste de treino (palus) cheio de marcas de golpe
  v += `<rect x="960" y="1180" width="56" height="532" fill="#8A5A2E" stroke="#1D1D2B" stroke-width="6"/>${[...Array(9)].map((_, k) => `<path d="M${966 + (k % 3) * 12} ${1240 + k * 50} l${30 - (k % 2) * 14} ${-8 + (k % 3) * 4}" stroke="#5A3A1E" stroke-width="4"/>`).join('')}<rect x="950" y="1700" width="76" height="16" fill="#5A3A1E" stroke="#1D1D2B" stroke-width="4"/>`;
  v += O.tocha(560, 1712, 0.75) + [0, 1].map(k => DT.rudis(70 + k * 60, 1300, 0.5, { rot: -80 })).join('') + DT.escudo(250, 1580, 0.45);
  v += `<g id="s3-treina" transform="translate(790 1010)">${Marca.balao(0, 0, 'TREINA!', { fs: 92, ponta: [40, 150] })}</g>`;
  v += `<g id="s3-glad" transform="translate(540 760)">${Marca.impacto(0, 0, 'GLADIADOR?!', { fs: 132 })}</g>` + Paleta.grade('tensao').replace('opacity="0.3"', 'opacity="0.15"') + C.atmosfera({ grao: 0.3 }) + `</g>`;
  scenes.push(v); }

// cartão 1 — a comida
scenes.push(card('c1', 1, 'A COMIDA', DT.tigela(0, 130, 1.0)));

// S4 — refeitório dos gladiadores: tigela de cevada com feijão e água com cinza (26–36.2)
{ const C = Cenario({ epoca: 'roma', seed: 11, luz: -1, hora: 'interior', prefixo: 'c4' }), A = Arena(C), O = Objetos(C);
  let v = `<g id="s4" class="scene"><defs>${C.defs()}</defs>` + A.blocos({ x: 0, y: 0, w: 1080, h: 1720, cor: '#A08E78' });
  v += `<rect x="380" y="260" width="320" height="200" fill="#FFF0C0"/>` + A.grade({ x: 380, y: 260, w: 320, h: 200, barras: 5, travessas: 2 }) + `<path d="M380 460 L170 1300 H900 L700 460Z" fill="#FFF0C0" opacity=".12"/>`;
  v += O.tocha(80, 1712, 0.7) + O.tocha(1000, 1712, 0.7);
  v += `<rect x="0" y="1300" width="1080" height="40" fill="#6E4524" stroke="#1D1D2B" stroke-width="5"/><rect x="0" y="1384" width="1080" height="18" fill="#7A5030" stroke="#1D1D2B" stroke-width="4"/>${[80, 400, 700, 1000].map(x => `<rect x="${x}" y="1402" width="16" height="60" fill="#5A3A1E"/>`).join('')}<rect x="0" y="1460" width="1080" height="260" fill="#857664"/>`;   // mesa e banco do fundo
  v += C.piso({ y: 1712, h: 208, cor: '#7E7464' });
  v += `<g id="s4-cev" transform="translate(600 1210)">${Marca.etiqueta(0, 0, 'CEVADA', { fs: 46 })}</g><g id="s4-fei" transform="translate(800 1130)">${Marca.etiqueta(0, 0, 'FEIJÃO', { fs: 46 })}</g>`;
  v += `<g id="s4-agua" transform="translate(860 1110)">${Marca.etiqueta(0, 0, 'ÁGUA + CINZA', { fs: 46 })}</g>`;
  v += `<g id="s4-ossos">${Marca.carimbo(540, 780, 'OSSOS FORTES', { fs: 92, rot: -8 })}</g>`;
  v += `<g id="s4-nojo">${Paleta.grade('nojo')}</g>` + C.atmosfera({ grao: 0.3 }) + `</g>`;
  scenes.push(v); }

// cartão 2 — a espera
scenes.push(card('c2', 2, 'A ESPERA', DT.leao(-30, 130, 0.58, { rugindo: true })));

// S5 — túnel das jaulas: leão, urso e a multidão lá em cima (38.3–47.2)
{ const C = Cenario({ epoca: 'roma', seed: 14, luz: -1, hora: 'interior', prefixo: 'c5' }), A = Arena(C);
  let v = `<g id="s5" class="scene"><defs>${C.defs()}</defs>` + A.blocos({ x: 0, y: 0, w: 1080, h: 1760, cor: '#8A7C6A' });
  v += Paleta.grade('tensao');   // clima tenso só no fundo: as feras ficam com a cor viva
  // jaulas: fundo escuro, bicho, sombra por cima, grade
  v += `<rect x="20" y="760" width="440" height="980" fill="#4A3C34"/><rect x="620" y="760" width="440" height="980" fill="#4A3C34"/><rect x="20" y="1600" width="440" height="140" fill="#5A4A3A"/><rect x="620" y="1600" width="440" height="140" fill="#5A4A3A"/>`;
  // feras animadas (skill animacao-animal), presas dentro das jaulas
  v += `<clipPath id="jaulaE"><rect x="20" y="760" width="440" height="980"/></clipPath><clipPath id="jaulaD"><rect x="620" y="760" width="440" height="980"/></clipPath>`;
  v += `<g clip-path="url(#jaulaE)"><g id="s5-leao"></g></g><g clip-path="url(#jaulaD)"><g id="s5-urso"></g></g>`;
  v += `<rect id="s5-escuro1" x="20" y="760" width="440" height="980" fill="#0A0608" opacity=".05"/><rect id="s5-escuro2" x="620" y="760" width="440" height="980" fill="#0A0608" opacity=".05"/>`;
  v += `<g id="s5-jaula1">${A.grade({ x: 30, y: 760, w: 420, h: 980, barras: 6, travessas: 3 })}</g><g id="s5-jaula2">${A.grade({ x: 630, y: 760, w: 420, h: 980, barras: 6, travessas: 3 })}</g>`;
  v += `<rect x="0" y="1740" width="1080" height="180" fill="#6E6456"/>` + C.piso({ y: 1752, h: 168, cor: '#7E7464' });
  v += `<g id="s5-teto">` + A.tetoFrestas({ y: 0, h: 240, frestas: [270, 540, 820], id: 's5-raios', chao: 1752 }) + `</g>`;
  v += poeira('s5-po', [540], 210, 1300, 22);
  v += `<path d="M470 1652 h140 v100 h-140z" fill="#9C8F7C" stroke="#1D1D2B" stroke-width="6"/><path d="M470 1652 h140 v14 h-140z" fill="#B9AC98"/>`;   // bloco onde ele senta
  v += `<g id="s5-g1" transform="translate(240 640)">${Marca.apoio(0, 0, 'GRRR!', { fs: 100, rot: -6 })}</g><g id="s5-g2" transform="translate(850 640)">${Marca.apoio(0, 0, 'GRRR!', { fs: 100, rot: 6 })}</g>`;
  v += `<g id="s5-uuh" transform="translate(540 420)">${Marca.apoio(0, 0, 'UUUUH!', { fs: 110, rot: 3 })}</g>`;
  v += C.atmosfera({ grao: 0.3 }) + `</g>`;
  scenes.push(v); }

// cartão 3 — o capacete
scenes.push(card('c3', 3, 'O CAPACETE', DT.capacete(0, 120, 0.8)));

// S6 — com o capacete (50–52.2) e a visão pelos dois furinhos (52.2–56)
{ const C = Cenario({ epoca: 'roma', seed: 18, luz: -1, hora: 'interior', prefixo: 'c6' }), A = Arena(C);
  const tunel = (pref) => A.blocos({ x: 0, y: 0, w: 1080, h: 1760, cor: '#857766' }) + A.arco({ x: 300, base: 1760, w: 480, h: 1100, espessura: 60, fundo: 'luz' }) + A.grade({ x: 310, y: 900, w: 460, h: 860, barras: 6, travessas: 3 }) + `<rect x="0" y="1752" width="1080" height="168" fill="#6E6456"/>` + C.piso({ y: 1760, h: 160, cor: '#7E7464' });
  scenes.push(`<g id="s6" class="scene"><defs>${C.defs()}</defs>${tunel()}${Paleta.grade('tensao')}${C.atmosfera({ grao: 0.3 })}</g>`);
  scenes.push(`<g id="s6b" class="scene"><g id="s6b-vista" filter="url(#desfoque)">${tunel()}</g>
    <g id="s6b-bafo"><ellipse cx="390" cy="960" rx="90" ry="60" fill="#fff" opacity=".0"/><ellipse cx="690" cy="960" rx="90" ry="60" fill="#fff" opacity=".0"/></g>
    <rect width="1080" height="1920" fill="#0B0B10" mask="url(#povMask)"/>
    <ellipse cx="390" cy="900" rx="96" ry="100" fill="none" stroke="#2A2A30" stroke-width="12"/><ellipse cx="690" cy="900" rx="96" ry="100" fill="none" stroke="#2A2A30" stroke-width="12"/>
    <path d="M0 0 H1080 V1920 H0Z" fill="none" stroke="#000" stroke-width="0"/></g>`); }

// S7 — túnel escuro até o portão (56–61): empurrado pelo guarda; o portão sobe e a luz invade
{ const C = Cenario({ epoca: 'roma', seed: 21, luz: 1, hora: 'interior', prefixo: 'c7' }), A = Arena(C), O = Objetos(C);
  let v = `<g id="s7" class="scene"><defs>${C.defs()}</defs>` + A.blocos({ x: 0, y: 0, w: 1080, h: 1720, cor: '#6E6254' });
  v += `<rect x="0" y="0" width="1080" height="160" fill="#2A1E18"/>` + [...Array(6)].map((_, k) => `<path d="M${-40 + k * 200} 160 Q${60 + k * 200} 60 ${160 + k * 200} 160" fill="none" stroke="#4A3A2E" stroke-width="40"/>`).join('');
  v += `<rect x="830" y="560" width="250" height="1160" fill="#FFF6D6"/><rect x="780" y="440" width="300" height="1300" fill="url(#tochaLuz)" opacity=".0"/>`;
  v += `<g id="s7-portao">` + A.grade({ x: 840, y: 560, w: 240, h: 1160, barras: 4, travessas: 4 }) + `</g>`;
  v += `<path d="M830 560 L0 1300 V1720 L830 1720Z" fill="#FFF6D6" opacity=".06"/>`;
  v += `<rect x="0" y="1712" width="1080" height="208" fill="#5E5446"/>` + C.piso({ y: 1720, h: 200, cor: '#6E6456' }) + O.tocha(300, 1720, 0.7);
  v += `<g id="s7-escuro">${Paleta.grade('tensao')}${Paleta.grade('misterio')}</g>` + C.atmosfera({ grao: 0.3 }) + `</g>`;
  scenes.push(v); }

// S8 — a arena (61–80): velário, arquibancada lotada, camarote do imperador, pódio, areia
{ const C = Cenario({ epoca: 'roma', seed: 25, luz: 1, hora: 'dia', prefixo: 'c8' }), A = Arena(C);
  let v = `<g id="s8" class="scene"><defs>${C.defs()}</defs>` + C.ceu({ astroX: 900, astroY: 120, nuvens: 1 });
  v += `<rect x="0" y="200" width="1080" height="900" fill="#C9B08A"/>`;
  v += A.arquibancada({ y0: 230, y1: 1080, fileiras: 9, bracos: 0.35 });
  v += A.vomitorio(120, 520) + A.vomitorio(860, 700);
  v += A.camarote({ x: 380, y: 1020, w: 320, h: 250 });

// ===================== API DO RENDER =====================
function opacidade(t, janelas) {
  let o = 0;
  for (const [a, b] of janelas) {
    if (t < a || t > b + FADE) continue;
    const ent = a === 0 ? 1 : Math.min(1, (t - a) / FADE), sai = t <= b ? 1 : 1 - (t - b) / FADE;
    o = Math.max(o, Math.min(ent, sai));
  }
  return o;
}
function desenharAtores(t) {
  for (const A of ATORES) {
    const o = opacidade(t, A.janelas);
    A.g.style.display = o > 0 ? '' : 'none';
    A.g.setAttribute('opacity', o.toFixed(3));
    if (o > 0) A.b.desenhar(t);
  }
  const usados = new Set();
  for (const P of PROPS) {
    const o = opacidade(t, P.janelas);
    if (o <= 0) { if (!usados.has(P.el)) P.el.style.display = 'none'; continue; }
    usados.add(P.el);
    const [x, y] = P.ator.mao(P.mao);
    P.el.style.display = '';
    P.el.setAttribute('opacity', o.toFixed(3));
    P.el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${P.escala})`);
  }
}
window.__timeline = tl;

  document.addEventListener('click', () => tl.paused() ? tl.play() : tl.pause());
}
